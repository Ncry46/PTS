<style>
  .cm-page {
    max-width: 720px;
    margin: 0 auto;
  }
  .cm-hero {
    margin-bottom: 1.25rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--pts-border);
  }
  .cm-brand {
    display: block;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--pts-primary);
    margin-bottom: 0.45rem;
  }
  .cm-hero h1 {
    margin: 0;
    font-size: clamp(1.65rem, 3vw, 2.1rem);
    font-weight: 800;
    color: var(--pts-text);
    line-height: 1.2;
  }
  .cm-hero__row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 0.75rem 1rem;
  }
  .cm-compose {
    margin-top: 1rem;
  }
  .cm-compose.hidden { display: none; }
  .cm-compose__box {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
  }
  .cm-compose__avatar {
    width: 42px;
    height: 42px;
    border-radius: 999px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--pts-primary-soft);
  }
  .cm-compose__main { flex: 1; min-width: 0; }
  .cm-compose textarea {
    width: 100%;
    min-height: 72px;
    resize: vertical;
    border: 0;
    border-bottom: 1px solid var(--pts-border);
    border-radius: 0;
    background: transparent;
    padding: 0.35rem 0 0.75rem;
    font: inherit;
    color: var(--pts-text);
    outline: none;
  }
  .cm-compose textarea:focus {
    border-bottom-color: var(--pts-primary);
  }
  .cm-compose__foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-top: 0.65rem;
  }
  .cm-compose__hint {
    font-size: 0.8rem;
    color: var(--pts-muted);
  }
  .cm-guest {
    margin-top: 0.85rem;
    font-size: 0.9rem;
    color: var(--pts-muted);
  }
  .cm-guest a {
    color: var(--pts-primary);
    font-weight: 700;
    text-decoration: none;
  }
  .cm-feed-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem 1rem;
    margin: 1.35rem 0 0.75rem;
  }
  .cm-feed-head h2 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--pts-text);
  }
  .cm-feed-head a {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--pts-primary);
    text-decoration: none;
  }
  .cm-trending {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    margin-bottom: 1rem;
  }
  .cm-trending__label {
    width: 100%;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--pts-muted);
    margin-bottom: 0.15rem;
  }
  .cm-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.28rem 0.7rem;
    border-radius: 999px;
    border: 1px solid var(--pts-border);
    background: color-mix(in srgb, var(--pts-surface) 88%, var(--pts-primary-soft));
    font-size: 0.8rem;
    color: var(--pts-text);
  }
  .cm-tag strong {
    color: var(--pts-primary);
    font-weight: 800;
  }
  .cm-tag span {
    color: var(--pts-muted);
    font-size: 0.72rem;
  }
  .cm-empty {
    padding: 1.75rem 0.25rem;
    color: var(--pts-muted);
    font-size: 0.95rem;
  }
  .cm-post {
    padding: 1.1rem 0;
    border-bottom: 1px solid var(--pts-border);
    background: transparent;
  }
  .cm-post__head {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 0.65rem;
  }
  .cm-post__avatar {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    object-fit: cover;
    background: var(--pts-primary-soft);
  }
  .cm-post__name {
    margin: 0;
    font-weight: 800;
    color: var(--pts-text);
    font-size: 0.98rem;
  }
  .cm-post__time {
    margin: 0.1rem 0 0;
    font-size: 0.75rem;
    color: var(--pts-muted);
  }
  .cm-post__body {
    margin: 0 0 0.85rem;
    white-space: pre-line;
    color: var(--pts-text);
    line-height: 1.55;
    font-size: 0.98rem;
  }
  .cm-post__actions {
    display: flex;
    align-items: center;
    gap: 0.35rem 1rem;
    color: var(--pts-muted);
  }
  .cm-action {
    display: inline-flex;
    align-items: center;
    gap: 0.28rem;
    border: 0;
    background: transparent;
    padding: 0.2rem 0.15rem;
    color: inherit;
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
  }
  .cm-action:hover {
    color: var(--pts-primary);
  }
  .cm-action .material-symbols-outlined {
    font-size: 20px;
  }
  .cm-action .cm-count {
    font-size: 0.82rem;
    font-weight: 700;
  }
  .cm-action.pts-like-active {
    color: var(--pts-primary);
  }
  .cm-action.pts-like-active .material-symbols-outlined {
    font-variation-settings: 'FILL' 1;
  }
  .cm-comment {
    margin-top: 0.85rem;
    padding-top: 0.85rem;
    border-top: 1px solid var(--pts-border);
  }
  .cm-comment.hidden { display: none; }
  .cm-comment__item {
    padding: 0.55rem 0;
    border-bottom: 1px solid color-mix(in srgb, var(--pts-border) 70%, transparent);
  }
  .cm-comment__item:last-child { border-bottom: 0; }
  .cm-comment__meta {
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--pts-text);
  }
  .cm-comment__meta span {
    font-weight: 500;
    color: var(--pts-muted);
    font-size: 0.72rem;
    margin-left: 0.35rem;
  }
  .cm-comment__text {
    margin: 0.25rem 0 0;
    font-size: 0.9rem;
    color: var(--pts-text);
    white-space: pre-line;
    line-height: 1.45;
  }
  .cm-comment__form {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.65rem;
  }
  .cm-comment__form input {
    flex: 1;
    border: 1px solid var(--pts-border);
    border-radius: 999px;
    background: var(--pts-input-bg);
    padding: 0.45rem 0.9rem;
    font: inherit;
    font-size: 0.9rem;
    color: var(--pts-text);
    outline: none;
  }
  .cm-comment__form input:focus {
    border-color: var(--pts-primary);
  }
  .cm-err {
    margin-top: 0.45rem;
    font-size: 0.85rem;
    color: #ba1a1a;
  }
  .cm-err.hidden { display: none; }
</style>

<main class="pts-main pts-main--wide">
  <div class="cm-page">
    <header class="cm-hero">
      <div class="cm-hero__row">
        <div>
          <span class="cm-brand">PA</span>
          <h1 data-i18n="page.community.section_title">คอมมูนิตี้</h1>
        </div>
        <div id="hero-actions"></div>
      </div>

      <section id="composer-section" class="cm-compose hidden">
        <div class="cm-compose__box">
          <img id="composer-avatar" class="cm-compose__avatar" src="" alt="">
          <div class="cm-compose__main">

            <div class="cm-compose__foot">
              <span id="char-count" class="cm-compose__hint">0/2000</span>

      </p>

    <div class="cm-feed-head">
      <h2>โพสต์ล่าสุด</h2>

    </div>

    <div id="trending-wrap" class="cm-trending hidden">
      <div class="cm-trending__label">กำลังพูดถึง</div>
      <div id="trending-container"></div>
    </div>

    <div id="post-container"></div>
  </div>
</main>
<div class="pts-footer-note">© PA Learning · คอมมูนิตี้</div>

<script>
let currentUser = null;
const escapeHtml = (t) => String(t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const timeAgo = (dateString) => {
  if (!dateString) return '';
  const elapsed = Date.now() - new Date(dateString).getTime();
  const m = 60 * 1000, h = 60 * m, d = 24 * h;
  if (elapsed < m) return 'เมื่อครู่นี้';
  if (elapsed < h) return Math.round(elapsed / m) + ' นาทีที่แล้ว';
  if (elapsed < d) return Math.round(elapsed / h) + ' ชั่วโมงที่แล้ว';
  return new Date(dateString).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
};

function requireAuth() {
  if (currentUser) return true;
  location.href = 'Login.html?next=' + encodeURIComponent('Community.html');
  return false;
}

function userAvatar(name, url) {
  if (url) return url;
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'U')}&background=F8BBD0&color=880E4F&size=128`;
}

function makePostCard(post) {
  const liked = Number(post.liked_by_me) === 1;
  const avatar = userAvatar(post.author_name, post.author_avatar);
  return `
    <article class="cm-post" data-post-id="${post.post_id}">
      <div class="cm-post__head">
        <img class="cm-post__avatar" src="${escapeHtml(avatar)}" alt="">
        <div>
          <p class="cm-post__name">${escapeHtml(post.author_name || 'ผู้ใช้งาน')}</p>
          <p class="cm-post__time">${timeAgo(post.created_at)}</p>
        </div>
      </div>
      <p class="cm-post__body">${escapeHtml(post.content || '')}</p>
      <div class="cm-post__actions">
        <button type="button" class="cm-action like-btn ${liked ? 'pts-like-active' : ''}" data-post-id="${post.post_id}" ${currentUser ? '' : 'title="เข้าสู่ระบบเพื่อกดถูกใจ"'}>
          <span class="material-symbols-outlined" aria-hidden="true">favorite</span>
          <span class="cm-count like-count">${post.like_count || 0}</span>
        </button>
        <button type="button" class="cm-action comment-toggle" data-post-id="${post.post_id}">
          <span class="material-symbols-outlined" aria-hidden="true">chat_bubble</span>
          <span class="cm-count comment-count">${post.comment_count || 0}</span>
        </button>
      </div>
      <div class="cm-comment comment-panel hidden" data-post-id="${post.post_id}">
        <div class="comment-list"></div>
        ${currentUser ? `
          <div class="cm-comment__form">
            <input type="text" maxlength="1000" placeholder="เขียนความคิดเห็น..." class="comment-input">
            <button type="button" class="comment-submit pts-btn pts-btn-primary" data-post-id="${post.post_id}">ส่ง</button>
          </div>` : `
          <p class="cm-guest" style="margin-top:0.65rem">เข้าสู่ระบบเพื่อแสดงความคิดเห็น · <a href="Login.html?next=Community.html">เข้าสู่ระบบ</a></p>`}
      </div>
    </article>`;
}

function renderAuthUi() {
  const composer = document.getElementById('composer-section');
  const likedLink = document.getElementById('liked-link');
  const guest = document.getElementById('guest-note');
  const hero = document.getElementById('hero-actions');
  const avatar = document.getElementById('composer-avatar');

  if (currentUser) {
    composer.classList.remove('hidden');
    guest.classList.add('hidden');
    likedLink.classList.remove('hidden');
    likedLink.href = 'Favorites.html#posts';
    likedLink.textContent = 'รายการโปรด →';
    hero.innerHTML = '';
    avatar.src = userAvatar(currentUser.name, currentUser.Url || currentUser.url || currentUser.avatar);
    avatar.alt = currentUser.name || '';
  } else {
    composer.classList.add('hidden');
    likedLink.classList.add('hidden');
    guest.classList.remove('hidden');
    hero.innerHTML = '';
  }
}

async function loadPosts() {
  const box = document.getElementById('post-container');
  box.innerHTML = '<div class="cm-empty">กำลังโหลดโพสต์...</div>';
  const res = await fetch('/api/community', { credentials: 'include' });
  const data = await res.json();
  if (!res.ok || !data.success) throw new Error(data.message || 'โหลดไม่สำเร็จ');
  if (!data.data.length) {
    box.innerHTML = '<div class="cm-empty">ยังไม่มีโพสต์ — เป็นคนแรกที่เริ่มคุยได้เลย</div>';
    return;
  }
  box.innerHTML = data.data.map(makePostCard).join('');
}

async function loadTrending() {
  const wrap = document.getElementById('trending-wrap');
  const el = document.getElementById('trending-container');
  try {
    const res = await fetch('/api/community/trending', { credentials: 'include' });
    const data = await res.json();
    if (!data.success || !data.data?.length) {
      wrap.classList.add('hidden');
      el.innerHTML = '';
      return;
    }
    wrap.classList.remove('hidden');
    el.innerHTML = data.data.map((t) => `
      <span class="cm-tag">
        <strong>${escapeHtml(t.tag_name)}</strong>
        <span>${t.post_count || 0} โพสต์</span>
      </span>`).join('');
  } catch {
    wrap.classList.add('hidden');
  }
}

async function loadComments(postId, panel) {
  const list = panel.querySelector('.comment-list');
  list.innerHTML = '<div class="cm-empty" style="padding:0.5rem 0">กำลังโหลด...</div>';
  const res = await fetch(`/api/community/${postId}/comments`, { credentials: 'include' });
  const data = await res.json();
  if (!res.ok || !data.success) {
    list.innerHTML = `<div class="cm-err">${escapeHtml(data.message || 'โหลดความคิดเห็นไม่สำเร็จ')}</div>`;
    return;
  }
  if (!data.data.length) {
    list.innerHTML = '<div class="cm-empty" style="padding:0.35rem 0">ยังไม่มีความคิดเห็น</div>';
    return;
  }
  list.innerHTML = data.data.map((c) => `
    <div class="cm-comment__item">
      <p class="cm-comment__meta">${escapeHtml(c.author_name || '')}<span>${timeAgo(c.created_at)}</span></p>
      <p class="cm-comment__text">${escapeHtml(c.content || '')}</p>
    </div>`).join('');
}

document.getElementById('post-content')?.addEventListener('input', (e) => {
  document.getElementById('char-count').textContent = `${e.target.value.length}/2000`;
});

document.getElementById('submit-post')?.addEventListener('click', async () => {
  if (!requireAuth()) return;
  const content = document.getElementById('post-content').value.trim();
  const err = document.getElementById('composer-error');
  err.classList.add('hidden');
  if (!content) {
    err.textContent = 'กรุณากรอกข้อความก่อนโพสต์';
    err.classList.remove('hidden');
    return;
  }
  const btn = document.getElementById('submit-post');
  btn.disabled = true;
  try {
    const res = await fetch('/api/community', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content })
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || 'โพสต์ไม่สำเร็จ');
    document.getElementById('post-content').value = '';
    document.getElementById('char-count').textContent = '0/2000';
    await loadPosts();
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('post-container').addEventListener('click', async (e) => {
  const likeBtn = e.target.closest('.like-btn');
  const commentToggle = e.target.closest('.comment-toggle');
  const commentSubmit = e.target.closest('.comment-submit');

  if (likeBtn) {
    if (!requireAuth()) return;
    const postId = likeBtn.dataset.postId;
    const res = await fetch(`/api/community/${postId}/like`, { method: 'POST', credentials: 'include' });
    const data = await res.json();
    if (!res.ok || !data.success) return;
    likeBtn.querySelector('.like-count').textContent = data.like_count;
    likeBtn.classList.toggle('pts-like-active', !!data.liked);
    return;
  }

  if (commentToggle) {
    const postId = commentToggle.dataset.postId;
    const panel = document.querySelector(`.comment-panel[data-post-id="${postId}"]`);
    const opening = panel.classList.contains('hidden');
    panel.classList.toggle('hidden');
    if (opening) await loadComments(postId, panel);
    return;
  }

  if (commentSubmit) {
    if (!requireAuth()) return;
    const postId = commentSubmit.dataset.postId;
    const panel = document.querySelector(`.comment-panel[data-post-id="${postId}"]`);
    const input = panel.querySelector('.comment-input');
    const content = (input.value || '').trim();
    if (!content) return;
    commentSubmit.disabled = true;
    try {
      const res = await fetch(`/api/community/${postId}/comments`, {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message || 'ส่งความคิดเห็นไม่สำเร็จ');
      input.value = '';
      const countEl = document.querySelector(`.comment-toggle[data-post-id="${postId}"] .comment-count`);
      if (countEl) countEl.textContent = Number(countEl.textContent || 0) + 1;
      await loadComments(postId, panel);
    } catch (err) {
      let errEl = panel.querySelector('.comment-error');
      if (!errEl) {
        errEl = document.createElement('p');
        errEl.className = 'comment-error cm-err';
        panel.appendChild(errEl);
      }
      errEl.textContent = err.message;
    } finally {
      commentSubmit.disabled = false;
    }
  }
});

(async () => {
  try {
    const me = await fetch('/api/users/me', { credentials: 'include' }).then((r) => r.json());
    currentUser = me.loggedIn ? me.user : null;
    renderAuthUi();
    await Promise.all([loadPosts(), loadTrending()]);
  } catch (err) {
    document.getElementById('post-container').innerHTML =
      `<div class="cm-err">${escapeHtml(err.message)}</div>`;
  }
})();
</script>

      + '<div style="max-width:1120px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;justify-content:space-between">'
