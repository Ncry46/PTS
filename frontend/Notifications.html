<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>การแจ้งเตือน | PTS Learning</title>
<script src="/comp/theme-boot.js"></script>
<script src="/comp/i18n-dict.js?v=20260813enfix"></script>
<script src="/comp/lang-boot.js?v=20260813enfix"></script>
<link href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=20260902seed">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#ca1156','on-surface-variant':'#5c4f55',error:'#ba1a1a'}}}}</script>
</head>
<body class="pts-body">
<div id="app-navbar"></div>
<main class="pts-main" data-user-shell>
  <section class="pts-page-hero">
    <span class="pts-chip mb-3">Notifications</span>
    <h1 class="text-3xl md:text-4xl font-bold text-primary mb-2 pts-display" data-i18n="page.notifications.section_title">การแจ้งเตือน</h1>
    <p class="text-on-surface-variant max-w-xl" data-i18n="page.notifications.sub">ข่าวสารและอัปเดตที่เกี่ยวข้องกับบัญชีของคุณ</p>
  </section>

  <div class="pts-notif-toolbar">
    <span class="pts-notif-count" id="notif-count" hidden></span>
    <button type="button" id="read-all" class="pts-btn pts-btn-outline" data-i18n="notif.markAll">อ่านทั้งหมด</button>
  </div>

  <div id="list" class="pts-notif-list"></div>
</main>
<script>
const escapeHtml = (t) => String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function notifIcon(section_title, body) {
  const t = `${section_title || ''} ${body || ''}`.toLowerCase();
  if (/ชำระ|จ่าย|สลิป|payment|paid/.test(t)) return 'payments';
  if (/สิทธิ์|เรียน|หลักสูตร|enroll|course/.test(t)) return 'school';
  if (/ปฏิทิน|ตาราง|calendar|schedule/.test(t)) return 'event';
  if (/ใบประกาศ|certificate/.test(t)) return 'workspace_premium';
  return 'notifications';
}

function relativeTime(value) {
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return '';
  const diff = Date.now() - d.getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'เมื่อสักครู่';
  if (mins < 60) return `${mins} นาทีที่แล้ว`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours} ชั่วโมงที่แล้ว`;
  const days = Math.floor(hours / 24);
  if (days < 7) return `${days} วันที่แล้ว`;
  return d.toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
}

function isUnread(n) {
  return !(n.is_read === true || n.is_read === 1 || n.is_read === '1');
}

async function load() {
  const me = await fetch('/api/users/me', { credentials:'include' }).then(r=>r.json());
  if (!me.loggedIn) return location.href = 'Login.html';

  const res = await fetch('/api/notifications', { credentials:'include' });
  const data = await res.json();
  const box = document.getElementById('list');
  const countEl = document.getElementById('notif-count');

  if (!res.ok || !data.success) {
    box.innerHTML = `<div class="pts-empty pts-card" style="color:var(--pts-error,#ba1a1a)">${escapeHtml(data.message||'โหลดไม่สำเร็จ')}</div>`;
    countEl.hidden = true;
    return;
  }

  const rows = Array.isArray(data.data) ? data.data : [];
  const unread = typeof data.unread === 'number' ? data.unread : rows.filter(isUnread).length;
  if (unread > 0) {
    countEl.hidden = false;
    countEl.textContent = `ยังไม่อ่าน ${unread} รายการ`;
  } else {
    countEl.hidden = false;
    countEl.textContent = rows.length ? 'อ่านครบแล้ว' : 'ยังไม่มีรายการ';
  }

  if (!rows.length) {
    box.innerHTML = `<div class="pts-empty pts-card">
      <div class="pts-empty__icon"><span class="material-symbols-outlined">notifications_off</span></div>
      <p class="font-semibold mb-1" data-i18n="notif.empty">ยังไม่มีการแจ้งเตือน</p>
      <p class="text-sm">เมื่อมีอัปเดต เช่น เปิดสิทธิ์เรียนหรือผลตรวจสลิป จะแสดงที่นี่</p>
    </div>`;
    return;
  }

  box.innerHTML = rows.map((n) => {
    const unreadItem = isUnread(n);
    const icon = notifIcon(n.section_title, n.body);
    return `
    <article class="pts-notif ${unreadItem ? 'pts-notif--unread' : 'pts-notif--read'}">
      <div class="pts-notif__icon" aria-hidden="true">
        <span class="material-symbols-outlined">${icon}</span>
      </div>
      <div class="pts-notif__main">
        <div class="pts-notif__head">
          <h2 class="pts-notif__section_title">${escapeHtml(n.section_title)}</h2>
          ${unreadItem ? '<span class="pts-notif__dot" title="ยังไม่อ่าน"></span>' : ''}
        </div>
        ${n.body ? `<p class="pts-notif__body">${escapeHtml(n.body)}</p>` : ''}
        <p class="pts-notif__time">${escapeHtml(relativeTime(n.created_at))}</p>
      </div>
      <div class="pts-notif__actions">
        ${n.link_url ? `<a class="pts-btn pts-btn-primary" href="${escapeHtml(n.link_url)}">เปิด</a>` : ''}
        ${unreadItem ? `<button type="button" class="mark pts-btn pts-btn-ghost" data-id="${n.notification_id}">อ่านแล้ว</button>` : ''}
      </div>
    </article>`;
  }).join('');
}

document.getElementById('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('.mark');
  if (!btn) return;
  btn.disabled = true;
  await fetch(`/api/notifications/${btn.dataset.id}/read`, { method:'POST', credentials:'include' });
  load();
});

document.getElementById('read-all').onclick = async () => {
  const btn = document.getElementById('read-all');
  btn.disabled = true;
  await fetch('/api/notifications/read-all', { method:'POST', credentials:'include' });
  btn.disabled = false;
  load();
};

load();
</script>
<script src="/comp/user-sidebar.js?v=20260727paymodal"></script>
<script src="/comp/navbar.js?v=20260903logo"></script>
</body>
</html>
