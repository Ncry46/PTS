<!DOCTYPE html>
<html class="light" lang="th">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ตั้งรหัสผ่านใหม่ | PTS Learning</title>
<script src="/comp/theme-boot.js"></script>
<link rel="stylesheet" href="site.css?v=20260727homecream">
<link rel="stylesheet" href="login.css?v=20260813resetlink">
<link href="https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;family=Bai+Jamjuree:wght@200;300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
  body.pts-reset {
    min-height: 100vh;
    margin: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(202,17,86,.12), transparent 55%),
      #fff;
    font-family: 'SN Pro', 'Bai Jamjuree', sans-serif;
    color: #1c1520;
  }
  .pts-reset__wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: 48px 18px 64px;
  }
  .pts-reset__card {
    border-radius: 28px;
    background: #fff;
    border: 1px solid rgba(151,66,88,.12);
    box-shadow: 0 28px 70px rgba(28,21,32,.12);
    padding: 28px 24px 24px;
  }
  .pts-reset__badge {
    width: 56px; height: 56px;
    margin: 0 auto 14px;
    border-radius: 18px;
    display: grid; place-items: center;
    color: #fff;
    background: linear-gradient(145deg, #ff6b9d, #ca1156 55%, #a50e48);
  }
  .pts-reset__badge .material-symbols-outlined { font-size: 28px; }
  .pts-reset__card h1 {
    margin: 0 0 8px;
    text-align: center;
    font-size: 1.35rem;
    font-weight: 800;
  }
  .pts-reset__lead {
    margin: 0 auto 22px;
    text-align: center;
    max-width: 34ch;
    font-size: 13px;
    line-height: 1.55;
    color: #6b5c62;
  }
  .pts-reset__card label {
    display: block;
    margin: 0 0 6px;
    font-size: 12px;
    font-weight: 700;
    color: #5c4f55;
  }
  .pts-reset__field { margin-bottom: 14px; }
  .pts-reset__card input {
    width: 100%;
    border: 1px solid rgba(151,66,88,.16);
    border-radius: 14px;
    padding: 13px 14px;
    font: inherit;
    font-size: 15px;
    outline: none;
    background: #faf6f8;
    box-sizing: border-box;
  }
  .pts-reset__card input:focus {
    border-color: rgba(202,17,86,.45);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(202,17,86,.12);
  }
  .pts-reset__submit {
    width: 100%;
    margin-top: 8px;
    border: 0;
    border-radius: 999px;
    padding: 14px 18px;
    font: inherit;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #ff6b9d, #ca1156);
    cursor: pointer;
  }
  .pts-reset__submit:disabled {
    opacity: .55;
    cursor: not-allowed;
  }
  .pts-reset__msg {
    margin: 14px 0 0;
    font-size: 13px;
    line-height: 1.45;
    text-align: center;
  }
  .pts-reset__msg.is-err { color: #ba1a1a; }
  .pts-reset__msg.is-ok { color: #ca1156; }
  .pts-reset__back {
    display: block;
    margin-top: 18px;
    text-align: center;
    color: #ca1156;
    font-weight: 700;
    text-decoration: none;
    font-size: 14px;
  }
  .pts-reset__card.is-invalid .pts-reset__form { display: none; }
</style>
</head>
<body class="pts-body pts-reset">
  <div class="pts-reset__wrap">
    <div class="pts-reset__card" id="reset-card">
      <div class="pts-reset__badge" aria-hidden="true">
        <span class="material-symbols-outlined">lock_reset</span>
      </div>
      <h1>ตั้งรหัสผ่านใหม่</h1>
      <p class="pts-reset__lead" id="reset-lead">กำลังตรวจสอบลิงก์…</p>

      <form class="pts-reset__form" id="reset-form" autocomplete="off">
        <div class="pts-reset__field">
          <label for="new-password">รหัสผ่านใหม่</label>
          <input id="new-password" type="password" minlength="4" required autocomplete="new-password" placeholder="อย่างน้อย 4 ตัวอักษร">
        </div>
        <div class="pts-reset__field">
          <label for="confirm-password">ยืนยันรหัสผ่านใหม่</label>
          <input id="confirm-password" type="password" minlength="4" required autocomplete="new-password" placeholder="พิมพ์อีกครั้ง">
        </div>
        <button type="submit" class="pts-reset__submit" id="reset-submit">บันทึกรหัสผ่านใหม่</button>
      </form>

      <p class="pts-reset__msg" id="reset-msg" hidden></p>
      <a class="pts-reset__back" href="Login.html">กลับไปเข้าสู่ระบบ</a>
    </div>
  </div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const token = String(params.get('token') || '').trim();
  const card = document.getElementById('reset-card');
  const lead = document.getElementById('reset-lead');
  const form = document.getElementById('reset-form');
  const msg = document.getElementById('reset-msg');
  const submitBtn = document.getElementById('reset-submit');

  function showMsg(text, ok) {
    msg.hidden = !text;
    msg.textContent = text || '';
    msg.className = 'pts-reset__msg ' + (ok ? 'is-ok' : 'is-err');
  }

  async function validateToken() {
    if (!token) {
      card.classList.add('is-invalid');
      lead.textContent = 'ลิงก์ไม่ถูกต้อง — กรุณาขอลิงก์ใหม่จากหน้าเข้าสู่ระบบหรือตั้งค่า';
      showMsg('ไม่พบโทเคนในลิงก์', false);
      return;
    }
    try {
      const res = await fetch('/api/users/reset-token?token=' + encodeURIComponent(token));
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        card.classList.add('is-invalid');
        lead.textContent = data.message || 'ลิงก์หมดอายุหรือถูกใช้ไปแล้ว';
        showMsg(data.message || 'ลิงก์ไม่พร้อมใช้งาน', false);
        return;
      }
      lead.textContent = 'ตั้งรหัสผ่านใหม่สำหรับบัญชี ' + (data.masked_email || '') + ' — ลิงก์ใช้ได้ครั้งเดียว';
    } catch (e) {
      card.classList.add('is-invalid');
      lead.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ';
      showMsg(e.message || 'เกิดข้อผิดพลาด', false);
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    showMsg('', true);
    if (newPassword.length < 4) {
      showMsg('รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร', false);
      return;
    }
    if (newPassword !== confirmPassword) {
      showMsg('รหัสผ่านใหม่กับยืนยันรหัสผ่านไม่ตรงกัน', false);
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'กำลังบันทึก...';
    try {
      const res = await fetch('/api/users/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token,
          new_password: newPassword,
          confirm_password: confirmPassword
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        showMsg(data.message || 'ตั้งรหัสผ่านไม่สำเร็จ', false);
        return;
      }
      showMsg(data.message || 'ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว', true);
      form.classList.add('hidden');
      form.style.display = 'none';
      lead.textContent = 'สำเร็จแล้ว — ไปเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้เลย';
      window.setTimeout(() => {
        location.href = 'Login.html?reset=ok';
      }, 1200);
    } catch (err) {
      showMsg(err.message || 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ', false);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'บันทึกรหัสผ่านใหม่';
    }
  });

  validateToken();
})();
</script>
</body>
</html>
