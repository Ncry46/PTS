</head>
<body class="pts-body">
<div id="app-navbar">
  <nav style="position:fixed;top:0;left:0;right:0;z-index:99999;height:68px;background:var(--pts-nav-bg,#fff);border-bottom:1px solid var(--pts-border,rgba(151,66,88,.18));">
    <div style="max-width:1120px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;justify-content:space-between;">
      <a href="Home.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--pts-text,#1c1520);font-weight:700;">
        <img src="/logo.png" alt="PTS Learning" style="height:42px;width:auto;max-width:160px;object-fit:contain;display:block;">
        PTS Learning
      </a>
      <div style="display:flex;gap:8px;">
        <a href="Login.html" style="padding:8px 14px;border:1px solid #ca1156;border-radius:999px;color:#ca1156;text-decoration:none;font-weight:700;font-size:14px;">เข้าสู่ระบบ</a>
        <a href="Register.html" style="padding:8px 14px;background:#ca1156;border-radius:999px;color:#fff;text-decoration:none;font-weight:700;font-size:14px;">สมัครสมาชิก</a>
      </div>
    </div>

</div>
<main class="pts-main pts-main--wide">
  <div class="mb-5">
    <h1 class="text-3xl md:text-4xl font-bold text-primary mb-2 pts-display" data-i18n="page.courses.section_title">หลักสูตร</h1>
    <p id="hero-sub" class="text-on-surface-variant max-w-2xl" data-i18n="page.courses.sub">เลือกหลักสูตร Online / Onsite / Hybrid ที่เหมาะกับเป้าหมายของคุณ</p>
  </div>

  <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <div class="flex flex-wrap gap-2" id="filters">
      <button data-filter="all" class="filter-btn pts-btn pts-btn-primary">ทั้งหมด</button>
      <button data-filter="online" class="filter-btn pts-btn pts-btn-outline">Online</button>
      <button data-filter="onsite" class="filter-btn pts-btn pts-btn-outline">Onsite</button>
      <button data-filter="hybrid" class="filter-btn pts-btn pts-btn-outline">Hybrid</button>
    </div>
    <div id="hero-actions" class="flex flex-wrap gap-2"></div>
  </div>

  <div id="courses-grid" class="pts-course-grid"></div>
</main>
<div class="pts-footer-note">© PTS Learning · Courses</div>

<script>
let currentUser = null;
let allCourses = [];
const escapeHtml = (t) => String(t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const formatText = (v) => {
  const s = v == null ? '' : String(v).trim();
  return s || '-';
};

function pickCourseField(course, base) {
  if (!course) return '';
  if (window.PTSCourseI18n) {
    const via = base === 'course_name' ? PTSCourseI18n.name(course)
      : base === 'instructor_name' ? PTSCourseI18n.instructor(course)
      : PTSCourseI18n.description(course);
    if (via) return via;
  }
  const keys = Object.keys(course);
  const want = [
    base + '_th', base + '_en', base,
    base.replace('_', '') + '_th', base.replace('_', '') + '_en'
  ].map((k) => k.toLowerCase());
  for (const key of keys) {
    const lk = String(key).toLowerCase();
    if (want.includes(lk) || lk === base + '_th' || lk === base + '_en' || lk === base) {
      const val = course[key] == null ? '' : String(course[key]).trim();
      if (val) return val;
    }
  }
  // last resort: any key containing name_th / name_en for course
  for (const key of keys) {
    const lk = String(key).toLowerCase();
    if (base === 'course_name' && /(course)?_?name_?th$/.test(lk)) {
      const val = course[key] == null ? '' : String(course[key]).trim();
      if (val) return val;
    }
    if (base === 'instructor_name' && /instructor.*th$/.test(lk)) {
      const val = course[key] == null ? '' : String(course[key]).trim();
      if (val) return val;
    }
  }
  return '';
}
const sentenceCase = (t) => t ? t.charAt(0).toUpperCase() + t.slice(1) : '-';
const getBadge = (mode) => {
  if (mode === 'online') return { label: 'Online', classes: 'bg-emerald-50 text-emerald-700' };
  if (mode === 'onsite') return { label: 'Onsite', classes: 'bg-orange-50 text-orange-700' };
  return { label: 'Hybrid', classes: 'bg-sky-50 text-sky-700' };
};

function requireAuth(label) {
  if (currentUser) return true;
  location.href = 'Login.html';
  return false;
}

function renderAuthChrome() {
  const hero = document.getElementById('hero-actions');
  const sub = document.getElementById('hero-sub');
  if (currentUser) {
    sub.textContent = 'สมัครเรียน บันทึกหลักสูตรโปรด และเข้าเรียนได้ทันทีหลังล็อกอิน';
    hero.innerHTML = `
      <a class="pts-btn pts-btn-outline" href="Favorites.html">รายการโปรด</a>
      <a class="pts-btn pts-btn-primary" href="DashbordU.html">แดชบอร์ด</a>`;
  } else {
    sub.textContent = 'เลือกดูหลักสูตร Online / Onsite / Hybrid ได้ตามต้องการ';
    hero.innerHTML = '';
  }
}

function makeCourseCard(course) {
  course = window.PTSCourseI18n ? PTSCourseI18n.localize(course) : course;
  const courseName = pickCourseField(course, 'course_name');
  const instructor = pickCourseField(course, 'instructor_name') || '-';
  const mode = (course.delivery_mode || '').toLowerCase();
  const badge = getBadge(mode);
  const favorited = Number(course.is_favorited) === 1;
  const enrolled = Number(course.is_enrolled) === 1;
  const hours = Number(course.total_hours || 0).toFixed(1).replace('.0', '');
  const img = course.cover_image_url || 'https://via.placeholder.com/640x400?text=PTS+Course';
  const badgeBg = mode === 'onsite' ? '#ffc800' : mode === 'hybrid' ? '#007ede' : mode === 'online' ? '#00ca01' : '#ca1156';
  return `
    <article data-type="${mode}" class="pts-course-card">
      <div class="pts-course-card__media">
        <img src="${img}" alt="${escapeHtml(courseName)}" loading="lazy">
        <span class="pts-course-card__badge" style="background:${badgeBg}">${badge.label}${course.is_featured ? ' · ยอดนิยม' : ''}</span>
        ${currentUser ? `
          <button type="button" class="fav-btn" data-course-id="${course.course_id}" title="บันทึกหลักสูตรโปรด" style="position:absolute;top:10px;right:10px;z-index:2;width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,.95);border:none;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;${favorited ? 'color:#ca1156' : 'color:#544245'}">
            <span class="material-symbols-outlined" style="font-size:18px">favorite</span>
          </button>` : ''}
      </div>
      <div class="pts-course-card__body">
        <div class="pts-course-card__copy">
          <p class="pts-course-card__meta">${Number(course.average_rating || 0).toFixed(1)} · ${course.total_reviews || 0} รีวิว</p>
          <h3 class="pts-course-card__section_title">${escapeHtml(formatText(courseName))}</h3>
          <div class="pts-course-card__meta-row" title="${escapeHtml(formatText(instructor))}">
            <span class="material-symbols-outlined" aria-hidden="true">person</span>
            <span>${escapeHtml(formatText(instructor))}</span>
          </div>
          <div class="pts-course-card__meta-row">
            <span class="material-symbols-outlined" aria-hidden="true">schedule</span>
            <span>${hours} ชม. · ${escapeHtml(sentenceCase(course.delivery_mode) || '-')}${course.is_open_soon ? ' · เปิดเร็วๆ นี้' : ''}</span>
          </div>
          ${course.price != null ? `
            <p class="pts-course-card__meta flex items-center justify-between" style="margin-top:4px">
              <span>ลงทะเบียน ${Number(course.total_enrolled || 0)}</span>
              <span class="text-base font-bold text-primary">${Number(course.price).toLocaleString('th-TH')} บาท</span>
            </p>
          ` : ''}
        </div>
        <div class="pts-course-card__actions">
          <a href="${enrolled ? `Learn.html?courseId=${course.course_id}` : `CourseDetail.html?courseId=${course.course_id}`}" class="pts-btn ${enrolled ? 'pts-btn-outline' : 'pts-btn-primary'}">
            ${enrolled ? 'เข้าเรียน' : 'ดูรายละเอียด'}
          </a>
        </div>
      </div>
    </article>`;
}

function openCourseModal(course) {
  course = window.PTSCourseI18n ? PTSCourseI18n.localize(course) : course;
  const modalName = pickCourseField(course, 'course_name');
  const modalInstructor = pickCourseField(course, 'instructor_name') || '-';
  document.getElementById('course-modal')?.remove();
  const badge = getBadge((course.delivery_mode || '').toLowerCase());
  const enrolled = Number(course.is_enrolled) === 1;
  const modal = document.createElement('div');
  modal.id = 'course-modal';
  modal.className = 'fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/45';
  modal.innerHTML = `
    <div class="bg-white rounded-[24px] max-w-lg w-full p-5 shadow-xl relative max-h-[90vh] overflow-y-auto">
      <button type="button" id="close-course-modal" class="absolute top-3 right-3 p-2 rounded-full hover:bg-gray-100"><span class="material-symbols-outlined">close</span></button>
      <img src="${course.cover_image_url || 'https://via.placeholder.com/640x400?text=PTS+Course'}" class="w-full h-40 object-cover rounded-2xl mb-4" alt="">
      <span class="inline-block px-3 py-1 rounded-full text-[12px] font-bold mb-2 ${badge.classes}">${badge.label}</span>
      <h3 class="text-xl font-bold mb-1">${escapeHtml(formatText(modalName))}</h3>
      <p class="text-sm text-on-surface-variant mb-2">โดย ${escapeHtml(formatText(modalInstructor))}</p>
      <p class="text-sm text-on-surface-variant mb-4">${Number(course.total_hours || 0).toFixed(1).replace('.0','')} ชั่วโมง · ${escapeHtml(sentenceCase(course.delivery_mode) || '-')}${course.is_open_soon ? ' · เปิดเร็วๆ นี้' : ''}${course.price != null ? ' · ' + Number(course.price).toLocaleString('th-TH') + ' บาท' : ''}</p>
      ${course.description ? `<p class="text-sm text-on-surface-variant mb-4">${escapeHtml(String(course.description).slice(0, 280))}</p>` : ''}
      ${currentUser ? `
        <div class="space-y-2">
          <div class="flex items-center gap-2">
            ${enrolled
              ? `<a class="pts-btn pts-btn-primary flex-1" href="Learn.html?courseId=${course.course_id}">เข้าเรียนเลย</a>`
              : `<a class="pts-btn pts-btn-primary flex-1" href="CourseDetail.html?courseId=${course.course_id}">ดูรายละเอียด</a>`}
            <button type="button" id="fav-course-btn" class="pts-course-icon-btn${Number(course.is_favorited) ? ' is-active' : ''}" aria-label="${Number(course.is_favorited) ? 'นำออกจากรายการโปรด' : 'บันทึกรายการโปรด'}" title="${Number(course.is_favorited) ? 'นำออกจากรายการโปรด' : 'บันทึกรายการโปรด'}" style="width:44px;height:44px;border-radius:999px;border:1.5px solid rgba(151,66,88,.18);background:#fff;color:${Number(course.is_favorited) ? '#ca1156' : '#5c4f55'};display:inline-grid;place-items:center;cursor:pointer;flex-shrink:0;">
              <span class="material-symbols-outlined" aria-hidden="true" style="font-size:22px;${Number(course.is_favorited) ? "font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;" : ''}">favorite</span>
            </button>
          </div>
        </div>` : `
        <div class="flex gap-2 mt-4">
          <a class="pts-btn pts-btn-primary flex-1" href="Login.html">เข้าสู่ระบบ</a>
          <a class="pts-btn pts-btn-outline flex-1" href="Register.html">สมัครสมาชิก</a>
        </div>`}
      <p id="enroll-message" class="mt-3 text-center text-sm text-on-surface-variant"></p>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#close-course-modal').onclick = () => modal.remove();
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

  const favBtn = modal.querySelector('#fav-course-btn');
  if (favBtn) {
    favBtn.onclick = async () => {
      const res = await fetch(`/api/courses/${course.course_id}/favorite`, { method: 'POST', credentials: 'include' });
      const data = await res.json();
      if (!res.ok || !data.success) { console.error(data.message || 'ไม่สำเร็จ'); return; }
      course.is_favorited = data.favorited ? 1 : 0;
      const on = !!data.favorited;
      favBtn.classList.toggle('is-active', on);
      favBtn.style.color = on ? '#ca1156' : '#5c4f55';
      const label = on ? 'นำออกจากรายการโปรด' : 'บันทึกรายการโปรด';
      favBtn.setAttribute('aria-label', label);
      favBtn.setAttribute('title', label);
      const icon = favBtn.querySelector('.material-symbols-outlined');
      if (icon) {
        icon.style.fontVariationSettings = on ? "'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24" : '';
      }
      renderCourses(allCourses);
    };
  }
}

function renderCourses(courses) {
  allCourses = courses || [];
  const grid = document.getElementById('courses-grid');
  if (!allCourses.length) {
    grid.innerHTML = '<div class="pts-empty pts-card col-span-full">ไม่พบหลักสูตรในขณะนี้</div>';
    return;
  }
  grid.innerHTML = allCourses.map(makeCourseCard).join('');
}

document.addEventListener('pts-lang-change', () => {
  if (allCourses && allCourses.length) renderCourses(allCourses);
});

function setActiveFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('pts-btn-primary');
    b.classList.add('pts-btn-outline');
  });
  btn.classList.remove('pts-btn-outline');
  btn.classList.add('pts-btn-primary');
}

function filterCourses(filter) {
  document.querySelectorAll('#courses-grid [data-type]').forEach(card => {
    const type = (card.dataset.type || '').toLowerCase();
    card.classList.toggle('hidden', !(filter === 'all' || type === filter.toLowerCase()));
  });
}

document.getElementById('filters').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  setActiveFilter(btn);
  filterCourses(btn.dataset.filter);
});

document.getElementById('courses-grid').addEventListener('click', async (e) => {
  const fav = e.target.closest('.fav-btn');
  const detail = e.target.closest('.course-detail-btn');
  if (fav) {
    if (!requireAuth('บันทึกหลักสูตรโปรด')) return;
    const id = Number(fav.dataset.courseId);
    const res = await fetch(`/api/courses/${id}/favorite`, { method: 'POST', credentials: 'include' });
    const data = await res.json();
    if (!res.ok || !data.success) { console.error(data.message || 'ไม่สำเร็จ'); return; }
    const course = allCourses.find(c => Number(c.course_id) === id);
    if (course) course.is_favorited = data.favorited ? 1 : 0;
    renderCourses(allCourses);
    const active = document.querySelector('.filter-btn.pts-btn-primary');
    if (active) filterCourses(active.dataset.filter);
    return;
  }
  if (detail) {
    const course = allCourses.find(c => Number(c.course_id) === Number(detail.dataset.courseId));
    if (course) openCourseModal(course);
  }
});

(async () => {
  try {
    const meOut = await ptsFetch('/api/users/me');
    const me = meOut.data || {};
    currentUser = me.loggedIn ? me.user : null;
    renderAuthChrome();
    const data = await ptsJson('/api/courses');
    renderCourses(data.data || []);
    const urlFilter = new URLSearchParams(location.search).get('filter');
    if (urlFilter) {
      const btn = [...document.querySelectorAll('.filter-btn')].find(b => (b.dataset.filter || '').toLowerCase() === urlFilter.toLowerCase());
      if (btn) { setActiveFilter(btn); filterCourses(btn.dataset.filter); }
    }
  } catch (err) {
    document.getElementById('courses-grid').innerHTML = `<div class="pts-card p-5 text-error col-span-full">${escapeHtml(err.message)} <button type="button" class="pts-btn pts-btn-outline" style="margin-left:8px" onclick="location.reload()">ลองใหม่</button></div>`;
  }
})();
</script>
<!-- PTS-NAV-INLINE-BOOT -->
<script>
(function(){
  var box = document.getElementById('app-navbar');
  if (!box) {
    box = document.createElement('div');
    box.id = 'app-navbar';
    if (document.body) document.body.insertBefore(box, document.body.firstChild);

      + '<div style="display:flex;gap:8px">'
      + '<a href="Login.html" style="padding:8px 14px;border:1px solid #ca1156;border-radius:999px;color:#ca1156;text-decoration:none;font-weight:700;font-size:14px">เข้าสู่ระบบ</a>'
      + '<a href="Register.html" style="padding:8px 14px;background:#ca1156;border-radius:999px;color:#fff;text-decoration:none;font-weight:700;font-size:14px">สมัครสมาชิก</a>'
      + '</div></div></nav>';
  }
})();
</script>
