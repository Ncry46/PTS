<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรไฟล์ผู้เรียน | PA Learning</title>
<script src="/comp/theme-boot.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=20260813profile">
<style>
  .up-card { max-width: 560px; margin: 0 auto; }
  .up-avatar { width: 96px; height: 96px; border-radius: 999px; object-fit: cover; border: 3px solid rgba(202,17,86,.25); }
  .up-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .up-stat { padding: 14px; border-radius: 16px; background: #fff5f8; border: 1px solid rgba(202,17,86,.12); text-align: center; }
  .up-stat strong { display: block; font-size: 1.4rem; color: #9b0d42; }
</style>
</head>
<body class="pts-body">
<div id="app-navbar"></div>
<main class="pts-main">
  <section class="pts-card p-6 up-card" id="profile-box">
    <p class="text-sm text-on-surface-variant">กำลังโหลดโปรไฟล์...</p>
  </section>
</main>
<script>
const escapeHtml = (t) => String(t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
(async () => {
  const box = document.getElementById('profile-box');
  const id = Number(new URLSearchParams(location.search).get('id') || 0);
  if (!id) {
    box.innerHTML = '<p class="text-error">ไม่พบรหัสผู้ใช้</p><a class="pts-btn pts-btn-primary mt-3" href="Community.html">กลับคอมมูนิตี้</a>';
    return;
  }
  try {
    const res = await fetch(`/api/users/${id}/public`, { credentials: 'include' });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || 'โหลดไม่สำเร็จ');
    const u = data.data;
    box.innerHTML = `
      <div class="flex items-center gap-4 mb-5">
        <img class="up-avatar" src="${escapeHtml(u.avatar_url)}" alt="">
        <div>
          <h1 class="text-2xl font-bold text-primary mb-1">${escapeHtml(u.username || 'ผู้ใช้งาน')}</h1>
          <p class="text-sm text-on-surface-variant">สมาชิกคอมมูนิตี้ PA Learning</p>
        </div>
      </div>
      <div class="up-stats mb-5">
        <div class="up-stat"><strong>${Number(u.post_count || 0)}</strong><span class="text-sm">โพสต์</span></div>
        <div class="up-stat"><strong>${Number(u.course_count || 0)}</strong><span class="text-sm">หลักสูตรที่สมัคร</span></div>
      </div>
      <a class="pts-btn pts-btn-primary" href="Community.html">กลับคอมมูนิตี้</a>
    `;
  } catch (e) {
    box.innerHTML = `<p class="text-error">${escapeHtml(e.message)}</p><a class="pts-btn pts-btn-outline mt-3" href="Community.html">กลับ</a>`;
  }
})();
</script>
<script src="/comp/navbar.js?v=20260727baijam"></script>
</body>
</html>
