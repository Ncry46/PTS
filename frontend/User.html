<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรไฟล์ผู้เรียน | PA Learning</title>
<script src="/comp/theme-boot.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=20260813profile2">
<style>
  body.pts-body {
    font-family: 'Bai Jamjuree', sans-serif;
  }
  .up-shell {
    max-width: 520px;
    margin: 0 auto;
    padding: 1.25rem 1rem 2.5rem;
  }
  .up-card {
    background: #fff;
    border: 1px solid rgba(202, 17, 86, 0.14);
    border-radius: 1.35rem;
    box-shadow: 0 12px 32px rgba(155, 13, 66, 0.07);
    padding: 1.75rem 1.5rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 1.35rem;
  }
  .up-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.85rem;
  }
  .up-avatar {
    width: 104px;
    height: 104px;
    border-radius: 999px;
    object-fit: cover;
    border: 3px solid rgba(202, 17, 86, 0.22);
    background: #fff5f8;
    box-shadow: 0 8px 20px rgba(202, 17, 86, 0.12);
  }
  .up-name {
    margin: 0;
    font-size: 1.45rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #9b0d42;
    line-height: 1.25;
    word-break: break-word;
  }
  .up-sub {
    margin: 0.35rem 0 0;
    font-size: 0.9rem;
    color: #5c4f55;
    line-height: 1.45;
  }
  .up-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  .up-stat {
    padding: 1rem 0.75rem;
    border-radius: 1rem;
    background: linear-gradient(180deg, #fff5f8 0%, #ffebf1 100%);
    border: 1px solid rgba(202, 17, 86, 0.12);
    text-align: center;
  }
  .up-stat strong {
    display: block;
    font-size: 1.5rem;
    font-weight: 800;
    color: #9b0d42;
    line-height: 1.1;
    margin-bottom: 0.3rem;
  }
  .up-stat span {
    font-size: 0.82rem;
    font-weight: 600;
    color: #5c4f55;
  }
  .up-actions {
    display: flex;
    justify-content: center;
    padding-top: 0.15rem;
  }
  .up-actions .pts-btn {
    min-width: 180px;
  }
  .up-msg {
    margin: 0;
    text-align: center;
    color: #5c4f55;
    font-size: 0.95rem;
  }
  .up-msg.is-error { color: #ba1a1a; }
</style>
</head>
<body class="pts-body">
<div id="app-navbar"></div>
<main class="pts-main up-shell">
  <section class="up-card" id="profile-box">
    <p class="up-msg">กำลังโหลดโปรไฟล์...</p>
  </section>
</main>
<script>
const escapeHtml = (t) => String(t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
(async () => {
  const box = document.getElementById('profile-box');
  const id = Number(new URLSearchParams(location.search).get('id') || 0);
  if (!id) {
    box.innerHTML = `
      <p class="up-msg is-error">ไม่พบรหัสผู้ใช้</p>
      <div class="up-actions"><a class="pts-btn pts-btn-primary" href="Community.html">กลับคอมมูนิตี้</a></div>`;
    return;
  }
  try {
    const res = await fetch(`/api/users/${id}/public`, { credentials: 'include' });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || 'โหลดไม่สำเร็จ');
    const u = data.data;
    box.innerHTML = `
      <div class="up-head">
        <img class="up-avatar" src="${escapeHtml(u.avatar_url)}" alt="">
        <div>
          <h1 class="up-name">${escapeHtml(u.username || 'ผู้ใช้งาน')}</h1>
          <p class="up-sub">สมาชิกคอมมูนิตี้ PA Learning</p>
        </div>
      </div>
      <div class="up-stats">
        <div class="up-stat"><strong>${Number(u.post_count || 0)}</strong><span>โพสต์</span></div>
        <div class="up-stat"><strong>${Number(u.course_count || 0)}</strong><span>หลักสูตรที่สมัคร</span></div>
      </div>
      <div class="up-actions">
        <a class="pts-btn pts-btn-primary" href="Community.html">กลับคอมมูนิตี้</a>
      </div>`;
  } catch (e) {
    box.innerHTML = `
      <p class="up-msg is-error">${escapeHtml(e.message)}</p>
      <div class="up-actions"><a class="pts-btn pts-btn-outline" href="Community.html">กลับคอมมูนิตี้</a></div>`;
  }
})();
</script>
<script src="/comp/navbar.js?v=20260727baijam"></script>
</body>
</html>
