<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หลักสูตรของฉัน | PTS Learning</title>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<script src="/comp/theme-boot.js"></script>
<script src="/comp/pts-api.js?v=20260810namefix"></script>
<script src="/comp/i18n-dict.js?v=20260813enfix"></script>
<script src="/comp/lang-boot.js?v=20260813enfix"></script>
<script src="/comp/course-i18n.js?v=20260810selectstar"></script>
<link href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=20260902seed"https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#ca1156','on-surface-variant':'#544245',error:'#ba1a1a'}}}}</script>
<link rel="stylesheet" href="css/MyCourses.css?v=20260904css">
</head>
<body class="pts-body">
<div id="app-navbar"></div>

<main class="pts-main" data-user-shell>
  <section class="pts-page-hero">
    <span class="pts-chip mb-3">My Courses</span>
    <h1 class="text-3xl md:text-4xl font-bold text-primary mb-2 pts-display" data-i18n="page.mycourses.section_title">หลักสูตรของฉัน</h1>
    <p class="text-on-surface-variant" data-i18n="page.mycourses.sub">ดูว่าตอนนี้เรียนถึงไหนแล้ว และหลักสูตรที่สมัครไว้ทั้งหมด</p>
  </section>

  <div id="myc-summary" class="myc-summary" aria-live="polite">
    <div class="myc-stat"><div class="myc-stat__label" data-i18n="myc.total">ทั้งหมด</div><div class="myc-stat__value" id="stat-total">—</div></div>
    <div class="myc-stat"><div class="myc-stat__label" data-i18n="myc.inProgress">กำลังเรียน</div><div class="myc-stat__value" id="stat-progress">—</div></div>
    <div class="myc-stat"><div class="myc-stat__label" data-i18n="myc.done">เรียนจบแล้ว</div><div class="myc-stat__value" id="stat-done">—</div></div>
    <div class="myc-stat"><div class="myc-stat__label" data-i18n="myc.avg">ความคืบหน้าเฉลี่ย</div><div class="myc-stat__value" id="stat-avg">—</div></div>
  </div>

  <section class="myc-section" id="section-in-progress">
    <div class="myc-section__head">
      <h2 class="myc-section__section_title" data-i18n="myc.sectionProgress">กำลังเรียนอยู่</h2>
      <p class="myc-section__hint" id="hint-in-progress" data-i18n="myc.sectionProgressHint">หลักสูตรที่ยังเรียนไม่จบ</p>
    </div>
    <div id="list-in-progress" class="myc-list">
      <div class="pts-empty pts-card">กำลังโหลด...</div>
    </div>
  </section>

  <section class="myc-section" id="section-all">
    <div class="myc-section__head">
      <h2 class="myc-section__section_title" data-i18n="myc.sectionAll">หลักสูตรที่สมัครทั้งหมด</h2>
      <p class="myc-section__hint" data-i18n="myc.sectionAllHint">เรียงตามอัปเดตล่าสุด</p>
    </div>
    <div class="myc-filters" role="tablist" aria-label="กรองหลักสูตร">
      <button type="button" class="myc-filter pts-btn pts-btn-primary" data-filter="all" data-i18n="myc.filterAll">ทั้งหมด</button>
      <button type="button" class="myc-filter pts-btn pts-btn-outline" data-filter="in_progress" data-i18n="myc.filterProgress">กำลังเรียน</button>
      <button type="button" class="myc-filter pts-btn pts-btn-outline" data-filter="completed" data-i18n="myc.filterDone">เรียนจบแล้ว</button>
    </div>
    <div id="list-all" class="myc-list">
      <div class="pts-empty pts-card">กำลังโหลด...</div>
    </div>
  </section>
</main>

<script>
const escapeHtml = (t) => String(t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const PLACEHOLDER = 'https://placehold.co/640x400/f8e8ec/974258?text=PTS+Course';

let allCourses = [];
let filterMode = 'all';

function statusLabel(status) {
  if (status === 'completed') return { text: 'เรียนจบแล้ว', cls: 'myc-status--done' };
  if (status === 'in_progress') return { text: 'กำลังเรียน', cls: 'myc-status--progress' };
  return { text: status || 'สมัครแล้ว', cls: 'myc-status--other' };
}

function courseCard(course, { emphasizeProgress = false } = {}) {
  course = window.PTSCourseI18n ? PTSCourseI18n.localize(course) : course;
  const progress = Math.max(0, Math.min(100, Number(course.progress_percent || 0)));
  const image = course.cover_image_url || PLACEHOLDER;
  const mode = (course.delivery_mode || '').toString().toLowerCase();
  const badgeBg = mode === 'onsite' ? '#ffc800' : mode === 'hybrid' ? '#007ede' : mode === 'online' ? '#00ca01' : '#ca1156';
  const badgeLabel = mode === 'onsite' ? 'Onsite' : mode === 'hybrid' ? 'Hybrid' : mode === 'online' ? 'Online' : (course.delivery_mode || 'หลักสูตร');
  const st = statusLabel(course.status);
  const hours = course.total_hours != null ? `${Number(course.total_hours)} ชม.` : '';
  const primaryHref = course.status === 'completed'
    ? `Certificates.html`
    : `Learn.html?courseId=${course.course_id}`;
  const primaryLabel = course.status === 'completed' ? 'ดูใบประกาศ' : 'เข้าเรียนต่อ';

  return `
    <article class="myc-card">
      <div class="myc-card__media">
        <img src="${escapeHtml(image)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
        <span class="pts-course-card__badge" style="background:${badgeBg}">${escapeHtml(badgeLabel)}</span>
      </div>
      <div class="myc-card__body">
        <div class="myc-card__info">
          <div class="myc-card__top">
            <span class="myc-status ${st.cls}">${st.text}</span>
            ${hours ? `<span class="myc-card__meta">${escapeHtml(hours)}</span>` : ''}
          </div>
          <h3 class="myc-card__section_title">${escapeHtml(course.course_name)}</h3>
          <p class="myc-card__meta">โดย ${escapeHtml(course.instructor_name || '-')}</p>
        </div>
        <div class="myc-card__foot">
          <div>
            <div class="myc-progress-row">
              <span>ความคืบหน้า</span>
              <strong>${progress}%</strong>
            </div>
            <div class="myc-bar" aria-hidden="true"><span style="width:${progress}%"></span></div>
          </div>
          <div class="myc-actions">
            <a class="pts-btn pts-btn-primary" href="${primaryHref}">${primaryLabel}</a>
            <a class="myc-actions__link" href="CourseDetail.html?courseId=${course.course_id}">รายละเอียด</a>
          </div>
        </div>
      </div>
    </article>`;
}

function emptyState(message, ctaHref, ctaLabel) {
  return `<div class="pts-empty pts-card">${message}${ctaHref ? `<br><a class="text-primary font-bold" href="${ctaHref}">${ctaLabel}</a>` : ''}</div>`;
}

function isInProgress(course) {
  const p = Number(course.progress_percent || 0);
  return course.status === 'in_progress' || (course.status !== 'completed' && p < 100);
}

function renderInProgress() {
  const box = document.getElementById('list-in-progress');
  const list = allCourses.filter(isInProgress);

  document.getElementById('hint-in-progress').textContent =
    list.length ? `${list.length} หลักสูตรที่ยังเรียนไม่จบ` : 'ยังไม่มีหลักสูตรที่กำลังเรียน';

  if (!list.length) {
    box.innerHTML = emptyState('ยังไม่มีหลักสูตรที่กำลังเรียนอยู่', 'Courses.html', 'ไปเลือกหลักสูตร');
    return;
  }
  box.innerHTML = list.map((c) => courseCard(c, { emphasizeProgress: true })).join('');
}

function renderAll() {
  const box = document.getElementById('list-all');
  let list = allCourses.slice();
  if (filterMode === 'in_progress') {
    list = list.filter(isInProgress);
  } else if (filterMode === 'completed') {
    list = list.filter((c) => c.status === 'completed' || Number(c.progress_percent || 0) >= 100);
  }

  if (!allCourses.length) {
    box.innerHTML = emptyState('คุณยังไม่ได้สมัครหลักสูตรใดๆ', 'Courses.html', 'ไปเลือกหลักสูตร');
    return;
  }
  if (!list.length) {
    box.innerHTML = emptyState('ไม่มีหลักสูตรในหมวดนี้');
    return;
  }
  box.innerHTML = list.map((c) => courseCard(c)).join('');
}

function setFilter(mode) {
  filterMode = mode;
  document.querySelectorAll('.myc-filter').forEach((btn) => {
    const active = btn.dataset.filter === mode;
    btn.className = 'myc-filter pts-btn ' + (active ? 'pts-btn-primary' : 'pts-btn-outline');
  });
  renderAll();
}

document.querySelectorAll('.myc-filter').forEach((btn) => {
  btn.addEventListener('click', () => setFilter(btn.dataset.filter));
});

(async () => {
  try {
    const meOut = await ptsFetch('/api/users/me');
    const me = meOut.data || {};
    if (!me.loggedIn) return (location.href = 'Login.html');

    const payload = await ptsJson('/api/my/courses');

    allCourses = payload.data || [];
    const summary = payload.summary || {};

    document.getElementById('stat-total').textContent = String(summary.total ?? allCourses.length);
    document.getElementById('stat-progress').textContent = String(summary.in_progress ?? 0);
    document.getElementById('stat-done').textContent = String(summary.completed ?? 0);
    document.getElementById('stat-avg').textContent = `${Number(summary.average_progress || 0)}%`;

    renderInProgress();
    renderAll();
    document.addEventListener('pts-lang-change', () => {
      renderInProgress();
      renderAll();
    });
  } catch (err) {
    const msg = escapeHtml(err.message || 'เกิดข้อผิดพลาด');
    document.getElementById('list-in-progress').innerHTML = `<div class="pts-card p-5 text-error">${msg} <button type="button" class="pts-btn pts-btn-outline" onclick="location.reload()">ลองใหม่</button></div>`;
    document.getElementById('list-all').innerHTML = `<div class="pts-card p-5 text-error">${msg}</div>`;
  }
})();
</script>
<script src="/comp/user-sidebar.js?v=20260727paymodal"></script>
<script src="/comp/navbar.js?v=20260903logo"></script>
</body>
</html>
