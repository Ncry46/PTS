<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/comp/lang-boot.js?v=20260813enfix"></script>

<script>tailwind.config={theme:{extend:{colors:{primary:'#ca1156','on-surface-variant':'#5c4f55'}}}}</script>

</head>
<body class="pts-body">
<div id="app-navbar">
  <nav style="position:fixed;top:0;left:0;right:0;z-index:99999;height:68px;background:var(--pts-nav-bg,#fff);border-bottom:1px solid var(--pts-border,rgba(151,66,88,.18));">
    <div style="max-width:1120px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;justify-content:space-between;">
      <a href="Home.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--pts-text,#1c1520);font-weight:700;">
        <img src="/uploads/logo/Logo.svg" alt="PTS Learning" style="height:42px;width:auto;max-width:160px;object-fit:contain;display:block;">
        PTS Learning
      </a>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a href="Login.html" style="padding:8px 14px;border:1px solid var(--pts-primary);border-radius:999px;color:var(--pts-primary);text-decoration:none;font-weight:700;font-size:14px;">เข้าสู่ระบบ</a>
        <a href="Register.html" style="padding:8px 14px;background:var(--pts-primary);border-radius:999px;color:#fff;text-decoration:none;font-weight:700;font-size:14px;">สมัครสมาชิก</a>
      </div>
    </div>
  </nav>
</div>
<main class="pts-main pts-main--wide">
  <section class="pts-page-hero mb-5">
    <span class="pts-chip mb-3">Learning</span>
    <h1 id="course-section_title" class="text-2xl md:text-3xl font-bold text-primary pts-display">กำลังโหลด...</h1>
  </section>
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
    <aside class="lg:col-span-4 pts-panel h-fit lg:sticky lg:top-24">
      <h2 class="font-bold mb-3 text-sm uppercase tracking-wide text-on-surface-variant">บทเรียน</h2>
      <div id="lesson-list" class="space-y-2"></div>
    </aside>
    <section class="lg:col-span-8 pts-panel min-h-[480px]">
      <div id="lesson-view" class="text-on-surface-variant">เลือกบทเรียนจากด้านซ้าย</div>
    </section>
  </div>
  <section class="pts-panel pts-reviews" id="reviews-section" aria-label="รีวิวหลักสูตร">
    <div class="pts-reviews__head">
      <h2 class="text-xl font-bold text-primary pts-display mb-0">รีวิวจากผู้เรียน</h2>
      <p class="pts-reviews__avg" id="reviews-summary" style="margin:0">กำลังโหลด...</p>
    </div>
    <div id="reviews-form-host"></div>
    <div class="pts-review-list" id="reviews-list"></div>
  </section>
</main>
<div class="pts-footer-note">© PTS Learning</div>
<script>
const params = new URLSearchParams(location.search);
const courseId = params.get('courseId');
const focusLessonId = params.get('lessonId');
const escapeHtml = (t) => String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const tt = (key, fallback) => (window.PTSLang && typeof PTSLang.t === 'function' ? PTSLang.t(key, fallback) : (fallback || key));
const loginNextHref = () => {
  const next = `Learn.html?courseId=${encodeURIComponent(courseId || '')}`;
  return `Login.html?next=${encodeURIComponent(next)}`;
};
const isMeetingUrl = (raw) => {
  const s = String(raw || '').toLowerCase();
  return /zoom\.us|zoom\.com|teams\.microsoft\.com|teams\.live\.com|meet\.google\.com/.test(s);
};
const meetingLabel = (raw) => {
  const s = String(raw || '').toLowerCase();
  if (/zoom\.us|zoom\.com/.test(s)) return 'Zoom';
  if (/teams\.microsoft\.com|teams\.live\.com/.test(s)) return 'Teams';
  if (/meet\.google\.com/.test(s)) return 'Google Meet';
  return 'ห้องประชุม';
};

async function loadCourseLessons() {
  if (!courseId) {
    document.getElementById('course-section_title').textContent = 'ไม่พบรหัสหลักสูตร';
    return;
  }
  const resOut = await ptsFetch(`/api/courses/${courseId}/lessons`);
  const data = resOut.data || {};
  if (resOut.status === 401) return location.href = 'Login.html';
  if (!resOut.ok || !data.success) throw new Error(data.message || 'โหลดบทเรียนไม่สำเร็จ');
  if (!data.enrolled) {
    window.__ptsLearnCourse = data.course;
    document.getElementById('course-section_title').textContent = window.PTSCourseI18n
      ? PTSCourseI18n.name(data.course)
      : (data.course.course_name || '');
    document.getElementById('lesson-view').innerHTML = `<div class="pts-empty" style="border:none;padding:24px 0"><p class="mb-4">คุณยังไม่ได้สมัครหลักสูตรนี้</p><a class="pts-btn pts-btn-primary" href="Courses.html">ไปสมัครเรียน</a></div>`;
    return;
  }
  if (data.required_form && data.required_form.form_id) {
    const next = encodeURIComponent(`Learn.html?courseId=${courseId}`);
    location.href = `FormFill.html?id=${data.required_form.form_id}&next=${next}`;
    return;
  }
  window.__ptsLearnCourse = data.course;
  document.getElementById('course-section_title').textContent = window.PTSCourseI18n
    ? PTSCourseI18n.name(data.course)
    : (data.course.course_name || '');
  const list = document.getElementById('lesson-list');
  if (!data.data.length) {
    list.innerHTML = '<p class="text-sm text-on-surface-variant p-2">ยังไม่มีบทเรียนในหลักสูตรนี้</p>';
    document.getElementById('lesson-view').innerHTML = '<div class="pts-empty" style="border:none">ยังไม่มีบทเรียนให้เรียน</div>';
    return;
  }
  list.innerHTML = data.data.map(l => `
    <button data-id="${l.lesson_id}" class="lesson-item w-full text-left p-3 rounded-xl border transition ${Number(l.completed) ? 'border-emerald-200 bg-emerald-50' : 'border-[var(--pts-border)] hover:bg-[var(--pts-primary-soft)]'}">
      <div class="font-semibold text-sm">${escapeHtml(l.title || l.lesson_title || l.section_title || '')}</div>
      <div class="text-xs text-on-surface-variant mt-1">${l.duration_minutes || 0} นาที ${Number(l.completed) ? '· เรียนจบแล้ว' : ''}</div>
    </button>
  `).join('');

  list.onclick = (e) => {
    const btn = e.target.closest('.lesson-item');
    if (!btn) return;
    openLesson(btn.dataset.id);
  };

  const first = focusLessonId || (data.data[0] && data.data[0].lesson_id);
  if (first) openLesson(first);
}

async function openLesson(lessonId) {
  const view = document.getElementById('lesson-view');
  view.innerHTML = 'กำลังโหลดบทเรียน...';
  try {
    const out = await ptsFetch(`/api/lessons/${lessonId}`);
    const data = out.data || {};
    if (!out.ok || !data.success) {
      view.innerHTML = `<p class="pts-msg--err">${escapeHtml(data.message || 'โหลดไม่สำเร็จ')}</p>`;
      return;
    }
    const lesson = data.data;
  const videoUrl = String(lesson.video_url || '').trim();
  let video = '';
  if (videoUrl) {
    if (isMeetingUrl(videoUrl)) {
      const label = meetingLabel(videoUrl);
      video = `<div class="mb-5 rounded-2xl border p-5 flex flex-wrap items-center gap-4" style="border-color:var(--pts-border);background:color-mix(in srgb, var(--pts-primary, #ca1156) 5%, transparent)">
        <span class="material-symbols-outlined" style="font-size:40px;color:var(--pts-primary)">videocam</span>
        <div class="flex-1 min-w-[200px]">
          <div class="font-bold text-lg">ห้องเรียนสด (${escapeHtml(label)})</div>
          <p class="text-sm text-on-surface-variant" style="margin:4px 0 0">ถึงเวลาเรียนแล้วกดปุ่มเพื่อเข้าห้องได้เลย ห้องจะเปิดในแท็บใหม่</p>
        </div>
        <a class="pts-btn pts-btn-primary" href="${videoUrl.replace(/"/g, '%22')}" target="_blank" rel="noopener">เข้าห้องเรียนสด</a>
      </div>`;
    } else {
      video = `<div class="aspect-video mb-5 rounded-xl overflow-hidden bg-black"><iframe class="w-full h-full" src="${escapeHtml(videoUrl)}" allowfullscreen></iframe></div>`;
    }
  }
  view.innerHTML = `
    <h2 class="text-2xl font-bold mb-2 pts-display">${escapeHtml(lesson.title || lesson.lesson_title || lesson.section_title || '')}</h2>
    <p class="text-sm text-on-surface-variant mb-5">${lesson.duration_minutes || 0} นาที · ${escapeHtml(lesson.course_name || '')}</p>
    ${video}
    <div class="leading-relaxed mb-6 text-[15px]">${lesson.content_html || '<p>ยังไม่มีเนื้อหา</p>'}</div>
    <button id="complete-btn" class="pts-btn pts-btn-primary ${Number(lesson.completed) ? 'opacity-60' : ''}">
      ${Number(lesson.completed) ? 'เรียนจบบทนี้แล้ว' : 'ทำเครื่องหมายว่าเรียนจบ'}
    </button>
    <p id="complete-msg" class="pts-msg"></p>
  `;
  document.getElementById('complete-btn').onclick = async () => {
    const r = await fetch(`/api/lessons/${lessonId}/complete`, { method: 'POST', credentials: 'include' });
    const j = await r.json();
    const msg = document.getElementById('complete-msg');
    if (!r.ok || !j.success) { msg.textContent = j.message || 'บันทึกไม่สำเร็จ'; msg.className='pts-msg pts-msg--err'; return; }
    msg.textContent = `บันทึกแล้ว ความคืบหน้าหลักสูตร ${j.progress}% (${j.completed}/${j.total} บท)`;
    msg.className = 'pts-msg pts-msg--ok';
    loadCourseLessons();
    loadLearnReviews();
  };
  } catch (err) {
    view.innerHTML = `<p class="pts-msg--err">${escapeHtml(err.message || 'โหลดไม่สำเร็จ')}</p>`;
  }
}

const starsHtml = (n) => {
  const score = Math.round(Number(n) || 0);
  return `<span class="pts-stars" aria-label="${score} จาก 5 ดาว">${[1,2,3,4,5].map((i) =>
    `<span class="material-symbols-outlined${i <= score ? '' : ' is-empty'}" aria-hidden="true">star</span>`
  ).join('')}</span>`;
};

const fmtReviewDate = (v) => {
  if (!v) return '';
  try { return new Date(v).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }); }
  catch (_) { return ''; }
};

async function loadLearnReviews() {
  const listEl = document.getElementById('reviews-list');
  const formHost = document.getElementById('reviews-form-host');
  const summaryEl = document.getElementById('reviews-summary');
  if (!courseId || !listEl) return;
  try {
    let loggedIn = false;
    try {
      const meOut = await ptsFetch('/api/users/me');
      loggedIn = !!((meOut.data || {}).loggedIn);
    } catch (_) { loggedIn = false; }
    const r = await fetch(`/api/courses/${courseId}/reviews`, { credentials: 'include' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.success === false) throw new Error(j.message || 'โหลดรีวิวไม่สำเร็จ');

    const avg = Number(j.summary?.average_rating || 0).toFixed(1);
    const total = Number(j.summary?.total_reviews || 0);
    const reviewText = tt('common.reviews', 'รีวิว');
    summaryEl.innerHTML = `${starsHtml(avg)} <strong>${avg}</strong> · ${total} ${reviewText}`;

    if (!loggedIn) {
      formHost.innerHTML = `<p class="pts-review-gate">เข้าสู่ระบบ และสมัครเรียน+ชำระเงินแล้ว จึงจะรีวิวได้ · <a class="text-primary font-bold" href="${loginNextHref()}">เข้าสู่ระบบ</a></p>`;
    } else if (!j.can_review) {
      formHost.innerHTML = `<p class="pts-review-gate">${escapeHtml(j.can_review_reason || 'ยังไม่สามารถรีวิวได้')}</p>`;
    } else {
      const mine = j.my_review;
      const current = mine ? Number(mine.rating) : 0;
      formHost.innerHTML = `
        <div class="pts-review-form">
          <p class="font-bold text-primary mb-2">${mine ? 'แก้ไขรีวิวของคุณ' : 'เขียนรีวิวหลักสูตรนี้'}</p>
          <label>คะแนน</label>
          <div class="pts-star-pick" id="star-pick" data-rating="${current}">
            ${[1,2,3,4,5].map((i) => `<button type="button" data-star="${i}" class="${i <= current ? 'is-on' : ''}" aria-label="${i} ดาว"><span class="material-symbols-outlined">star</span></button>`).join('')}
          </div>
          <label for="review-comment">ความคิดเห็น (ไม่บังคับ)</label>
          <textarea id="review-comment" maxlength="1000" placeholder="แชร์ประสบการณ์เรียนของคุณ...">${escapeHtml(mine?.comment || '')}</textarea>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="pts-btn pts-btn-primary" id="review-submit">${mine ? 'อัปเดตรีวิว' : 'ส่งรีวิว'}</button>
            ${mine ? `<button type="button" class="pts-btn pts-btn-ghost" id="review-delete" style="color:#ba1a1a">ลบรีวิว</button>` : ''}
          </div>
          <p id="review-msg" class="pts-msg" style="margin-top:10px" hidden></p>
        </div>`;

      const pick = document.getElementById('star-pick');
      pick.querySelectorAll('button').forEach((btn) => {
        btn.onclick = () => {
          const v = Number(btn.dataset.star);
          pick.dataset.rating = String(v);
          pick.querySelectorAll('button').forEach((b) => {
            b.classList.toggle('is-on', Number(b.dataset.star) <= v);
          });
        };
      });

      document.getElementById('review-submit').onclick = async () => {
        const msg = document.getElementById('review-msg');
        const rating = Number(pick.dataset.rating || 0);
        const comment = document.getElementById('review-comment').value.trim();
        msg.hidden = false;
        if (!rating) {
          msg.textContent = 'กรุณาเลือกคะแนนดาว';
          msg.className = 'pts-msg pts-msg--err';
          return;
        }
        try {
          const res = await fetch(`/api/courses/${courseId}/reviews`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rating, comment })
          });
          const out = await res.json().catch(() => ({}));
          if (!res.ok || out.success === false) throw new Error(out.message || 'ส่งรีวิวไม่สำเร็จ');
          msg.textContent = out.message || 'บันทึกแล้ว';
          msg.className = 'pts-msg pts-msg--ok';
          await loadLearnReviews();
        } catch (err) {
          msg.textContent = err.message || 'ส่งรีวิวไม่สำเร็จ';
          msg.className = 'pts-msg pts-msg--err';
        }
      };

      document.getElementById('review-delete')?.addEventListener('click', async () => {
        if (!confirm('ลบรีวิวของคุณ?')) return;
        try {
          const res = await fetch(`/api/courses/${courseId}/reviews/me`, {
            method: 'DELETE',
            credentials: 'include'
          });
          const out = await res.json().catch(() => ({}));
          if (!res.ok || out.success === false) throw new Error(out.message || 'ลบไม่สำเร็จ');
          await loadLearnReviews();
        } catch (err) {
          alert(err.message || 'ลบไม่สำเร็จ');
        }
      });
    }

    const rows = j.data || [];
    if (!rows.length) {
      listEl.innerHTML = '<p class="text-sm text-on-surface-variant">ยังไม่มีรีวิว — เป็นคนแรกที่รีวิวได้หลังเรียนจบ 100%</p>';
    } else {
      listEl.innerHTML = rows.map((rv) => `
        <article class="pts-review-item">
          <div class="pts-review-item__top">
            <span class="pts-review-item__name">${escapeHtml(rv.full_name || 'ผู้เรียน')}</span>
            <span class="pts-review-item__date">${escapeHtml(fmtReviewDate(rv.updated_at || rv.created_at))}</span>
          </div>
          ${starsHtml(rv.rating)}
          ${rv.comment ? `<p class="pts-review-item__comment">${escapeHtml(rv.comment)}</p>` : ''}
        </article>`).join('');
    }
  } catch (err) {
    summaryEl.textContent = 'โหลดรีวิวไม่สำเร็จ';
    listEl.innerHTML = `<p class="text-sm text-error">${escapeHtml(err.message || '')}</p>`;
  }
}

loadCourseLessons().catch(err => {
  document.getElementById('lesson-view').innerHTML = `<p class="pts-msg--err">${escapeHtml(err.message)}</p>`;
});
if (courseId) loadLearnReviews();
document.addEventListener('pts-lang-change', () => {
  if (!window.__ptsLearnCourse) return;
  const el = document.getElementById('course-section_title');
  if (!el) return;
  el.textContent = window.PTSCourseI18n
    ? PTSCourseI18n.name(window.__ptsLearnCourse)
    : (window.__ptsLearnCourse.course_name || '');
});
</script>

      + '<div style="max-width:1120px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;justify-content:space-between">'
      + '<a href="Home.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--pts-text,#1c1520);font-weight:700">'
      + '<img src="/uploads/logo/Logo.svg" alt="PTS Learning" style="height:42px;width:auto;max-width:160px;object-fit:contain;display:block">PTS Learning</a>'
      + '<div style="display:flex;gap:8px">'
      + '<a href="Login.html" style="padding:8px 14px;border:1px solid var(--pts-primary);border-radius:999px;color:var(--pts-primary);text-decoration:none;font-weight:700;font-size:14px">เข้าสู่ระบบ</a>'
      + '<a href="Register.html" style="padding:8px 14px;background:var(--pts-primary);border-radius:999px;color:#fff;text-decoration:none;font-weight:700;font-size:14px">สมัครสมาชิก</a>'
      + '</div></div></nav>';
  }
})();
</script>
