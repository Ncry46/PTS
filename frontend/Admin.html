  };

  searchInput.addEventListener('input', () => renderList(searchInput.value));
  renderList();
}

async function renderPosts() {
  const { data } = await api('/api/admin/posts');
  const postsCache = data || [];

  const isVisible = (p) => Number(p.flag_use) === 1 || p.flag_use === true;

  const fmtDate = (v) => {
    if (!v) return '—';
    try {
      return new Date(v).toLocaleString('th-TH', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    } catch (_) { return '—'; }
  };

  document.getElementById('panel').innerHTML = `
    <div class="adm-c-head">
      <div>
        <h3>ดูแลโพสต์คอมมูนิตี้</h3>
        <p>โหมด Auto-Publish — โพสต์ขึ้นทันที แอดมินค่อยซ่อนเนื้อหาไม่เหมาะสมทีหลัง</p>
      </div>
    </div>
    <div class="adm-c-tools">
      <input id="post-search" class="adm-c-search" type="search" placeholder="ค้นหาเนื้อหา / ผู้โพสต์ / อีเมล / ID..." autocomplete="off">
      <span class="adm-c-count" id="post-count">0 โพสต์</span>
    </div>
    <div id="post-list-area"></div>
  `;

  const searchInput = document.getElementById('post-search');
  const countEl = document.getElementById('post-count');
  const listArea = document.getElementById('post-list-area');

  const snippet = (text, n = 140) => {
    const t = String(text || '').replace(/\s+/g, ' ').trim();
    if (t.length <= n) return t;
    return t.slice(0, n) + '…';
  };

  const actionBtns = (p) => isVisible(p)
    ? `<div class="adm-c-actions">
        <button type="button" class="pts-btn pts-btn-ghost hide-post" data-id="${p.post_id}" style="color:#ba1a1a;">ซ่อน</button>
      </div>`
    : `<div class="adm-c-actions">
        <button type="button" class="pts-btn pts-btn-outline restore-post" data-id="${p.post_id}">แสดงอีกครั้ง</button>
      </div>`;

  const rowHtml = (p) => `
    <tr data-post-id="${p.post_id}" class="${isVisible(p) ? '' : 'opacity-60'}">
      <td>
        <div class="adm-c-course">
          <span class="adm-c-id" title="รหัสโพสต์">ID ${escapeHtml(p.post_id)}</span>
          <div class="adm-c-name" style="font-weight:600;white-space:pre-wrap;">${escapeHtml(snippet(p.content, 160))}</div>
        </div>
      </td>
      <td>
        <div class="adm-c-name" style="font-size:13px;">${escapeHtml(p.author_name || '—')}</div>
        <div class="adm-c-id" style="margin-top:4px;border:0;background:transparent;padding:0;color:#5c4f55;">${escapeHtml(p.email || '')}</div>
      </td>
      <td>${fmtDate(p.created_at)}</td>
      <td><span class="adm-c-badge${isVisible(p) ? ' is-on' : ''}">${isVisible(p) ? 'แสดงอยู่' : 'ซ่อนแล้ว'}</span></td>
      <td>${actionBtns(p)}</td>
    </tr>`;

  const cardHtml = (p) => `
    <article class="adm-c-card ${isVisible(p) ? '' : 'opacity-70'}" data-post-id="${p.post_id}">
      <div class="adm-c-card__top">
        <div class="adm-c-course">
          <span class="adm-c-id" title="รหัสโพสต์">ID ${escapeHtml(p.post_id)}</span>
          <div class="adm-c-name" style="font-weight:600;white-space:pre-wrap;">${escapeHtml(snippet(p.content, 180))}</div>
        </div>
        <span class="adm-c-badge${isVisible(p) ? ' is-on' : ''}">${isVisible(p) ? 'แสดงอยู่' : 'ซ่อนแล้ว'}</span>
      </div>
      <div class="adm-c-card__meta">
        <span>${escapeHtml(p.author_name || '—')}</span>
        <span>${escapeHtml(p.email || '—')}</span>
        <span>${fmtDate(p.created_at)}</span>
      </div>
      ${actionBtns(p)}
    </article>`;

  const matchesQuery = (p, q) => {
    if (!q) return true;
    const idStr = String(p.post_id ?? '').trim();
    const idQuery = q
      .replace(/^ไอดี\s*/i, '')
      .replace(/^id\s*/i, '')
      .replace(/^#\s*/, '')
      .trim();
    if (idQuery && /^\d+$/.test(idQuery) && idStr === idQuery) return true;
    if (idStr && (q === idStr || q === `#${idStr}` || q === `id${idStr}` || q === `id ${idStr}`)) return true;

    const hay = [
      idStr,
      `id ${idStr}`,
      `#${idStr}`,
      p.content,
      p.author_name,
      p.email,
      isVisible(p) ? 'แสดงอยู่ เปิด' : 'ซ่อนแล้ว ซ่อน'
    ].join(' ').toLowerCase();
    return hay.includes(q);
  };

  const bindListActions = () => {
    document.querySelectorAll('.hide-post').forEach((btn) => {
      btn.onclick = async () => {
        if (!window.confirm('ซ่อนโพสต์นี้จากคอมมูนิตี้ใช่หรือไม่?')) return;
        try {
          await api(`/api/admin/posts/${btn.dataset.id}`, { method: 'DELETE' });
          await renderPosts();
        } catch (e) {
          alert(e.message || 'ซ่อนไม่สำเร็จ');
        }
      };
    });
    document.querySelectorAll('.restore-post').forEach((btn) => {
      btn.onclick = async () => {
        try {
          await api(`/api/admin/posts/${btn.dataset.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ flag_use: 1 })
          });
          await renderPosts();
        } catch (e) {
          alert(e.message || 'แสดงโพสต์ไม่สำเร็จ');
        }
      };
    });
  };

  const renderList = (query = '') => {
    const q = String(query || '').trim().toLowerCase();
    const filtered = postsCache.filter((p) => matchesQuery(p, q));
    countEl.textContent = q
      ? `${filtered.length} / ${postsCache.length} โพสต์`
      : `${postsCache.length} โพสต์`;

    if (!postsCache.length) {
      listArea.innerHTML = '<div class="adm-c-empty">ยังไม่มีโพสต์ในคอมมูนิตี้</div>';
      return;
    }
    if (!filtered.length) {
      listArea.innerHTML = '<div class="adm-c-empty">ไม่พบโพสต์ที่ตรงกับคำค้นหา</div>';
      return;
    }

    listArea.innerHTML = `
      <div class="adm-c-table-wrap">
        <table class="adm-c-table">
          <thead>
            <tr>
              <th>เนื้อหา</th>
              <th>ผู้โพสต์</th>
              <th>เวลา</th>
              <th>สถานะ</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody>${filtered.map(rowHtml).join('')}</tbody>
        </table>
      </div>
      <div class="adm-c-cards">${filtered.map(cardHtml).join('')}</div>
    `;
    bindListActions();
  };

  searchInput.addEventListener('input', () => renderList(searchInput.value));
  renderList();
}

async function renderPayments() {
  if (!coursesCache.length) {
    try {
      const { data } = await api('/api/admin/courses');
      coursesCache = data || [];
    } catch (_) { coursesCache = []; }
  }

  const [payRes, codeRes] = await Promise.all([
    api('/api/admin/payments'),
    api('/api/admin/access-codes').catch(() => ({ data: [] }))
  ]);
  let payments = Array.isArray(payRes.data) ? payRes.data.slice() : [];
  let accessCodes = Array.isArray(codeRes.data) ? codeRes.data.slice() : [];
  let filter = 'pending_review';

  const fmtMoney = (n) => Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

  const sourceBadge = (p) => {
    const src = String(p.source || 'direct_signup');
    if (src === 'access_code') {
      return `<span class="adm-pay-src adm-pay-src--code" title="ใช้รหัสเข้าเรียน">🔑 ใช้รหัสเข้าเรียน</span>`;
    }
    return `<span class="adm-pay-src adm-pay-src--direct" title="สมัครผ่านเว็บ">🏷️ สมัครผ่านเว็บ</span>`;
  };

  const statusBadge = (p) => {
    const w = p.workflow || p.status;
    if (w === 'auto_approved' || (p.status === 'paid' && p.is_gateway)) {
      return `<span class="adm-pay-st adm-pay-st--auto">🟢 อนุมัติอัตโนมัติ</span>`;
    }
    if (p.status === 'pending_review') {
      return `<span class="adm-pay-st adm-pay-st--pending">🟡 รอตรวจสอบ</span>`;
    }
    if (p.status === 'paid') {
      return `<span class="adm-pay-st adm-pay-st--paid">อนุมัติแล้ว</span>`;
    }
    if (p.status === 'rejected') {
      return `<span class="adm-pay-st adm-pay-st--rejected">ปฏิเสธ</span>`;
    }
    return `<span class="adm-pay-st adm-pay-st--wait">รอชำระ / รอสลิป</span>`;
  };

  const methodLabel = (p) => {
    const m = String(p.method || '').toLowerCase();
    if (m === 'card') return 'บัตรเครดิต (Gateway)';
    if (m === 'access_code') return 'รหัสเข้าเรียน';
    if (m === 'promptpay' || m === 'bank_transfer') return 'โอนเงิน / PromptPay + สลิป';
    return m || '—';
  };

  const counts = () => ({
    pending_review: payments.filter((p) => p.status === 'pending_review').length,
    paid: payments.filter((p) => p.status === 'paid').length,
    rejected: payments.filter((p) => p.status === 'rejected').length,
    all: payments.length
  });

  const filteredRows = () => {
    if (filter === 'pending_review') return payments.filter((p) => p.status === 'pending_review');
    if (filter === 'paid') return payments.filter((p) => p.status === 'paid');
    if (filter === 'rejected') return payments.filter((p) => p.status === 'rejected');
    return payments;
  };

  const rowActions = (p) => {
    if (p.status === 'pending_review' || (p.status === 'rejected' && p.slip_image_url)) {
      return `<div class="adm-c-actions">
        <button type="button" class="pts-btn pts-btn-primary pay-approve" data-id="${p.payment_id}">อนุมัติ</button>
        ${p.status === 'pending_review'
          ? `<button type="button" class="pts-btn pts-btn-ghost pay-reject" data-id="${p.payment_id}" style="color:#ba1a1a;">ปฏิเสธ</button>`
          : ''}
      </div>`;
    }
    return `<span class="adm-pay-meta">ไม่ต้องดำเนินการ</span>`;
  };

  const paint = () => {
    const c = counts();
    const rows = filteredRows();
    document.getElementById('panel').innerHTML = `
      <div class="adm-c-head">
        <div>
          <h3>จัดการการชำระเงิน</h3>
          <p>แยกที่มาสมัคร · Gateway อนุมัติอัตโนมัติ · โอนแนบสลิปรอตรวจสอบ</p>
        </div>
      </div>
      <div class="adm-pay-tabs" role="tablist">
        <button type="button" class="adm-pay-tab ${filter === 'pending_review' ? 'is-active' : ''}" data-filter="pending_review">
          รอตรวจสอบ<span class="adm-pay-tab__n">${c.pending_review}</span>
        </button>
        <button type="button" class="adm-pay-tab ${filter === 'paid' ? 'is-active' : ''}" data-filter="paid">
          อนุมัติแล้ว / อัตโนมัติ<span class="adm-pay-tab__n">${c.paid}</span>
        </button>
        <button type="button" class="adm-pay-tab ${filter === 'rejected' ? 'is-active' : ''}" data-filter="rejected">
          ปฏิเสธ<span class="adm-pay-tab__n">${c.rejected}</span>
        </button>
        <button type="button" class="adm-pay-tab ${filter === 'all' ? 'is-active' : ''}" data-filter="all">
          ทั้งหมด<span class="adm-pay-tab__n">${c.all}</span>
        </button>
      </div>

      <div class="adm-c-table-wrap">
        <table class="adm-c-table">
          <thead>
            <tr>
              <th>นักเรียน</th>
              <th>หลักสูตร</th>
              <th>ที่มา</th>
              <th>ช่องทาง</th>
              <th>ยอด / เวลาโอน</th>
              <th>สลิป</th>
              <th>สถานะ</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((p) => `
              <tr>
                <td>
                  <div class="adm-c-name">${escapeHtml(p.username || '—')}</div>
                  <div class="adm-pay-meta">${escapeHtml(p.email || '')}</div>
                </td>
                <td>${escapeHtml(getCourseName(p) || '—')}</td>
                <td>${sourceBadge(p)}</td>
                <td><span class="adm-pay-meta">${escapeHtml(methodLabel(p))}</span></td>
                <td>
                  <div class="adm-c-name">฿${fmtMoney(p.amount)}</div>
                  <div class="adm-pay-meta">${fmtDt(p.transfer_at || p.paid_at || p.created_at)}</div>
                  <div class="adm-pay-meta">${escapeHtml(p.reference_code || '')}</div>
                </td>
                <td>
                  ${p.slip_image_url
                    ? `<a class="adm-pay-slip-link" href="${escapeHtml(p.slip_image_url)}" target="_blank" rel="noopener">
                        <img class="adm-pay-slip" src="${escapeHtml(p.slip_image_url)}" alt="สลิป">
                      </a>`
                    : '<span class="adm-pay-meta">—</span>'}
                </td>
                <td>
                  ${statusBadge(p)}
                  ${p.reject_reason ? `<div class="adm-pay-meta mt-1">${escapeHtml(p.reject_reason)}</div>` : ''}
                </td>
                <td>${rowActions(p)}</td>
              </tr>`).join('') || '<tr><td colspan="8" class="adm-c-empty" style="border:0">ไม่มีรายการในแท็บนี้</td></tr>'}
          </tbody>
        </table>
      </div>

      <div class="adm-c-cards">
        ${rows.map((p) => `
          <article class="adm-c-card">
            <div class="adm-c-card__top">
              <div>
                <div class="adm-c-name">${escapeHtml(p.username || '—')}</div>
                <div class="adm-pay-meta">${escapeHtml(p.email || '')}</div>
              </div>
              ${statusBadge(p)}
            </div>
            <div class="adm-c-card__meta">
              <span>${escapeHtml(getCourseName(p) || '—')}</span>
              <span>฿${fmtMoney(p.amount)}</span>
              <span>${fmtDt(p.transfer_at || p.paid_at || p.created_at)}</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0">
              ${sourceBadge(p)}
              <span class="adm-pay-meta">${escapeHtml(methodLabel(p))}</span>
            </div>
            ${p.slip_image_url
              ? `<a href="${escapeHtml(p.slip_image_url)}" target="_blank" rel="noopener"><img class="adm-pay-slip" src="${escapeHtml(p.slip_image_url)}" alt="สลิป"></a>`
              : ''}
            ${rowActions(p)}
          </article>`).join('') || '<div class="adm-c-empty">ไม่มีรายการในแท็บนี้</div>'}
      </div>

      <div class="adm-pay-section">
        <div class="adm-c-head">
          <div>
            <h3>รหัสเข้าเรียน (Access Code)</h3>
            <p>สร้างรหัสให้นักเรียนกรอกเพื่อเปิดคอร์ส — จะบันทึกเป็นที่มา “ใช้รหัสเข้าเรียน”</p>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
          <label class="text-sm font-semibold text-on-surface-variant">หลักสูตร
            <select id="ac-course" class="mt-1 w-full border rounded-xl px-3 py-2">
              <option value="">-- เลือก --</option>
              ${coursesCache.map((c) => `<option value="${c.course_id}">${escapeHtml(getCourseName(c))}</option>`).join('')}
            </select>
          </label>
          <label class="text-sm font-semibold text-on-surface-variant">รหัส (ว่าง = สุ่มให้)
            <input id="ac-code" class="mt-1 w-full border rounded-xl px-3 py-2" placeholder="เช่น PTS-CLASS-A1">
          </label>
          <label class="text-sm font-semibold text-on-surface-variant">จำนวนครั้งใช้ได้ (ว่าง = ไม่จำกัด)
            <input id="ac-max" type="number" min="1" class="mt-1 w-full border rounded-xl px-3 py-2" placeholder="เช่น 30">
          </label>
          <label class="text-sm font-semibold text-on-surface-variant">หมดอายุ (ถ้ามี)
            <input id="ac-exp" type="datetime-local" class="mt-1 w-full border rounded-xl px-3 py-2">
          </label>
          <label class="text-sm font-semibold text-on-surface-variant md:col-span-2">หมายเหตุ
            <input id="ac-note" class="mt-1 w-full border rounded-xl px-3 py-2" placeholder="เช่น รุ่น ก.ค. 69">

        </div>
        <button type="button" id="ac-create" class="pts-btn pts-btn-primary mb-2">สร้างรหัส</button>

          ${accessCodes.map((a) => `
            <div class="border rounded-xl p-3 flex flex-wrap justify-between gap-2 items-start">
              <div>
                <p class="font-bold font-mono tracking-wide">${escapeHtml(a.code)}</p>
                <p class="adm-pay-meta">${escapeHtml(getCourseName(a) || '')} · ใช้แล้ว ${Number(a.used_count || 0)}${a.max_uses != null ? ` / ${a.max_uses}` : ''}</p>
                <p class="adm-pay-meta">${a.expires_at ? `หมดอายุ ${fmtDt(a.expires_at)}` : 'ไม่หมดอายุ'}${a.note ? ` · ${escapeHtml(a.note)}` : ''}</p>

        </div>
      </div>

    document.querySelectorAll('.adm-pay-tab').forEach((btn) => {
      btn.onclick = () => { filter = btn.dataset.filter; paint(); };
    });

    document.querySelectorAll('.pay-approve').forEach((btn) => {
      btn.onclick = async () => {
        if (!confirm('อนุมัติรายการนี้และเปิดสิทธิ์คอร์สให้นักเรียนทันที?')) return;
        btn.disabled = true;
        try {
          await api(`/api/admin/payments/${btn.dataset.id}/approve`, { method: 'POST', body: '{}' });
          const fresh = await api('/api/admin/payments');
          payments = Array.isArray(fresh.data) ? fresh.data.slice() : [];
          paint();
        } catch (e) {
          alert(e.message || 'อนุมัติไม่สำเร็จ');
          btn.disabled = false;
        }
      };
    });

    document.querySelectorAll('.pay-reject').forEach((btn) => {
      btn.onclick = async () => {
        const reason = prompt('เหตุผลที่ปฏิเสธ', 'สลิปไม่ถูกต้องหรือยอดไม่ตรง');
        if (reason == null) return;
        btn.disabled = true;
        try {
          await api(`/api/admin/payments/${btn.dataset.id}/reject`, {
            method: 'POST',
            body: JSON.stringify({ reason })
          });
          const fresh = await api('/api/admin/payments');
          payments = Array.isArray(fresh.data) ? fresh.data.slice() : [];
          paint();
        } catch (e) {
          alert(e.message || 'ปฏิเสธไม่สำเร็จ');
          btn.disabled = false;
        }
      };
    });

    const createBtn = document.getElementById('ac-create');
    if (createBtn) {
      createBtn.onclick = async () => {
        const msg = document.getElementById('ac-msg');
        try {
          msg.textContent = 'กำลังสร้าง...';
          msg.className = 'pts-msg mb-3';
          await api('/api/admin/access-codes', {
            method: 'POST',
            body: JSON.stringify({
              course_id: document.getElementById('ac-course').value,
              code: document.getElementById('ac-code').value,
              max_uses: document.getElementById('ac-max').value,
              expires_at: document.getElementById('ac-exp').value,
              note: document.getElementById('ac-note').value
            })
          });
          const fresh = await api('/api/admin/access-codes');
          accessCodes = Array.isArray(fresh.data) ? fresh.data.slice() : [];
          paint();
        } catch (e) {
          msg.textContent = e.message || 'สร้างไม่สำเร็จ';
          msg.className = 'pts-msg pts-msg--err mb-3';
        }
      };
    }

    document.querySelectorAll('.ac-toggle').forEach((btn) => {
      btn.onclick = async () => {
        try {
          await api(`/api/admin/access-codes/${btn.dataset.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ flag_use: Number(btn.dataset.flag) })
          });
          const fresh = await api('/api/admin/access-codes');
          accessCodes = Array.isArray(fresh.data) ? fresh.data.slice() : [];
          paint();
        } catch (e) {
          alert(e.message || 'อัปเดตไม่สำเร็จ');
        }
      };
    });
  };

  paint();
}

async function renderMail() {
  const data = await api('/api/admin/mail');
  const f = data.form || {};

  document.getElementById('panel').innerHTML = `

      msg.className = 'pts-msg pts-msg--err';
    }
  };
}

async function renderCertAssets() {
  const panel = document.getElementById('panel');
  const { data } = await api('/api/admin/cert-assets');
  const bySlot = Object.fromEntries((data || []).map((x) => [x.slot, x]));
  const logo = bySlot.logo || { url: '/uploads/cert/logo.png', filename: 'logo.png' };
  const stamp = bySlot.stamp || { url: '/uploads/cert/stamp.png', filename: 'stamp.png' };

  panel.innerHTML = `
    <div class="space-y-4">
      <div class="pts-card p-5">
        <h2 class="font-bold text-lg mb-1">รูปใบประกาศ</h2>
        <p class="text-sm text-on-surface-variant mb-4">
          อัปโหลดโลโก้และสแตมป์ไปที่โฟลเดอร์ <code>uploads/cert/</code>
          — ไฟล์จะถูกบันทึกเป็น <code>logo.png</code> (โลโก้) และ <code>stamp.png</code> (สแตมป์)
        </p>
        <div class="grid gap-4 md:grid-cols-2">
          <div class="rounded-2xl border border-[var(--pts-border,rgba(151,66,88,.14))] p-4">
            <h3 class="font-bold mb-2">โลโก้ (หัวใบประกาศ)</h3>
            <div class="bg-[#f7f1f3] rounded-xl p-4 mb-3 flex items-center justify-center min-h-[160px]">
              <img id="cert-logo-preview" src="${escapeHtml(logo.url)}" alt="Logo preview"
                style="max-height:120px;max-width:100%;object-fit:contain"
                onerror="this.onerror=null;this.src='/uploads/cert/logo.png'">
            </div>
            <p class="text-xs text-on-surface-variant mb-2">ไฟล์: <code>${escapeHtml(logo.filename || 'logo.png')}</code></p>
            <input type="file" id="cert-logo-file" accept="image/png,image/jpeg,image/webp,image/gif" class="block w-full text-sm mb-2">
            <button type="button" class="pts-btn pts-btn-primary" id="cert-logo-upload">อัปโหลดโลโก้</button>
            <p id="cert-logo-msg" class="text-xs mt-2 text-on-surface-variant"></p>
          </div>
          <div class="rounded-2xl border border-[var(--pts-border,rgba(151,66,88,.14))] p-4">
            <h3 class="font-bold mb-2">สแตมป์ (ท้ายใบประกาศ)</h3>
            <div class="bg-[#f7f1f3] rounded-xl p-4 mb-3 flex items-center justify-center min-h-[160px]">
              <img id="cert-stamp-preview" src="${escapeHtml(stamp.url)}" alt="Stamp preview"
                style="max-height:120px;max-width:100%;object-fit:contain"
                onerror="this.onerror=null;this.src='/uploads/cert/stamp.png'">
            </div>
            <p class="text-xs text-on-surface-variant mb-2">ไฟล์: <code>${escapeHtml(stamp.filename || 'stamp.png')}</code></p>
            <input type="file" id="cert-stamp-file" accept="image/png,image/jpeg,image/webp,image/gif" class="block w-full text-sm mb-2">
            <button type="button" class="pts-btn pts-btn-primary" id="cert-stamp-upload">อัปโหลดสแตมป์</button>
            <p id="cert-stamp-msg" class="text-xs mt-2 text-on-surface-variant"></p>
          </div>
        </div>
      </div>
    </div>`;

  const uploadSlot = async (slot, fileInputId, msgId, previewId) => {
    const input = document.getElementById(fileInputId);
    const msg = document.getElementById(msgId);
    const file = input?.files?.[0];
    if (!file) {
      if (msg) msg.textContent = 'กรุณาเลือกไฟล์ก่อน';
      return;
    }
    if (msg) msg.textContent = 'กำลังอัปโหลด...';
    try {
      const fd = new FormData();
      fd.append('slot', slot);
      fd.append('image', file);
      const res = await fetch(`/api/admin/cert-assets/upload?slot=${encodeURIComponent(slot)}`, {
        method: 'POST',
        credentials: 'include',
        body: fd
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || json.success === false) throw new Error(json.message || 'อัปโหลดไม่สำเร็จ');
      const preview = document.getElementById(previewId);
      if (preview && json.url) preview.src = json.url;
      if (msg) msg.textContent = 'อัปโหลดแล้ว ✓ — เปิดหน้า Certificates เพื่อดูผล';
    } catch (e) {
      if (msg) msg.textContent = e.message || 'อัปโหลดไม่สำเร็จ';
    }
  };

  document.getElementById('cert-logo-upload')?.addEventListener('click', () => {
    uploadSlot('logo', 'cert-logo-file', 'cert-logo-msg', 'cert-logo-preview');
  });
  document.getElementById('cert-stamp-upload')?.addEventListener('click', () => {
    uploadSlot('stamp', 'cert-stamp-file', 'cert-stamp-msg', 'cert-stamp-preview');
  });
}

            <input id="cp-note" class="mt-1 w-full border rounded-xl px-3 py-2" placeholder="เช่น โปรโมชันเดือน ส.ค.">

      <div class="space-y-3">

                           data-name="${escapeHtml(u.username || '')}"
                           data-search="${escapeHtml(String(u.username || '').toLowerCase() + ' ' + String(u.email || '').toLowerCase())}"

    ruleEl.onchange = syncRule;
    syncRule();

      const price = opt ? Number(opt.getAttribute('data-price') || 0) : 0;

      if (!courseEl.value) { hintEl.textContent = ''; return; }
      if (!Number.isFinite(disc) || disc < 0) {
        hintEl.textContent = 'ราคาคอร์ส ฿' + price.toLocaleString('th-TH') + ' — ส่วนลดต้องอยู่ระหว่าง 0 ถึงราคาคอร์ส';

        hintEl.textContent = 'ส่วนลดเกินราคาคอร์ส (฿' + price.toLocaleString('th-TH') + ') — บันทึกไม่ได้';
        return;
      }
      const left = Math.max(0, price - disc);
      hintEl.textContent = left === 0
        ? 'หลังลดเหลือ 0 บาท (เรียนฟรีด้วยคูปอง)'
        : 'หลังลดเหลือ ฿' + left.toLocaleString('th-TH');
    };
    courseEl.onchange = updateHint;
    discountEl.oninput = updateHint;

    document.getElementById('cp-create').onclick = async () => {
      const msg = document.getElementById('cp-msg');
      msg.textContent = '';
      const usage_rule = ruleEl.value;
      const maxRaw = document.getElementById('cp-max').value;
      const body = {
        course_id: parseInt(courseEl.value, 10),
        code: document.getElementById('cp-code').value.trim(),
        discount_amount: Number(discountEl.value),
        usage_rule,
        max_uses: usage_rule === 'once' ? 1 : (maxRaw === '' ? null : parseInt(maxRaw, 10)),
        expires_at: document.getElementById('cp-exp').value || '',
        note: document.getElementById('cp-note').value.trim()
      };
      try {
        await api('/api/admin/coupons', { method: 'POST', body: JSON.stringify(body) });
        msg.textContent = 'สร้างคูปองแล้ว';
        msg.className = 'pts-msg is-ok mb-1';
        const fresh = await api('/api/admin/coupons');
        coupons = Array.isArray(fresh.data) ? fresh.data.slice() : [];
        paint();
      } catch (e) {
        msg.textContent = e.message || 'สร้างไม่สำเร็จ';
        msg.className = 'pts-msg is-err mb-1';
      }
    };

    document.querySelectorAll('.cp-toggle').forEach((btn) => {
      btn.onclick = async () => {
        try {
          await api('/api/admin/coupons/' + btn.dataset.id, {
            method: 'PATCH',
            body: JSON.stringify({ flag_use: Number(btn.dataset.flag) })
          });
          const fresh = await api('/api/admin/coupons');
          coupons = Array.isArray(fresh.data) ? fresh.data.slice() : [];
          paint();
        } catch (e) {
          alert(e.message || 'อัปเดตไม่สำเร็จ');
        }
      };
    });

    const recipientsMap = Object.create(null);

    const getRecipientsBox = (couponId) => panel.querySelector('.cp-recipients[data-id="' + couponId + '"]');
    const getDropzone = (couponId) => panel.querySelector('.cp-dropzone[data-id="' + couponId + '"]');
    const getPool = (couponId) => panel.querySelector('.cp-user-pool[data-id="' + couponId + '"]');

    const syncRecipientUi = (couponId) => {
      const map = recipientsMap[couponId] || (recipientsMap[couponId] = new Map());
      const box = getRecipientsBox(couponId);
      const zone = getDropzone(couponId);
      const countEl = panel.querySelector('.cp-selected-count[data-id="' + couponId + '"]');
      const pool = getPool(couponId);
      if (!box) return;

      box.innerHTML = '';
      map.forEach((item) => {
        const chip = document.createElement('div');
        chip.className = 'cp-chip';
        chip.dataset.userId = String(item.userId);
        chip.innerHTML =
          '<span class="cp-chip__meta">' +
            '<span class="cp-chip__name">' + escapeHtml(item.name || '—') + '</span>' +
            '<span class="cp-chip__email">' + escapeHtml(item.email || '') + '</span>' +
          '</span>' +
          '<button type="button" class="cp-chip__rm" aria-label="ลบ" title="ลบออก">×</button>';
        chip.querySelector('.cp-chip__rm').onclick = () => {
          map.delete(item.userId);
          syncRecipientUi(couponId);
        };
        box.appendChild(chip);
      });

      if (zone) zone.classList.toggle('has-items', map.size > 0);
      if (countEl) countEl.textContent = map.size + ' คน';
      if (pool) {
        pool.querySelectorAll('.cp-pool-chip').forEach((chip) => {
          const uid = parseInt(chip.dataset.userId, 10);
          chip.classList.toggle('is-picked', map.has(uid));
        });
      }
    };

    const addRecipient = (couponId, userId, email, name) => {
      const uid = parseInt(userId, 10);
      if (!uid) return;
      const map = recipientsMap[couponId] || (recipientsMap[couponId] = new Map());
      if (map.has(uid)) return;
      map.set(uid, {
        userId: uid,
        email: String(email || '').trim(),
        name: String(name || '').trim()
      });
      syncRecipientUi(couponId);
    };

    panel.querySelectorAll('.cp-pool-chip').forEach((chip) => {
      chip.addEventListener('dragstart', (e) => {
        if (chip.classList.contains('is-picked')) {
          e.preventDefault();
          return;
        }
        const payload = JSON.stringify({
          couponId: chip.dataset.coupon,
          userId: chip.dataset.userId,
          email: chip.dataset.email,
          name: chip.dataset.name
        });
        e.dataTransfer.setData('application/x-pts-coupon-user', payload);
        e.dataTransfer.setData('text/plain', payload);
        e.dataTransfer.effectAllowed = 'copy';
        chip.classList.add('cp-chip--ghost');
      });
      chip.addEventListener('dragend', () => chip.classList.remove('cp-chip--ghost'));
      chip.addEventListener('dblclick', () => {
        addRecipient(chip.dataset.coupon, chip.dataset.userId, chip.dataset.email, chip.dataset.name);
      });
    });

    panel.querySelectorAll('.cp-dropzone').forEach((zone) => {
      const couponId = zone.dataset.id;
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        zone.classList.add('is-over');
      });
      zone.addEventListener('dragleave', () => zone.classList.remove('is-over'));
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('is-over');
        let raw = e.dataTransfer.getData('application/x-pts-coupon-user') || e.dataTransfer.getData('text/plain');
        try {
          const data = JSON.parse(raw || '{}');
          if (String(data.couponId) !== String(couponId) && data.couponId != null) {
            // allow drop across same page coupons with same user list
          }
          addRecipient(couponId, data.userId, data.email, data.name);
        } catch (_) { /* ignore bad payload */ }
      });
    });

    panel.querySelectorAll('.cp-user-filter').forEach((inp) => {
      inp.oninput = () => {
        const id = inp.dataset.id;
        const q = String(inp.value || '').trim().toLowerCase();
        const pool = getPool(id);
        if (!pool) return;
        pool.querySelectorAll('.cp-pool-chip').forEach((chip) => {
          const hay = chip.getAttribute('data-search') || '';
          chip.style.display = !q || hay.includes(q) ? '' : 'none';
        });
      };
    });

    panel.querySelectorAll('.cp-add-visible').forEach((btn) => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        const pool = getPool(id);
        if (!pool) return;
        pool.querySelectorAll('.cp-pool-chip').forEach((chip) => {
          if (chip.style.display === 'none' || chip.classList.contains('is-picked')) return;
          addRecipient(id, chip.dataset.userId, chip.dataset.email, chip.dataset.name);
        });
      };
    });

    panel.querySelectorAll('.cp-clear-users').forEach((btn) => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        recipientsMap[id] = new Map();
        syncRecipientUi(id);
      };
    });

    document.querySelectorAll('.cp-send').forEach((btn) => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const emailInp = panel.querySelector('.cp-email[data-id="' + id + '"]');
        const msgEl = panel.querySelector('.cp-send-msg[data-id="' + id + '"]');
        const map = recipientsMap[id] || new Map();
        const user_ids = Array.from(map.keys());
        const email = emailInp ? emailInp.value.trim() : '';
        if (!user_ids.length && !email) {
          if (msgEl) msgEl.textContent = 'กรุณาลากผู้ใช้มาช่องผู้รับ หรือใส่อีเมลเพิ่ม';
          return;
        }
        btn.disabled = true;
        if (msgEl) msgEl.textContent = 'กำลังส่งให้ ' + user_ids.length + ' คน' + (email ? ' + อีเมลเพิ่ม' : '') + '...';
        try {
          const res = await api('/api/admin/coupons/' + id + '/send-email', {
            method: 'POST',
            body: JSON.stringify({ user_ids, email })
          });
          if (msgEl) msgEl.textContent = res.message || 'ส่งแล้ว';
        } catch (e) {
          if (msgEl) msgEl.textContent = e.message || 'ส่งไม่สำเร็จ';
        } finally {
          btn.disabled = false;
        }
      };
    });
  };

  paint();
}

const tabs = {
  courses: renderCourses,
  lessons: renderLessons,
  schedules: renderSchedules,
  forms: renderForms,
  banners: renderBanners,
  cert: renderCertAssets,
  users: renderUsers,
  posts: renderPosts,
  payments: renderPayments,
  coupons: renderCoupons,
  mail: renderMail
};

function showAdminError(err) {
  const panel = document.getElementById('panel');
  if (!panel) return;
  const msg = (err && err.message) ? err.message : String(err || 'ไม่ทราบสาเหตุ');
  panel.innerHTML = `<div class="p-4 rounded-xl border border-red-200 bg-red-50 text-red-800 text-sm">
    <p class="font-bold mb-1">โหลดแผงแอดมินไม่สำเร็จ</p>
    <p>${escapeHtml(msg)}</p>
  </div>`;
}

async function activateTab(name) {
  const key = tabs[name] ? name : 'courses';
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === key);
  });
  const panel = document.getElementById('panel');
  if (panel) panel.innerHTML = '<p class="text-sm text-on-surface-variant">กำลังโหลด...</p>';
  try {
    await tabs[key]();
  } catch (err) {
    console.error(err);
    showAdminError(err);
  }
  if (location.hash !== '#' + key) {
    history.replaceState(null, '', '#' + key);
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => activateTab(btn.dataset.tab);
});

window.addEventListener('hashchange', () => {
  activateTab((location.hash || '').replace(/^#/, ''));
});

(async () => {
  const me = await fetch('/api/users/me', { credentials: 'include' }).then(r => r.json());
  if (!me.loggedIn) return location.href = 'Login.html';
  if ((me.user.role || '').toLowerCase() !== 'admin') {
    return location.href = 'Home.html';
  }
  await activateTab((location.hash || '').replace(/^#/, '') || 'courses');
})().catch(err => {
  console.error(err);
  showAdminError(err);
});
</script>
<script>
/* If the main admin script failed to parse, surface a visible error instead of a blank panel. */
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    if (typeof activateTab === 'function') return;
    const panel = document.getElementById('panel');
    if (panel && !panel.innerHTML.trim()) {
      panel.innerHTML = '<div class="p-4 rounded-xl border border-red-200 bg-red-50 text-red-800 text-sm"><p class="font-bold">แผงแอดมินโหลดไม่สำเร็จ</p><p>สคริปต์หน้านี้พัง — รีเฟรชแรง (Ctrl+F5) หรือแจ้งผู้ดูแล</p></div>';
    }
  }, 50);
});
</script>
