<style>
  input[type="password"]::-ms-reveal,
  input[type="password"]::-ms-clear { display: none !important; width: 0 !important; height: 0 !important; }
  body{font-family:'IBM Plex Sans Thai',sans-serif}
  .admin-main { padding-top: 20px !important; }
  @media (min-width: 768px) {
    .admin-main { padding-top: 24px !important; }
  }
  .admin-side { padding-top: 20px; }
  @media (min-width: 900px) {
    .admin-side { padding-top: 24px; }
  }
  .admin-side__label {
    margin: 0 10px 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--pts-primary, #974258);
  }
  .admin-side__nav {
    display: flex;
    flex-direction: column;
    flex-wrap: nowrap;
    gap: 6px;
  }
  .tab-btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--pts-border, rgba(151,66,88,.18));
    background: var(--pts-surface, #fff);
    color: var(--pts-text, #1c1520);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
  }
  .tab-btn.active { background: #974258; color: #fff; border-color: #974258; }
  html[data-theme="dark"] .tab-btn.active { background: #b85a70; border-color: #b85a70; }

  /* —— Banner admin (easy add + color picker) —— */
  .ban-wrap { display:grid; gap:18px; }
  .ban-card {
    background: var(--pts-surface, #fff);
    border: 1px solid var(--pts-border, rgba(151,66,88,.14));
    border-radius: 20px;
    padding: 18px 16px;
    box-shadow: var(--pts-shadow-sm, 0 8px 24px rgba(28,21,32,.05));
  }
  .ban-steps {
    display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px;
    font-size:12px; font-weight:700; color:var(--pts-muted,#5c4f55);
  }
  .ban-steps span {
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 10px; border-radius:999px;
    background:var(--pts-primary-soft,#f6e6ea); color:var(--pts-primary,#974258);
  }
  .ban-theme-grid {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:10px;
  }
  .ban-theme {
    appearance:none; border:2px solid transparent; border-radius:14px;
    padding:0; cursor:pointer; overflow:hidden; text-align:left;
    background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.08);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .ban-theme:hover { transform:translateY(-2px); }
  .ban-theme.is-active {
    border-color:#974258;
    box-shadow:0 0 0 3px rgba(151,66,88,.2), 0 8px 20px rgba(0,0,0,.12);
  }
  .ban-theme__swatch { display:block; height:44px; width:100%; }
  .ban-theme__label {
    display:block; padding:7px 8px 8px; font-size:11px; font-weight:700;
    color:var(--pts-text,#1c1520); line-height:1.2;
  }
  .ban-theme[data-theme="rose"] .ban-theme__swatch {
    background: linear-gradient(135deg,#5c2436,#8a3550 45%,#ffb1c1);
  }
  .ban-theme[data-theme="sage"] .ban-theme__swatch {
    background: linear-gradient(135deg,#1f3d2e,#3d5a4c 45%,#85be96);
  }
  .ban-theme[data-theme="gold"] .ban-theme__swatch {
    background: linear-gradient(135deg,#5c3a18,#a67b32 45%,#e8c478);
  }
  .ban-theme[data-theme="ink"] .ban-theme__swatch {
    background: linear-gradient(135deg,#0c1016,#2c3a48 45%,#8c9cb4);
  }
  .ban-theme[data-theme="ocean"] .ban-theme__swatch {
    background: linear-gradient(135deg,#0e1e24,#2a6a72 45%,#64bec8);
  }
  .ban-theme[data-theme="sunset"] .ban-theme__swatch {
    background: linear-gradient(135deg,#6e2e28,#c45a3a 45%,#ffc08c);
  }
  .ban-theme[data-theme="custom"] .ban-theme__swatch {
    background:
      conic-gradient(from 90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #1dd1a1, #ff6b6b);
  }
  .ban-preview[data-theme="custom"] {
    background: linear-gradient(135deg, #1a1216, var(--ban-c, #974258) 48%, #2a1a22);
  }
  .ban-rgb {
    display:grid; gap:12px; margin-top:12px; padding:14px;
    border:1px solid var(--pts-border,rgba(151,66,88,.16));
    border-radius:14px; background:rgba(151,66,88,.04);
  }
  .ban-rgb.is-hidden { display:none; }
  .ban-rgb__row { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
  .ban-rgb__row .ban-field { flex:1 1 72px; min-width:72px; }
  .ban-rgb__picker {
    width:52px; height:40px; padding:0; border:0; border-radius:10px;
    background:transparent; cursor:pointer;
  }
  .ban-wheel-layout {
    display:grid; gap:14px; align-items:center;
  }
  @media (min-width:640px) {
    .ban-wheel-layout { grid-template-columns: auto minmax(0,1fr); }
  }
  .ban-wheel-stage {
    position:relative; width:220px; height:220px; margin:0 auto;
    touch-action:none; user-select:none;
  }
  .ban-wheel-stage canvas {
    display:block; width:220px; height:220px; border-radius:50%;
    box-shadow:0 10px 28px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.35);
    cursor:crosshair;
  }
  .ban-wheel-marker {
    position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px;
    border:2px solid #fff; border-radius:999px;
    box-shadow:0 0 0 1px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.25);
    pointer-events:none; left:50%; top:50%;
  }
  .ban-wheel-side { display:grid; gap:10px; }
  .ban-wheel-swatch {
    width:100%; height:48px; border-radius:12px;
    border:1px solid rgba(0,0,0,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  }
  .ban-wheel-side label { font-size:12px; font-weight:700; color:var(--pts-muted,#5c4f55); }
  .ban-wheel-side input[type="range"] { width:100%; accent-color:#974258; }
  .ban-mini-themes button[data-theme="custom"] {
    background: conic-gradient(from 90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #1dd1a1, #ff6b6b);
  }
  .ban-drop {
    border:2px dashed rgba(151,66,88,.35);
    border-radius:16px; padding:18px; text-align:center;
    background:rgba(151,66,88,.04); cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .ban-drop.is-drag { border-color:#974258; background:rgba(151,66,88,.1); }
  .ban-drop__hint { margin:0; font-size:13px; color:var(--pts-muted,#5c4f55); }
  .ban-drop__hint strong { color:var(--pts-primary,#974258); }
  .ban-preview {
    border-radius:18px; padding:18px; min-height:160px; color:#fff;
    display:grid; gap:14px; align-items:center;
    background: linear-gradient(135deg,#5c2436,#8a3550 45%,#3d5a4c);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 16px 36px rgba(0,0,0,.18);
  }
  @media (min-width:720px) {
    .ban-preview { grid-template-columns: 1.2fr .8fr; }
  }
  .ban-preview[data-theme="rose"] { background: linear-gradient(135deg,#5c2436,#8a3550 45%,#ffb1c1); }
  .ban-preview[data-theme="sage"] { background: linear-gradient(135deg,#1f3d2e,#3d5a4c 50%,#85be96); }
  .ban-preview[data-theme="gold"] { background: linear-gradient(135deg,#5c3a18,#a67b32 50%,#e8c478); }
  .ban-preview[data-theme="ink"] { background: linear-gradient(135deg,#0c1016,#2c3a48 50%,#8c9cb4); }
  .ban-preview[data-theme="ocean"] { background: linear-gradient(135deg,#0e1e24,#2a6a72 50%,#64bec8); }
  .ban-preview[data-theme="sunset"] { background: linear-gradient(135deg,#6e2e28,#c45a3a 50%,#ffc08c); }
  .ban-preview__eyebrow {
    display:inline-flex; padding:4px 10px; border-radius:999px; margin:0 0 8px;
    background:rgba(255,255,255,.18); font-size:11px; font-weight:700;
  }
  .ban-preview__title { margin:0 0 6px; font-size:1.25rem; font-weight:800; line-height:1.25; }
  .ban-preview__title em { font-style:normal; color:#ffd0da; }
  .ban-preview__lead { margin:0; font-size:13px; opacity:.88; line-height:1.45; }
  .ban-preview__img {
    width:100%; aspect-ratio:4/5; max-height:180px; object-fit:cover; object-position:center 14%;
    border-radius:14px; background:rgba(255,255,255,.15); display:block;
  }
  .ban-field { display:grid; gap:6px; }
  .ban-field label { font-size:12px; font-weight:700; color:var(--pts-muted,#5c4f55); }
  .ban-field input, .ban-field textarea, .ban-field select {
    width:100%; border:1px solid var(--pts-border,rgba(151,66,88,.18));
    border-radius:12px; padding:10px 12px; font:inherit; background:var(--pts-surface,#fff);
    color:var(--pts-text,#1c1520);
  }
  .ban-grid { display:grid; gap:12px; }
  @media (min-width:720px) {
    .ban-grid-2 { grid-template-columns:1fr 1fr; }
  }
  .ban-adv {
    border:1px solid var(--pts-border,rgba(151,66,88,.14));
    border-radius:14px; padding:10px 12px; background:rgba(151,66,88,.03);
  }
  .ban-adv summary {
    cursor:pointer; font-weight:700; font-size:14px; color:var(--pts-primary,#974258);
    list-style:none;
  }
  .ban-adv summary::-webkit-details-marker { display:none; }
  .ban-adv[open] summary { margin-bottom:12px; }
  .ban-list-item {
    display:grid; gap:12px; align-items:center;
    grid-template-columns: 1fr;
    border:1px solid var(--pts-border,rgba(151,66,88,.14));
    border-radius:16px; padding:12px; background:var(--pts-surface,#fff);
    cursor:grab;
  }
  .ban-list-item.is-dragging { opacity:.55; cursor:grabbing; }
  .ban-list-item.is-drag-over {
    border-color:#974258;
    box-shadow: inset 0 0 0 2px rgba(151,66,88,.25);
  }
  @media (min-width:800px) {
    .ban-list-item { grid-template-columns: 28px 140px minmax(0,1fr) auto; }
  }
  .ban-list-handle {
    display:none; align-items:center; justify-content:center;
    color:#974258; font-size:18px; user-select:none;
  }
  @media (min-width:800px) {
    .ban-list-handle { display:flex; }
  }
  .ban-list-item.is-hidden { opacity:.55; }
  .ban-order-msg { font-size:12px; color:#5c4f55; margin:8px 0 0; min-height:1.2em; }
  .ban-mini-themes { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .ban-mini-themes button {
    width:22px; height:22px; border-radius:999px; border:2px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.15); cursor:pointer; padding:0;
  }
  .ban-mini-themes button.is-active { box-shadow:0 0 0 2px #974258; transform:scale(1.12); }
  .ban-mini-themes button[data-theme="rose"] { background:linear-gradient(135deg,#8a3550,#ffb1c1); }
  .ban-mini-themes button[data-theme="sage"] { background:linear-gradient(135deg,#3d5a4c,#85be96); }
  .ban-mini-themes button[data-theme="gold"] { background:linear-gradient(135deg,#a67b32,#e8c478); }
  .ban-mini-themes button[data-theme="ink"] { background:linear-gradient(135deg,#2c3a48,#8c9cb4); }
  .ban-mini-themes button[data-theme="ocean"] { background:linear-gradient(135deg,#2a6a72,#64bec8); }
  .ban-mini-themes button[data-theme="sunset"] { background:linear-gradient(135deg,#c45a3a,#ffc08c); }

  /* —— Admin courses: table (desktop) / compact cards (mobile) —— */
  .adm-c-head {
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:10px; margin: 8px 0 12px;
  }
  .adm-c-head h3 { margin:0; font-size:1.05rem; font-weight:700; }
  .adm-c-head p { margin:4px 0 0; font-size:13px; color:var(--pts-muted,#5c4f55); }
  .adm-c-tools {
    display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 12px;
  }
  .adm-c-search {
    flex:1 1 220px; min-width:180px; max-width:420px;
    border:1px solid rgba(151,66,88,.18); border-radius:12px;
    padding:10px 12px; font:inherit; background:#fff; color:#1c1520;
  }
  .adm-c-search:focus {
    outline:none; border-color:rgba(151,66,88,.45); box-shadow:0 0 0 3px rgba(151,66,88,.12);
  }
  .adm-c-count {
    font-size:12px; font-weight:700; color:#974258;
    background:rgba(151,66,88,.1); padding:6px 10px; border-radius:999px;
    white-space:nowrap;
  }
  .adm-c-table-wrap {
    display:none; overflow:auto; border:1px solid rgba(151,66,88,.14);
    border-radius:16px; background:#fff;
    max-height: calc(44px + (10 * 58px));
  }
  .adm-c-table { width:100%; border-collapse:collapse; min-width:780px; font-size:13px; }
  .adm-c-table th {
    text-align:left; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:#5c4f55; padding:12px 14px; background:#f7f2f5; border-bottom:1px solid rgba(151,66,88,.12);
    white-space:nowrap; position:sticky; top:0; z-index:2;
  }
  .adm-c-table td {
    padding:12px 14px; border-bottom:1px solid rgba(151,66,88,.08);
    vertical-align:middle; color:#1c1520;
  }
  .adm-c-table tr:last-child td { border-bottom:0; }
  .adm-c-table tr:hover td { background:rgba(151,66,88,.03); }
  .adm-c-table tr.is-editing td {
    background: #f3d9e1;
  }
  .adm-c-table tr.is-editing td:first-child {
    border-left: 4px solid #974258;
    padding-left: 10px;
  }
  .adm-c-name { font-weight:700; line-height:1.35; }
  .adm-c-course {
    display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-width:0;
  }
  .adm-c-id {
    display:inline-flex; align-items:center;
    font-size:11px; font-weight:700; letter-spacing:.04em;
    color:#974258; background:rgba(151,66,88,.1);
    border:1px solid rgba(151,66,88,.18);
    padding:2px 8px; border-radius:999px; line-height:1.3;
    font-variant-numeric: tabular-nums;
  }
  .adm-c-mode {
    display:inline-flex; align-items:center; padding:3px 8px; border-radius:999px;
    font-size:11px; font-weight:700; background:rgba(151,66,88,.1); color:#974258; text-transform:capitalize;
  }
  .adm-c-mode--onsite { background:#eef5ea; color:#4c6548; }
  .adm-c-mode--hybrid { background:#e8f6ec; color:#166c39; }
  .adm-c-badge {
    display:inline-flex; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:700;
    background:#eee; color:#666;
  }
  .adm-c-badge.is-on { background:rgba(151,66,88,.12); color:#974258; }
  .adm-c-actions { display:flex; flex-wrap:wrap; gap:6px; }
  .adm-c-actions .pts-btn { padding:6px 10px; font-size:12px; height:auto; min-height:0; }
  .adm-c-cards {
    display:grid; gap:10px;
    max-height: calc(10 * 108px);
    overflow:auto;
    padding-right:2px;
  }
  .adm-c-card {
    border:1px solid rgba(151,66,88,.14); border-radius:14px; background:#fff;
    padding:12px 14px; display:grid; gap:8px;
    transition: border-color .15s ease, background .15s ease;
  }
  .adm-c-card.is-editing {
    border-color: transparent;
    background: #f3d9e1;
    border-left: 4px solid #974258;
  }
  .adm-c-card__top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .adm-c-card__meta {
    display:flex; flex-wrap:wrap; gap:6px 10px; font-size:12px; color:#5c4f55;
  }
  .adm-c-card__meta span { display:inline-flex; align-items:center; gap:4px; }
  .adm-c-empty {
    border:1px dashed rgba(151,66,88,.25); border-radius:14px; padding:28px 16px;
    text-align:center; color:#5c4f55; font-size:14px;
  }
  .adm-c-edit[hidden] { display:none !important; }
  .adm-c-edit {
    margin-top:14px; padding:14px; border-radius:16px;
    border:1px solid rgba(151,66,88,.2); background:#faf6f8;
  }
  @media (min-width: 900px) {
    .adm-c-table-wrap { display:block; }
    .adm-c-cards { display:none; }
  }
</style>

<script>
const escapeHtml = (t) => String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let coursesCache = [];
const pad2 = (n) => String(n).padStart(2, '0');
function toDateKey(value) {
  if (value == null) return '';
  if (typeof value === 'string') {
    const m = value.trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  }
  const d = value instanceof Date ? value : new Date(value);
  if (Number.isNaN(d.getTime())) return '';

    if (m) {
      return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(m[4]), Number(m[5]), Number(m[6] || 0));

async function api(url, options = {}) {
  const res = await fetch(url, { credentials: 'include', headers: { 'Content-Type': 'application/json' }, ...options });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { location.href = 'Login.html'; throw new Error('unauthorized'); }
  if (res.status === 403) { console.error(data.message || 'ไม่มีสิทธิ์แอดมิน'); location.href = 'Home.html'; throw new Error('forbidden'); }
  if (!res.ok || data.success === false) throw new Error(data.message || 'คำขอล้มเหลว');
  return data;
}

    renderList(searchInput.value);
  };

  cancelBtn.onclick = () => setEditMode(null);
  courseSelect.onchange = () => loadLessons();
  searchInput.addEventListener('input', () => renderList(searchInput.value));

  saveBtn.onclick = async () => {
    const courseId = courseSelect.value;
    const payload = {
      title: document.getElementById('l-title').value,
      content_html: document.getElementById('l-content').value,
      video_url: document.getElementById('l-video').value,
      sort_order: Number(document.getElementById('l-sort').value || 1),
      duration_minutes: Number(document.getElementById('l-duration').value || 15)
    };
    saveBtn.disabled = true;
    try {
      if (editingLessonId) {
        await api(`/api/admin/lessons/${editingLessonId}`, {
          method: 'PUT',
          body: JSON.stringify(payload)
        });
      } else {
        await api(`/api/admin/courses/${courseId}/lessons`, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
      }
      await loadLessons();
    } catch (e) {
      formMsg.textContent = e.message || 'บันทึกไม่สำเร็จ';
      formMsg.className = 'pts-msg pts-msg--err mb-4';
    } finally {
      saveBtn.disabled = false;
    }
  };

  if (coursesCache.length) loadLessons();
  else listArea.innerHTML = '<div class="adm-c-empty">ยังไม่มีหลักสูตร ให้สร้างหลักสูตรก่อน</div>';
}

async function renderSchedules() {
  if (!coursesCache.length) {
    const { data } = await api('/api/admin/courses');
    coursesCache = data;
  }
  const { data } = await api('/api/admin/schedules');
  adminSchedulesCache = Array.isArray(data) ? data.slice() : [];

  if (adminSchedulesCache.length) {
    const now = new Date();
    const hasThisMonth = adminSchedulesCache.some((s) => {
      const d = parseScheduleDate(s.start_at);
      return !Number.isNaN(d.getTime()) && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
    if (!hasThisMonth && adminCalSelectedDay == null) {
      const first = parseScheduleDate(adminSchedulesCache[0].start_at);
      if (!Number.isNaN(first.getTime())) {
        adminCalViewYear = first.getFullYear();
        adminCalViewMonth = first.getMonth();
      }
    }
  }

  const now = new Date();
  const start = new Date(now.getTime() + 86400000); start.setMinutes(0, 0, 0);
  const end = new Date(start.getTime() + 2 * 3600000);
  const toLocalInput = (d) =>
    `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

  const groupByDay = (schedules) => {
    const map = new Map();
    for (const s of schedules) {
      const key = toDateKey(s.start_at);
      if (!key) continue;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(s);
    }
    return map;
  };

  const paintCalendar = () => {
    const grid = document.getElementById('admin-cal-grid');
    const label = document.getElementById('admin-cal-month-label');
    if (!grid || !label) return;
    const byDay = groupByDay(adminSchedulesCache);
    const monthDate = new Date(adminCalViewYear, adminCalViewMonth, 1);
    label.textContent = monthDate.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
    const firstDow = (monthDate.getDay() + 6) % 7;
    const daysInMonth = new Date(adminCalViewYear, adminCalViewMonth + 1, 0).getDate();
    const prevDays = new Date(adminCalViewYear, adminCalViewMonth, 0).getDate();
    const todayKey = toDateKey(new Date());
    const cells = [];
    for (let i = 0; i < 42; i += 1) {
      let y = adminCalViewYear;
      let m = adminCalViewMonth;
      let day;
      let muted = false;
      if (i < firstDow) {
        day = prevDays - firstDow + i + 1;
        m -= 1;
        if (m < 0) { m = 11; y -= 1; }
        muted = true;
      } else if (i >= firstDow + daysInMonth) {
        day = i - firstDow - daysInMonth + 1;
        m += 1;
        if (m > 11) { m = 0; y += 1; }
        muted = true;
      } else {
        day = i - firstDow + 1;
      }
      const key = `${y}-${pad2(m + 1)}-${pad2(day)}`;
      const events = byDay.get(key) || [];
      const classes = ['pts-cal__day'];
      if (muted) classes.push('pts-cal__day--muted');
      if (key === todayKey) classes.push('pts-cal__day--today');
      if (events.length) classes.push('pts-cal__day--has');
      if (adminCalSelectedDay === key) classes.push('pts-cal__day--selected');
      const dots = events.slice(0, 3).map(() => '<span class="pts-cal__dot"></span>').join('');
      const count = events.length > 1 ? `<span class="pts-cal__day-count">${events.length}</span>` : '';
      cells.push(`<button type="button" class="${classes.join(' ')}" data-day="${key}" ${events.length ? '' : 'disabled'}>
        <span class="pts-cal__day-num">${day}</span>
        <span class="pts-cal__dots">${dots}</span>
        ${count}
      </button>`);
    }
    grid.innerHTML = cells.join('');
    grid.querySelectorAll('.pts-cal__day--has').forEach((btn) => {
      btn.addEventListener('click', () => {
        adminCalSelectedDay = btn.getAttribute('data-day');
        paintCalendar();
        paintList();
      });
    });
  };

  const paintList = () => {
    const el = document.getElementById('admin-schedule-list');
    const title = document.getElementById('admin-schedule-list-title');
    const clearBtn = document.getElementById('admin-cal-clear-filter');
    if (!el || !title) return;
    let rows = adminSchedulesCache.slice();
    if (adminCalSelectedDay) {
      rows = rows.filter((s) => toDateKey(s.start_at) === adminCalSelectedDay);
      title.textContent = `รายการวันที่ ${adminCalSelectedDay.replace(/-/g, '/')}`;
      clearBtn?.classList.remove('hidden');
    } else {
      title.textContent = 'ตารางที่มีอยู่';
      clearBtn?.classList.add('hidden');
    }
    if (!adminSchedulesCache.length) {
      el.innerHTML = '<p class="text-sm text-on-surface-variant">ยังไม่มีตาราง</p>';
      return;
    }
    if (!rows.length) {
      el.innerHTML = '<p class="text-sm text-on-surface-variant">ไม่มีตารางในวันที่เลือก</p>';
      return;
    }
    el.innerHTML = rows.map((s) => {
      const d = parseScheduleDate(s.start_at);
      const end = parseScheduleDate(s.end_at);
      const range = Number.isNaN(d.getTime())
        ? '—'
        : `${d.toLocaleString('th-TH')} – ${end.toLocaleString('th-TH')}`;
      return `<div class="border rounded-xl p-3 flex justify-between gap-2">
        <div>
          <p class="font-bold">${escapeHtml(s.title)}</p>
          <p class="text-sm text-on-surface-variant">${escapeHtml(s.course_name || '-')} · ${escapeHtml(range)}</p>
          <p class="text-xs text-on-surface-variant mt-1">${escapeHtml(s.delivery_mode || 'online')}${s.location ? ` · ${escapeHtml(s.location)}` : ''}</p>
        </div>
        <button type="button" class="del-schedule text-red-600 font-bold" data-id="${s.schedule_id}">ลบ</button>
      </div>`;
    }).join('');
    el.querySelectorAll('.del-schedule').forEach((btn) => {
      btn.onclick = async () => {
        await api(`/api/admin/schedules/${btn.dataset.id}`, { method: 'DELETE' });
        renderSchedules();
      };
    });
  };

  document.getElementById('panel').innerHTML = `
    <div id="admin-schedule-calendar" class="pts-cal">
      <div class="pts-cal__head">
        <h2 class="pts-cal__title" id="admin-cal-month-label">—</h2>
        <div class="pts-cal__nav">
          <button type="button" class="pts-btn pts-btn-outline" id="admin-cal-prev" aria-label="เดือนก่อน">‹</button>
          <button type="button" class="pts-btn pts-btn-ghost" id="admin-cal-today">วันนี้</button>
          <button type="button" class="pts-btn pts-btn-outline" id="admin-cal-next" aria-label="เดือนถัดไป">›</button>
        </div>
      </div>
      <div class="pts-cal__weekdays" aria-hidden="true">
        <span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span><span>อา</span>
      </div>
      <div class="pts-cal__grid" id="admin-cal-grid"></div>
      <p class="pts-cal__legend">จุดสี = มีตารางเรียนวันนั้น — กดวันที่เพื่อกรองรายการด้านล่าง</p>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <h3 class="font-bold text-lg m-0" id="admin-schedule-list-title">ตารางที่มีอยู่</h3>
      <button type="button" class="pts-btn pts-btn-ghost hidden" id="admin-cal-clear-filter">แสดงทั้งหมด</button>
    </div>
    <div id="admin-schedule-list" class="space-y-2 mb-6"></div>

    <h2 class="font-bold text-lg mb-3">เพิ่มตารางเรียน</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
      <label class="text-sm font-semibold text-on-surface-variant">หัวข้อคลาส
        <input id="s-title" class="mt-1 w-full border rounded-xl px-3 py-2" placeholder="เช่น เรียนบทที่ 1">
      </label>
      <label class="text-sm font-semibold text-on-surface-variant">ผูกกับหลักสูตร (จำเป็น — ต้องเป็นหลักสูตรที่นักเรียนสมัครไว้)
        <select id="s-course" class="mt-1 w-full border rounded-xl px-3 py-2" required>
          <option value="">-- เลือกหลักสูตร --</option>
          ${coursesCache.map((c) => `<option value="${c.course_id}">${escapeHtml(c.course_name)}</option>`).join('')}
        </select>
      </label>
      <label class="text-sm font-semibold text-on-surface-variant">วันเวลาเริ่ม
        <input id="s-start" type="datetime-local" class="mt-1 w-full border rounded-xl px-3 py-2" value="${toLocalInput(start)}">
      </label>
      <label class="text-sm font-semibold text-on-surface-variant">วันเวลาจบ
        <input id="s-end" type="datetime-local" class="mt-1 w-full border rounded-xl px-3 py-2" value="${toLocalInput(end)}">
      </label>
      <label class="text-sm font-semibold text-on-surface-variant">สถานที่
        <input id="s-location" class="mt-1 w-full border rounded-xl px-3 py-2" placeholder="สถานที่ (onsite)">
      </label>
      <label class="text-sm font-semibold text-on-surface-variant">Meeting URL
        <input id="s-meeting" class="mt-1 w-full border rounded-xl px-3 py-2" placeholder="https://meet.google.com/...">
      </label>
      <label class="text-sm font-semibold text-on-surface-variant">รูปแบบ
        <select id="s-mode" class="mt-1 w-full border rounded-xl px-3 py-2"><option value="online">online</option><option value="onsite">onsite</option><option value="hybrid">hybrid</option></select>
      </label>
    </div>
    <button id="add-schedule" class="bg-primary text-white px-5 py-2 rounded-full font-bold mb-2">เพิ่มตาราง</button>
    <p id="schedule-form-msg" class="pts-msg mb-4"></p>`;

  paintCalendar();
  paintList();

  document.getElementById('admin-cal-prev').onclick = () => {
    adminCalViewMonth -= 1;
    if (adminCalViewMonth < 0) { adminCalViewMonth = 11; adminCalViewYear -= 1; }
    paintCalendar();
  };
  document.getElementById('admin-cal-next').onclick = () => {
    adminCalViewMonth += 1;
    if (adminCalViewMonth > 11) { adminCalViewMonth = 0; adminCalViewYear += 1; }
    paintCalendar();
  };
  document.getElementById('admin-cal-today').onclick = () => {
    const t = new Date();
    adminCalViewYear = t.getFullYear();
    adminCalViewMonth = t.getMonth();
    adminCalSelectedDay = toDateKey(t);
    paintCalendar();
    paintList();
  };
  document.getElementById('admin-cal-clear-filter').onclick = () => {
    adminCalSelectedDay = null;
    paintCalendar();
    paintList();
  };

  document.getElementById('add-schedule').onclick = async () => {
    const formMsg = document.getElementById('schedule-form-msg');
    const showErr = (t) => { formMsg.textContent = t; formMsg.className = 'pts-msg pts-msg--err mb-4'; };
    const title = document.getElementById('s-title').value.trim();
    const courseId = document.getElementById('s-course').value;
    if (!title) return showErr('กรุณาใส่หัวข้อคลาส');
    if (!courseId) return showErr('กรุณาเลือกหลักสูตรที่ผูกตาราง (จำเป็นสำหรับซิงค์ Google Calendar)');
    formMsg.textContent = 'กำลังบันทึก...';
    formMsg.className = 'pts-msg mb-4';
    try {
      await api('/api/admin/schedules', {
        method: 'POST',
        body: JSON.stringify({
          title,
          course_id: courseId,
          start_at: document.getElementById('s-start').value,
          end_at: document.getElementById('s-end').value,
          location: document.getElementById('s-location').value,
          meeting_url: document.getElementById('s-meeting').value,
          delivery_mode: document.getElementById('s-mode').value
        })
      });
      const startVal = document.getElementById('s-start').value;
      const dayKey = toDateKey(startVal);
      if (dayKey) {
        const [y, m] = dayKey.split('-').map(Number);
        adminCalViewYear = y;
        adminCalViewMonth = m - 1;
        adminCalSelectedDay = dayKey;
      }
      renderSchedules();
    } catch (e) {
      showErr(e.message || 'เพิ่มตารางไม่สำเร็จ');
    }
  };
}

async function renderBanners() {
  const { data } = await api('/api/admin/home-banners');
  let list = Array.isArray(data) ? data.slice() : [];

  document.getElementById('panel').innerHTML = `
    <div class="space-y-4">
      <div class="pts-card p-5">
        <h2 class="font-bold text-lg mb-1">เพิ่มแบนเนอร์หน้าแรก</h2>
        <p class="text-sm text-on-surface-variant mb-4">
          อัปโหลดรูปแล้วจะโชว์บนหน้าแรกทันที · แนะนำ <strong>1920 × 1000 px</strong>
          · ลากไฟล์มาวางด้านล่างได้เลย
        </p>
        <div class="ban-drop" id="banner-drop" tabindex="0" role="button" aria-label="ลากไฟล์รูปมาวางหรือคลิกเพื่อเลือกไฟล์">
          <p class="ban-drop__hint"><strong>ลากไฟล์รูปมาวางที่นี่</strong> หรือคลิกเพื่อเลือกไฟล์</p>
          <p class="ban-drop__hint" style="margin-top:6px;">รองรับ JPG / PNG / WEBP / GIF</p>
          <input type="file" id="banner-file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" multiple>
        </div>
        <p id="banner-msg" class="text-xs mt-2 text-on-surface-variant"></p>
      </div>

      <div class="pts-card p-5">
        <h3 class="font-bold mb-1">รายการแบนเนอร์ (<span id="banner-count">${list.length}</span>)</h3>
        <p class="text-sm text-on-surface-variant mb-3">ลากการ์ดขึ้น–ลงเพื่อเปลี่ยนลำดับสไลด์ · อันบนสุดขึ้นก่อน</p>
        <div id="banner-list" class="grid gap-3"></div>
        <p id="banner-order-msg" class="ban-order-msg"></p>
        <p class="text-xs text-on-surface-variant mt-3">
          <a class="text-primary font-bold" href="Home.html" target="_blank" rel="noopener">เปิดหน้าแรก</a> เพื่อดูสไลด์แบนเนอร์
        </p>
      </div>
    </div>`;

  const msg = document.getElementById('banner-msg');
  const orderMsg = document.getElementById('banner-order-msg');
  const listEl = document.getElementById('banner-list');
  const countEl = document.getElementById('banner-count');
  const drop = document.getElementById('banner-drop');
  const fileInput = document.getElementById('banner-file');
  let dragFrom = -1;

  const renderList = () => {
    countEl.textContent = String(list.length);
    if (!list.length) {
      listEl.innerHTML = '<div class="pts-empty">ยังไม่มีแบนเนอร์ — อัปโหลดรูปด้านบนได้เลย</div>';
      return;
    }
    listEl.innerHTML = list.map((b, i) => `
      <article class="ban-list-item" draggable="true" data-index="${i}" data-file="${escapeHtml(b.filename || b.id)}">
        <div class="ban-list-handle" title="ลากเพื่อเรียงลำดับ" aria-hidden="true">☰</div>
        <div class="rounded-xl overflow-hidden bg-[#0b1020]">
          <img src="${escapeHtml(b.url)}" alt="" class="w-full h-24 object-cover"
            onerror="this.onerror=null;this.src='/uploads/hero/home-banner.png'">
        </div>
        <div class="min-w-0">
          <p class="text-xs text-on-surface-variant">ลำดับสไลด์ ${i + 1}</p>
          <p class="text-sm font-bold truncate"><code>${escapeHtml(b.filename || b.id)}</code></p>
        </div>
        <button type="button" class="pts-btn pts-btn-outline text-red-600 banner-del" data-file="${escapeHtml(b.filename || b.id)}">ลบ</button>
      </article>
    `).join('');

    listEl.querySelectorAll('.banner-del').forEach((btn) => {
      btn.onclick = async (e) => {
        e.stopPropagation();
        const filename = btn.dataset.file;
        if (!filename) return;
        if (!confirm(`ลบแบนเนอร์ ${filename} ?`)) return;
        try {
          await api(`/api/admin/home-banners/${encodeURIComponent(filename)}`, { method: 'DELETE' });
          renderBanners();
        } catch (err) {
          alert(err.message || 'ลบไม่สำเร็จ');
        }
      };
    });

    listEl.querySelectorAll('.ban-list-item').forEach((item) => {
      item.addEventListener('dragstart', (e) => {
        dragFrom = Number(item.dataset.index);
        item.classList.add('is-dragging');
        try { e.dataTransfer.setData('text/plain', String(dragFrom)); e.dataTransfer.effectAllowed = 'move'; } catch (_) {}
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('is-dragging');
        listEl.querySelectorAll('.ban-list-item').forEach((el) => el.classList.remove('is-drag-over'));
        dragFrom = -1;
      });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        item.classList.add('is-drag-over');
        try { e.dataTransfer.dropEffect = 'move'; } catch (_) {}
      });
      item.addEventListener('dragleave', () => item.classList.remove('is-drag-over'));
      item.addEventListener('drop', async (e) => {
        e.preventDefault();
        item.classList.remove('is-drag-over');
        const to = Number(item.dataset.index);
        const from = dragFrom >= 0 ? dragFrom : Number(e.dataTransfer.getData('text/plain'));
        if (!Number.isFinite(from) || !Number.isFinite(to) || from === to) return;
        const next = list.slice();
        const [moved] = next.splice(from, 1);
        next.splice(to, 0, moved);
        list = next;
        renderList();
        orderMsg.textContent = 'กำลังบันทึกลำดับ...';
        try {
          const res = await api('/api/admin/home-banners/reorder', {
            method: 'PUT',
            body: JSON.stringify({ order: list.map((x) => x.filename || x.id) })
          });
          list = Array.isArray(res.data) ? res.data : list;
          renderList();
          orderMsg.textContent = 'บันทึกลำดับแล้ว ✓';
        } catch (err) {
          orderMsg.textContent = err.message || 'บันทึกลำดับไม่สำเร็จ';
          renderBanners();
        }
      });
    });
  };

  const uploadFiles = async (files) => {
    const arr = Array.from(files || []).filter((f) => String(f.type || '').startsWith('image/'));
    if (!arr.length) {
      msg.textContent = 'กรุณาเลือกไฟล์รูปภาพ';
      return;
    }
    msg.textContent = `กำลังอัปโหลด ${arr.length} ไฟล์...`;
    try {
      for (const file of arr) {
        const fd = new FormData();
        fd.append('image', file);
        const res = await fetch('/api/admin/home-banners/upload', {
          method: 'POST',
          credentials: 'include',
          body: fd
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.success === false) throw new Error(json.message || 'อัปโหลดไม่สำเร็จ');
      }
      msg.textContent = 'เพิ่มแบนเนอร์แล้ว ✓';
      renderBanners();
    } catch (e) {
      msg.textContent = e.message || 'อัปโหลดไม่สำเร็จ';
    }
  };

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  ['dragenter', 'dragover'].forEach((ev) => {
    drop.addEventListener(ev, (e) => {
      e.preventDefault();
      drop.classList.add('is-drag');
    });
  });
  ['dragleave', 'drop'].forEach((ev) => {
    drop.addEventListener(ev, (e) => {
      e.preventDefault();
      drop.classList.remove('is-drag');
    });
  });
  drop.addEventListener('drop', (e) => {
    const files = e.dataTransfer?.files;
    if (files?.length) uploadFiles(files);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files?.length) uploadFiles(fileInput.files);
    fileInput.value = '';
  });

  renderList();
}

      <span class="adm-c-count" id="user-count">0 ผู้ใช้</span>
    </div>
    <div id="user-list-area"></div>
  `;

  const searchInput = document.getElementById('user-search');
  const countEl = document.getElementById('user-count');
  const listArea = document.getElementById('user-list-area');

  const actionBtns = (u) => `
    <div class="adm-c-actions">
      <button type="button" class="pts-btn pts-btn-outline set-role" data-id="${u.user_id}" data-role="student" ${!isAdminRole(u) ? 'disabled style="opacity:.45"' : ''}>student</button>
      <button type="button" class="pts-btn pts-btn-outline set-role" data-id="${u.user_id}" data-role="admin" ${isAdminRole(u) ? 'disabled style="opacity:.45"' : ''}>admin</button>
      ${isActive(u)
        ? `<button type="button" class="pts-btn pts-btn-ghost set-flag" data-id="${u.user_id}" data-flag="N" style="color:#ba1a1a;">ระงับ</button>`
        : `<button type="button" class="pts-btn pts-btn-ghost set-flag" data-id="${u.user_id}" data-flag="Y">เปิดใช้</button>`}
    </div>`;

  const rowHtml = (u) => `
    <tr data-user-id="${u.user_id}">
      <td>
        <div class="adm-c-course">
          <span class="adm-c-id" title="รหัสผู้ใช้">ID ${escapeHtml(u.user_id)}</span>
          <div class="adm-c-name">${escapeHtml(u.full_name || '—')}</div>
        </div>
      </td>
      <td>${escapeHtml(u.email || '—')}</td>
      <td>${escapeHtml(u.phone || '—')}</td>
      <td><span class="adm-c-badge${isAdminRole(u) ? ' is-on' : ''}">${escapeHtml(String(u.Role || u.role || 'student').toLowerCase())}</span></td>
      <td><span class="adm-c-badge${isActive(u) ? ' is-on' : ''}">${isActive(u) ? 'ใช้งาน' : 'ระงับ'}</span></td>
      <td>${actionBtns(u)}</td>
    </tr>`;

  const cardHtml = (u) => `
    <article class="adm-c-card" data-user-id="${u.user_id}">
      <div class="adm-c-card__top">
        <div class="adm-c-course">
          <span class="adm-c-id" title="รหัสผู้ใช้">ID ${escapeHtml(u.user_id)}</span>
          <div class="adm-c-name">${escapeHtml(u.full_name || '—')}</div>
        </div>
        <span class="adm-c-badge${isAdminRole(u) ? ' is-on' : ''}">${escapeHtml(String(u.Role || u.role || 'student').toLowerCase())}</span>
      </div>
      <div class="adm-c-card__meta">
        <span>${escapeHtml(u.email || '—')}</span>
        <span>${escapeHtml(u.phone || '—')}</span>
        <span class="adm-c-badge${isActive(u) ? ' is-on' : ''}">${isActive(u) ? 'ใช้งาน' : 'ระงับ'}</span>
      </div>
      ${actionBtns(u)}
    </article>`;

  const matchesQuery = (u, q) => {
    if (!q) return true;
    const idStr = String(u.user_id ?? '').trim();
    const idQuery = q
      .replace(/^ไอดี\s*/i, '')
      .replace(/^id\s*/i, '')
      .replace(/^#\s*/, '')
      .trim();
    if (idQuery && /^\d+$/.test(idQuery) && idStr === idQuery) return true;
    if (idStr && (q === idStr || q === `#${idStr}` || q === `id${idStr}` || q === `id ${idStr}`)) return true;

    const hay = [
      idStr,
      `id ${idStr}`,
      `#${idStr}`,
      u.full_name,
      u.email,
      u.phone,
      u.Role || u.role,
      isActive(u) ? 'ใช้งาน เปิดใช้ active' : 'ระงับ ปิดใช้ suspended',
      isAdminRole(u) ? 'admin' : 'student'
    ].join(' ').toLowerCase();
    return hay.includes(q);
  };

  const bindListActions = () => {
    document.querySelectorAll('.set-role').forEach((btn) => {
      btn.onclick = async () => {
        if (btn.disabled) return;
        try {
          await api(`/api/admin/users/${btn.dataset.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ role: btn.dataset.role })
          });
          await renderUsers();
        } catch (e) {
          alert(e.message || 'อัปเดตบทบาทไม่สำเร็จ');
        }
      };
    });
    document.querySelectorAll('.set-flag').forEach((btn) => {
      btn.onclick = async () => {
        const label = btn.dataset.flag === 'N' ? 'ระงับผู้ใช้นี้ใช่หรือไม่?' : 'เปิดใช้งานผู้ใช้นี้ใช่หรือไม่?';
        if (!window.confirm(label)) return;
        try {
          await api(`/api/admin/users/${btn.dataset.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ flag_use: btn.dataset.flag })
          });
          await renderUsers();
        } catch (e) {
          alert(e.message || 'อัปเดตสถานะไม่สำเร็จ');
        }
      };
    });
  };

  const renderList = (query = '') => {
    const q = String(query || '').trim().toLowerCase();
    const filtered = usersCache.filter((u) => matchesQuery(u, q));
    countEl.textContent = q
      ? `${filtered.length} / ${usersCache.length} ผู้ใช้`
      : `${usersCache.length} ผู้ใช้`;

    if (!usersCache.length) {
      listArea.innerHTML = '<div class="adm-c-empty">ยังไม่มีผู้ใช้</div>';
      return;
    }
    if (!filtered.length) {
      listArea.innerHTML = '<div class="adm-c-empty">ไม่พบผู้ใช้ที่ตรงกับคำค้นหา</div>';
      return;
    }

    listArea.innerHTML = `
      <div class="adm-c-table-wrap">
        <table class="adm-c-table">
          <thead>
            <tr>
              <th>ผู้ใช้</th>
              <th>อีเมล</th>
              <th>เบอร์โทร</th>
              <th>บทบาท</th>
              <th>สถานะ</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody>${filtered.map(rowHtml).join('')}</tbody>
        </table>
      </div>
      <div class="adm-c-cards">${filtered.map(cardHtml).join('')}</div>
    `;
    bindListActions();
  };

  searchInput.addEventListener('input', () => renderList(searchInput.value));
  renderList();
}

async function renderPosts() {
  const { data } = await api('/api/admin/posts');
  const postsCache = data || [];

  const isVisible = (p) => Number(p.flag_use) === 1 || p.flag_use === true;

  const fmtDate = (v) => {
    if (!v) return '—';
    try {
      return new Date(v).toLocaleString('th-TH', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    } catch (_) { return '—'; }
  };

  document.getElementById('panel').innerHTML = `
    <div class="adm-c-head">
      <div>
        <h3>ดูแลโพสต์คอมมูนิตี้</h3>
        <p>โหมด Auto-Publish — โพสต์ขึ้นทันที แอดมินค่อยซ่อนเนื้อหาไม่เหมาะสมทีหลัง</p>
      </div>
    </div>
    <div class="adm-c-tools">
      <input id="post-search" class="adm-c-search" type="search" placeholder="ค้นหาเนื้อหา / ผู้โพสต์ / อีเมล / ID..." autocomplete="off">
      <span class="adm-c-count" id="post-count">0 โพสต์</span>
    </div>
    <div id="post-list-area"></div>
  `;

  const searchInput = document.getElementById('post-search');
  const countEl = document.getElementById('post-count');
  const listArea = document.getElementById('post-list-area');

  const snippet = (text, n = 140) => {
    const t = String(text || '').replace(/\s+/g, ' ').trim();
    if (t.length <= n) return t;
    return t.slice(0, n) + '…';
  };

  const actionBtns = (p) => isVisible(p)
    ? `<div class="adm-c-actions">
        <button type="button" class="pts-btn pts-btn-ghost hide-post" data-id="${p.post_id}" style="color:#ba1a1a;">ซ่อน</button>
      </div>`
    : `<div class="adm-c-actions">
        <button type="button" class="pts-btn pts-btn-outline restore-post" data-id="${p.post_id}">แสดงอีกครั้ง</button>
      </div>`;

  const rowHtml = (p) => `
    <tr data-post-id="${p.post_id}" class="${isVisible(p) ? '' : 'opacity-60'}">
      <td>
        <div class="adm-c-course">
          <span class="adm-c-id" title="รหัสโพสต์">ID ${escapeHtml(p.post_id)}</span>
          <div class="adm-c-name" style="font-weight:600;white-space:pre-wrap;">${escapeHtml(snippet(p.content, 160))}</div>
        </div>
      </td>
      <td>
        <div class="adm-c-name" style="font-size:13px;">${escapeHtml(p.author_name || '—')}</div>
        <div class="adm-c-id" style="margin-top:4px;border:0;background:transparent;padding:0;color:#5c4f55;">${escapeHtml(p.email || '')}</div>
      </td>
      <td>${fmtDate(p.created_at)}</td>
      <td><span class="adm-c-badge${isVisible(p) ? ' is-on' : ''}">${isVisible(p) ? 'แสดงอยู่' : 'ซ่อนแล้ว'}</span></td>
      <td>${actionBtns(p)}</td>
    </tr>`;

  const cardHtml = (p) => `
    <article class="adm-c-card ${isVisible(p) ? '' : 'opacity-70'}" data-post-id="${p.post_id}">
      <div class="adm-c-card__top">
        <div class="adm-c-course">
          <span class="adm-c-id" title="รหัสโพสต์">ID ${escapeHtml(p.post_id)}</span>
          <div class="adm-c-name" style="font-weight:600;white-space:pre-wrap;">${escapeHtml(snippet(p.content, 180))}</div>
        </div>
        <span class="adm-c-badge${isVisible(p) ? ' is-on' : ''}">${isVisible(p) ? 'แสดงอยู่' : 'ซ่อนแล้ว'}</span>
      </div>
      <div class="adm-c-card__meta">
        <span>${escapeHtml(p.author_name || '—')}</span>
        <span>${escapeHtml(p.email || '—')}</span>
        <span>${fmtDate(p.created_at)}</span>
      </div>
      ${actionBtns(p)}
    </article>`;

  const matchesQuery = (p, q) => {
    if (!q) return true;
    const idStr = String(p.post_id ?? '').trim();
    const idQuery = q
      .replace(/^ไอดี\s*/i, '')
      .replace(/^id\s*/i, '')
      .replace(/^#\s*/, '')
      .trim();
    if (idQuery && /^\d+$/.test(idQuery) && idStr === idQuery) return true;
    if (idStr && (q === idStr || q === `#${idStr}` || q === `id${idStr}` || q === `id ${idStr}`)) return true;

    const hay = [
      idStr,
      `id ${idStr}`,
      `#${idStr}`,
      p.content,
      p.author_name,
      p.email,
      isVisible(p) ? 'แสดงอยู่ เปิด' : 'ซ่อนแล้ว ซ่อน'
    ].join(' ').toLowerCase();
    return hay.includes(q);
  };

  const bindListActions = () => {
    document.querySelectorAll('.hide-post').forEach((btn) => {
      btn.onclick = async () => {
        if (!window.confirm('ซ่อนโพสต์นี้จากคอมมูนิตี้ใช่หรือไม่?')) return;
        try {
          await api(`/api/admin/posts/${btn.dataset.id}`, { method: 'DELETE' });
          await renderPosts();
        } catch (e) {
          alert(e.message || 'ซ่อนไม่สำเร็จ');
        }
      };
    });
    document.querySelectorAll('.restore-post').forEach((btn) => {
      btn.onclick = async () => {
        try {
          await api(`/api/admin/posts/${btn.dataset.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ flag_use: 1 })
          });
          await renderPosts();
        } catch (e) {
          alert(e.message || 'แสดงโพสต์ไม่สำเร็จ');
        }
      };
    });
  };

  const renderList = (query = '') => {
    const q = String(query || '').trim().toLowerCase();
    const filtered = postsCache.filter((p) => matchesQuery(p, q));
    countEl.textContent = q
      ? `${filtered.length} / ${postsCache.length} โพสต์`
      : `${postsCache.length} โพสต์`;

    if (!postsCache.length) {
      listArea.innerHTML = '<div class="adm-c-empty">ยังไม่มีโพสต์ในคอมมูนิตี้</div>';
      return;
    }
    if (!filtered.length) {
      listArea.innerHTML = '<div class="adm-c-empty">ไม่พบโพสต์ที่ตรงกับคำค้นหา</div>';
      return;
    }

    listArea.innerHTML = `
      <div class="adm-c-table-wrap">
        <table class="adm-c-table">
          <thead>
            <tr>
              <th>เนื้อหา</th>
              <th>ผู้โพสต์</th>
              <th>เวลา</th>
              <th>สถานะ</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody>${filtered.map(rowHtml).join('')}</tbody>
        </table>
      </div>
      <div class="adm-c-cards">${filtered.map(cardHtml).join('')}</div>
    `;
    bindListActions();
  };

  searchInput.addEventListener('input', () => renderList(searchInput.value));
  renderList();
}

  const f = data.form || {};
  const s = data.status || {};

      <p class="text-sm mt-1 text-on-surface-variant">SMTP: ${s.smtpConfigured ? 'ตั้งแล้ว' : 'ยังไม่ตั้ง'} · Brevo: ${s.brevoConfigured ? 'ตั้งแล้ว' : 'ยังไม่ตั้ง'} · From: ${escapeHtml(s.fromEmail || '-')}</p>

      <label class="text-sm">โหมด
        <select id="m-mode" class="mt-1 w-full border rounded-xl px-3 py-2">

      </label>
      <label class="text-sm">อีเมลผู้ส่งของระบบ (From — กล่องเดียว)

      </label>
      <label class="text-sm">SMTP Host

      </label>

      <label class="text-sm">SMTP Password / App Password ${f.hasSmtpPass ? '<span class="text-emerald-700">(มีรหัสบันทึกไว้แล้ว — เว้นว่างถ้าไม่เปลี่ยน)</span>' : ''}
        <div class="pts-pw-wrap relative mt-1">
          <input id="m-pass" type="password" class="w-full border rounded-xl px-3 py-2 pr-12 pts-pw-input" data-pts-pw-field="1" placeholder="${f.hasSmtpPass ? '••••••••' : 'รหัสผ่านอีเมล'}">

        fromName: document.getElementById('m-from-name').value,
        fromEmail: document.getElementById('m-from-email').value,
        smtpHost: document.getElementById('m-host').value,

      msg.textContent = e.message;
      msg.className = 'pts-msg pts-msg--err';
    }
  };

  document.getElementById('test-mail').onclick = async () => {
    const msg = document.getElementById('mail-msg');
    try {
      const res = await api('/api/admin/mail/test', {
        method: 'POST',
        body: JSON.stringify({ email: document.getElementById('m-test-email').value })
      });
      msg.textContent = res.message;
      msg.className = 'pts-msg pts-msg--ok';
    } catch (e) {
      msg.textContent = e.message;
      msg.className = 'pts-msg pts-msg--err';
    }
  };
}

          — ไฟล์จะถูกบันทึกเป็น <code>logo.png</code> (โลโก้) และ <code>stamp.png</code> (สแตมป์)
        </p>
        <div class="grid gap-4 md:grid-cols-2">
          <div class="rounded-2xl border border-[var(--pts-border,rgba(151,66,88,.14))] p-4">
            <h3 class="font-bold mb-2">โลโก้ (หัวใบประกาศ)</h3>
            <div class="bg-[#f7f1f3] rounded-xl p-4 mb-3 flex items-center justify-center min-h-[160px]">
              <img id="cert-logo-preview" src="${escapeHtml(logo.url)}" alt="Logo preview"
                style="max-height:120px;max-width:100%;object-fit:contain"
                onerror="this.onerror=null;this.src='/uploads/cert/logo.png'">
            </div>
            <p class="text-xs text-on-surface-variant mb-2">ไฟล์: <code>${escapeHtml(logo.filename || 'logo.png')}</code></p>
            <input type="file" id="cert-logo-file" accept="image/png,image/jpeg,image/webp,image/gif" class="block w-full text-sm mb-2">
            <button type="button" class="pts-btn pts-btn-primary" id="cert-logo-upload">อัปโหลดโลโก้</button>
            <p id="cert-logo-msg" class="text-xs mt-2 text-on-surface-variant"></p>
          </div>
          <div class="rounded-2xl border border-[var(--pts-border,rgba(151,66,88,.14))] p-4">
            <h3 class="font-bold mb-2">สแตมป์ (ท้ายใบประกาศ)</h3>
            <div class="bg-[#f7f1f3] rounded-xl p-4 mb-3 flex items-center justify-center min-h-[160px]">
              <img id="cert-stamp-preview" src="${escapeHtml(stamp.url)}" alt="Stamp preview"
                style="max-height:120px;max-width:100%;object-fit:contain"
                onerror="this.onerror=null;this.src='/uploads/cert/stamp.png'">
            </div>
            <p class="text-xs text-on-surface-variant mb-2">ไฟล์: <code>${escapeHtml(stamp.filename || 'stamp.png')}</code></p>
            <input type="file" id="cert-stamp-file" accept="image/png,image/jpeg,image/webp,image/gif" class="block w-full text-sm mb-2">
            <button type="button" class="pts-btn pts-btn-primary" id="cert-stamp-upload">อัปโหลดสแตมป์</button>
            <p id="cert-stamp-msg" class="text-xs mt-2 text-on-surface-variant"></p>
          </div>
        </div>
      </div>
    </div>`;

  const uploadSlot = async (slot, fileInputId, msgId, previewId) => {
    const input = document.getElementById(fileInputId);
    const msg = document.getElementById(msgId);
    const file = input?.files?.[0];
    if (!file) {
      if (msg) msg.textContent = 'กรุณาเลือกไฟล์ก่อน';
      return;
    }
    if (msg) msg.textContent = 'กำลังอัปโหลด...';
    try {
      const fd = new FormData();
      fd.append('slot', slot);
      fd.append('image', file);
      const res = await fetch(`/api/admin/cert-assets/upload?slot=${encodeURIComponent(slot)}`, {
        method: 'POST',
        credentials: 'include',
        body: fd
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || json.success === false) throw new Error(json.message || 'อัปโหลดไม่สำเร็จ');
      const preview = document.getElementById(previewId);
      if (preview && json.url) preview.src = json.url;
      if (msg) msg.textContent = 'อัปโหลดแล้ว ✓ — เปิดหน้า Certificates เพื่อดูผล';
    } catch (e) {
      if (msg) msg.textContent = e.message || 'อัปโหลดไม่สำเร็จ';
    }
  };

  document.getElementById('cert-logo-upload')?.addEventListener('click', () => {
    uploadSlot('logo', 'cert-logo-file', 'cert-logo-msg', 'cert-logo-preview');
  });
  document.getElementById('cert-stamp-upload')?.addEventListener('click', () => {
    uploadSlot('stamp', 'cert-stamp-file', 'cert-stamp-msg', 'cert-stamp-preview');
  });
}

const tabs = {
  courses: renderCourses,
  lessons: renderLessons,
  schedules: renderSchedules,
  banners: renderBanners,
  cert: renderCertAssets,
  users: renderUsers,
  posts: renderPosts,
  payments: renderPayments,
  mail: renderMail
};

function showAdminError(err) {
  const panel = document.getElementById('panel');
  if (!panel) return;
  const msg = (err && err.message) ? err.message : String(err || 'ไม่ทราบสาเหตุ');
  panel.innerHTML = `<div class="p-4 rounded-xl border border-red-200 bg-red-50 text-red-800 text-sm">
    <p class="font-bold mb-1">โหลดแผงแอดมินไม่สำเร็จ</p>
    <p>${escapeHtml(msg)}</p>
  </div>`;
}

async function activateTab(name) {
  const key = tabs[name] ? name : 'courses';
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === key);
  });
  const panel = document.getElementById('panel');
  if (panel) panel.innerHTML = '<p class="text-sm text-on-surface-variant">กำลังโหลด...</p>';
  try {
    await tabs[key]();
  } catch (err) {
    console.error(err);
    showAdminError(err);
  }
  if (location.hash !== '#' + key) {
    history.replaceState(null, '', '#' + key);
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => activateTab(btn.dataset.tab);
});

window.addEventListener('hashchange', () => {
  activateTab((location.hash || '').replace(/^#/, ''));
});

(async () => {
  const me = await fetch('/api/users/me', { credentials: 'include' }).then(r => r.json());
  if (!me.loggedIn) return location.href = 'Login.html';
  if ((me.user.role || '').toLowerCase() !== 'admin') {
    return location.href = 'Home.html';
  }
  await activateTab((location.hash || '').replace(/^#/, '') || 'courses');
})().catch(err => {
  console.error(err);
  showAdminError(err);
});
</script>
<script>
/* If the main admin script failed to parse, surface a visible error instead of a blank panel. */
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    if (typeof activateTab === 'function') return;
    const panel = document.getElementById('panel');
    if (panel && !panel.innerHTML.trim()) {
      panel.innerHTML = '<div class="p-4 rounded-xl border border-red-200 bg-red-50 text-red-800 text-sm"><p class="font-bold">แผงแอดมินโหลดไม่สำเร็จ</p><p>สคริปต์หน้านี้พัง — รีเฟรชแรง (Ctrl+F5) หรือแจ้งผู้ดูแล</p></div>';
    }
  }, 50);
});
</script>
