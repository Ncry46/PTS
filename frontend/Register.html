<!DOCTYPE html>
<html class="light" lang="th">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>สมัครสมาชิก | PTS Learning</title>
<script src="/comp/theme-boot.js"></script>
<script src="/comp/i18n-dict.js?v=20260725lang"></script>
<script src="/comp/lang-boot.js?v=20260725lang"></script>
<link rel="stylesheet" href="site.css?v=20260727authrose">
<link rel="stylesheet" href="auth-scene.css?v=20260727authrose">
<link rel="stylesheet" href="login.css?v=20260727authrose">
<link rel="stylesheet" href="register.css?v=20260727authrose">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
</head>
<body class="pts-body pts-login pts-register">
<div class="pts-auth-scene" aria-hidden="true">
  <div class="pts-auth-scene__photo"></div>
  <div class="pts-auth-scene__tint"></div>
  <div class="pts-auth-scene__veil"></div>
  <div class="pts-auth-scene__lines pts-auth-scene__lines--left"></div>
  <div class="pts-auth-scene__lines pts-auth-scene__lines--right"></div>
  <div class="pts-auth-scene__lines pts-auth-scene__lines--top"></div>
  <div class="pts-auth-scene__fade"></div>
</div>
<div id="app-navbar"></div>

<main class="pts-login__stage">
  <div class="pts-login__shell pts-login__shell--plain pts-register__shell" id="register-shell">
    <section class="pts-login__panel">
      <header class="pts-login__header">
        <p class="pts-login__eyebrow">Create account</p>
        <h2 class="pts-login__title" data-i18n="page.register.title">สร้างบัญชีใหม่</h2>
        <p class="pts-login__sub" data-i18n="page.register.sub">กรอกข้อมูลเพื่อเริ่มต้นการเรียนรู้ของคุณ</p>
      </header>

      <form class="pts-login__form" id="register-form">
        <div class="pts-login__field">
          <label for="fullname" data-i18n="auth.fullName">ชื่อ-นามสกุล</label>
          <div class="pts-login__control pts-pw-wrap">
            <span class="material-symbols-outlined pts-login__ico">person</span>
            <input class="pts-login__input" id="fullname" name="fullname" placeholder="พิมพ์ชื่อและนามสกุลของคุณ" data-i18n-placeholder="auth.namePh" type="text" required autocomplete="name">
          </div>
        </div>

        <div class="pts-login__field">
          <label for="email" data-i18n="auth.email">อีเมล</label>
          <div class="pts-login__control pts-pw-wrap">
            <span class="material-symbols-outlined pts-login__ico">mail</span>
            <input class="pts-login__input" id="email" name="email" placeholder="example@email.com" type="email" required autocomplete="email">
          </div>
        </div>

        <div class="pts-login__field">
          <label for="phone" data-i18n="auth.phone">เบอร์โทรศัพท์</label>
          <div class="pts-login__control pts-pw-wrap">
            <span class="material-symbols-outlined pts-login__ico">call</span>
            <input class="pts-login__input" id="phone" name="phone" placeholder="08x-xxx-xxxx" type="tel" autocomplete="tel">
          </div>
        </div>

        <div class="pts-login__field">
          <label for="password" data-i18n="auth.password">รหัสผ่าน</label>
          <div class="pts-login__control pts-pw-wrap">
            <span class="material-symbols-outlined pts-login__ico">lock</span>
            <input class="pts-login__input pts-login__input--pw" id="password" name="password" placeholder="••••••••" type="password" required autocomplete="new-password" data-pts-pw-field="1">
            <button class="pts-pw-toggle hidden" type="button" id="toggle-password-btn" data-pts-pw-toggle="1" aria-label="แสดงหรือซ่อนรหัสผ่าน">
              <span class="material-symbols-outlined" id="password-icon" aria-hidden="true">visibility</span>
            </button>
          </div>
        </div>

        <div class="pts-login__field">
          <label for="confirm-password" data-i18n="auth.confirmPassword">ยืนยันรหัสผ่าน</label>
          <div class="pts-login__control pts-pw-wrap">
            <span class="material-symbols-outlined pts-login__ico">lock_reset</span>
            <input class="pts-login__input pts-login__input--pw" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password" required autocomplete="new-password" data-pts-pw-field="1">
            <button class="pts-pw-toggle hidden" type="button" id="toggle-confirm-password-btn" data-pts-pw-toggle="1" aria-label="แสดงหรือซ่อนรหัสผ่าน">
              <span class="material-symbols-outlined" id="confirm-password-icon" aria-hidden="true">visibility</span>
            </button>
          </div>
        </div>

        <label class="pts-login__remember" for="tos">
          <input id="tos" type="checkbox" required>
          <span>ฉันยอมรับ <a class="pts-login__link" href="Legal.html">เงื่อนไขการใช้งาน</a> และ <a class="pts-login__link" href="Legal.html">นโยบายความเป็นส่วนตัว</a></span>
        </label>

        <button class="pts-login__submit" type="submit" id="submit-btn">
          <span data-i18n="auth.registerBtn">สมัครสมาชิก</span>
          <span class="material-symbols-outlined pts-login__submit-ico">person_add</span>
        </button>
        <p id="register-msg" class="pts-login__msg hidden"></p>
      </form>

      <div class="pts-login__divider" data-i18n="auth.or">หรือ</div>

      <button type="button" class="pts-login__google" id="google-register-btn" aria-label="สมัครด้วย Gmail" data-i18n-aria-label="auth.google">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#EA4335" d="M12 10.2v3.6h5.1c-.2 1.2-.9 2.2-1.9 2.9l3.1 2.4c1.8-1.7 2.9-4.1 2.9-7 0-.7-.1-1.3-.2-1.9H12z"/>
          <path fill="#34A853" d="M6.6 14.3l-.8.6-2.5 1.9C5.1 19.5 8.3 21.5 12 21.5c2.7 0 5-.9 6.7-2.4l-3.1-2.4c-.8.6-1.9.9-3.6.9-2.8 0-5.1-1.9-6-4.4z"/>
          <path fill="#4A90E2" d="M3.3 7.2C2.5 8.7 2 10.3 2 12s.5 3.3 1.3 4.8l3.3-2.5C6.2 13.4 6 12.7 6 12s.2-1.4.6-2.3L3.3 7.2z"/>
          <path fill="#FBBC05" d="M12 5.5c1.5 0 2.8.5 3.9 1.5l2.9-2.9C16.9 2.4 14.7 1.5 12 1.5 8.3 1.5 5.1 3.5 3.3 7.2l3.3 2.5C7 7.4 9.2 5.5 12 5.5z"/>
        </svg>
        <span data-i18n="auth.google">เข้าสู่ระบบด้วย Gmail</span>
      </button>

      <p class="pts-login__foot">เป็นสมาชิกอยู่แล้ว? <a href="Login.html">เข้าสู่ระบบ</a></p>
      <nav class="pts-login__legal" aria-label="ลิงก์เพิ่มเติม">
        <a href="Home.html">About Us</a>
        <a href="Legal.html">Privacy Policy</a>
        <a href="Legal.html#contact">Contact Us</a>
      </nav>
    </section>
  </div>
</main>

<script>
(function () {
  const form = document.getElementById('register-form');
  if (!form) return;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const tosChecked = document.getElementById('tos').checked;
    const msgEl = document.getElementById('register-msg');
    const showMsg = (text) => {
      if (!msgEl) return;
      msgEl.textContent = text;
      msgEl.classList.remove('hidden');
    };
    if (msgEl) {
      msgEl.textContent = '';
      msgEl.classList.add('hidden');
    }

    if (password !== confirmPassword) {
      showMsg('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง');
      return;
    }
    if (!tosChecked) {
      showMsg('กรุณากดเลือกยอมรับเงื่อนไขการใช้งานก่อนสมัครสมาชิก');
      return;
    }

    const btn = document.getElementById('submit-btn');
    const label = btn.querySelector('span');
    const originalText = label ? label.textContent : btn.textContent;
    if (label) label.textContent = 'กำลังดำเนินการ...';
    else btn.textContent = 'กำลังดำเนินการ...';
    btn.disabled = true;

    try {
      const response = await fetch('/api/users/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          full_name: document.getElementById('fullname').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          password
        })
      });
      const result = await response.json();
      if (result.success) {
        window.location.href = 'Login.html';
      } else {
        showMsg(result.message || 'สมัครสมาชิกไม่สำเร็จ');
      }
    } catch (err) {
      console.error(err);
      showMsg('ไม่สามารถติดต่อระบบหลังบ้านได้');
    } finally {
      if (label) label.textContent = originalText;
      else btn.textContent = originalText;
      btn.disabled = false;
    }
  });
})();
</script>
<script src="auth-scene.js?v=20260727authrose"></script>
<script src="password-toggle.js?v=20260720e"></script>
<script src="/comp/navbar.js?v=20260726navfull"></script>
</body>
</html>
