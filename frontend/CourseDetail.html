<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>tailwind.config={theme:{extend:{colors:{primary:'#974258','on-surface-variant':'#5c4f55',error:'#ba1a1a'}}}}</script>
<style>
  .pts-notify {
    margin: 0 0 22px;
    padding: 16px;
    border: 1px solid var(--pts-border, rgba(151,66,88,.14));
    border-radius: 16px;
    background: color-mix(in srgb, var(--pts-primary, #974258) 5%, transparent);
  }
  .pts-notify__title { font-size: 14px; font-weight: 700; margin: 0 0 4px; color: var(--pts-text, #1c1520); }
  .pts-notify__hint { font-size: 12px; color: var(--pts-muted, #5c4f55); margin: 0 0 12px; line-height: 1.45; }
  .pts-notify__actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pts-notify__actions .pts-btn { flex: 1 1 160px; justify-content: center; text-align: center; }

  .pts-course-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .pts-course-icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1.5px solid var(--pts-border, rgba(151,66,88,.18));
    background: #fff;
    color: var(--pts-muted, #5c4f55);
    display: inline-grid;
    place-items: center;
    cursor: pointer;
    text-decoration: none;
    flex-shrink: 0;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .pts-course-icon-btn .material-symbols-outlined { font-size: 20px; line-height: 1; }
  .pts-course-icon-btn:hover {
    border-color: color-mix(in srgb, var(--pts-primary, #974258) 45%, transparent);
    color: var(--pts-primary, #974258);
  }
  .pts-course-icon-btn.is-active {
    color: var(--pts-primary, #974258);
    background: var(--pts-primary-soft, #f6e6ea);
    border-color: color-mix(in srgb, var(--pts-primary, #974258) 35%, transparent);
  }
  .pts-course-icon-btn.is-active .material-symbols-outlined {
    font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
  }
  .pts-course-cta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 0 0 18px;
  }
  html[data-theme="dark"] .pts-course-icon-btn {
    background: color-mix(in srgb, var(--pts-card-bg, #1c1520) 88%, #fff);
    border-color: rgba(234, 223, 226, 0.22);
    color: #d8c5cb;
  }
  html[data-theme="dark"] .pts-course-icon-btn:hover,
  html[data-theme="dark"] .pts-course-icon-btn.is-active {
    color: #f3b8c6;
    border-color: color-mix(in srgb, var(--pts-primary, #974258) 45%, transparent);
    background: color-mix(in srgb, var(--pts-primary, #974258) 18%, transparent);
  }
</style>
</head>
<body class="pts-body">
<div id="app-navbar">
  <nav style="position:fixed;top:0;left:0;right:0;z-index:99999;height:68px;background:var(--pts-nav-bg,#fff);border-bottom:1px solid var(--pts-border,rgba(151,66,88,.18));">
    <div style="max-width:1120px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;justify-content:space-between;">
      <a href="Home.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--pts-text,#1c1520);font-weight:700;">
        <img src="/logo.png" alt="PTS Learning" style="height:42px;width:auto;max-width:160px;object-fit:contain;display:block;">
        PTS Learning
      </a>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a href="Login.html" style="padding:8px 14px;border:1px solid #974258;border-radius:999px;color:#974258;text-decoration:none;font-weight:700;font-size:14px;">เข้าสู่ระบบ</a>
        <a href="Register.html" style="padding:8px 14px;background:#974258;border-radius:999px;color:#fff;text-decoration:none;font-weight:700;font-size:14px;">สมัครสมาชิก</a>
      </div>
    </div>
  </nav>
</div>
<main class="pts-main pts-main--wide">
  <div id="content"><div class="pts-empty">กำลังโหลด...</div></div>
</main>

<div class="pts-footer-note">© PTS Learning</div>
<script>
const courseId = new URLSearchParams(location.search).get('courseId');
const escapeHtml = (t) => String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function mountCourseNotifyControls(hostEl) {
  if (!hostEl || !courseId) return;

  let pref;
  try {
    const prefRes = await fetch(`/api/google/course-notify?courseId=${encodeURIComponent(courseId)}`, {
      credentials: 'include',
      cache: 'no-store'
    });
    pref = await prefRes.json();
    if (!prefRes.ok || pref.success === false) throw new Error(pref.message || 'โหลดสถานะไม่สำเร็จ');
  } catch (err) {
    console.warn(err);
    return;
  }

  // Not enrolled → no notify UI
  if (!pref.enrolled) {
    hostEl.innerHTML = '';
    hostEl.hidden = true;
    return;
  }

  hostEl.hidden = false;
  const enabled = !!pref.enabled;
  const connected = !!pref.connected;
  const upcoming = Number(pref.upcoming_count || 0);
  const calLabel = enabled ? 'เปิดรับปฏิทินแล้ว' : 'รับแจ้งเตือนเข้าปฏิทิน';
  const calHint = enabled
    ? (connected
      ? (upcoming > 0
        ? `ส่งตาราง ${upcoming} รายการเข้า Google Calendar แล้ว`
        : 'เปิดรับแล้ว — ตารางรอบใหม่จะถูกส่งเข้าปฏิทินอัตโนมัติ')
      : 'เปิดรับคอร์สนี้แล้ว — ยังต้องผูกบัญชี Google ที่หน้าตั้งค่า')
    : 'สมัครคอร์สอย่างเดียวขึ้นในปฏิทินบนเว็บแล้ว — กดปุ่มนี้ถ้าต้องการส่งเข้า Google Calendar ด้วย';

  const settingsLabel = connected ? 'จัดการบัญชีปฏิทิน' : 'ไปตั้งค่าผูก Google';

  hostEl.innerHTML = `
    <div class="pts-notify">
      <p class="pts-notify__title">รับการแจ้งเตือน</p>
      <p class="pts-notify__hint">${escapeHtml(calHint)}</p>
      <div class="pts-notify__actions">
        <button type="button" class="pts-btn ${enabled ? 'pts-btn-primary' : 'pts-btn-outline'}" id="notify-cal-btn">${escapeHtml(calLabel)}</button>
      </div>
      <div class="pts-settings-shortcut" style="margin-top:12px;margin-bottom:0;">
        <p class="pts-settings-shortcut__text">
          <strong>ผูกบัญชี Google / LINE</strong> — ไปหน้าตั้งค่าเพื่อเชื่อมบัญชีหลัก
        </p>
        <a class="pts-btn pts-btn-outline" href="Settings.html#google-calendar">${escapeHtml(settingsLabel)}</a>
      </div>
      ${enabled ? `<div class="pts-notify__actions" style="margin-top:8px;">
        <button type="button" class="pts-btn pts-btn-ghost" id="notify-cal-off-btn">ปิดการแจ้งเตือนปฏิทิน</button>
        <a class="pts-btn pts-btn-ghost" href="Schedule.html">ดูปฏิทินบนเว็บ</a>
      </div>` : `<div class="pts-notify__actions" style="margin-top:8px;">
        <a class="pts-btn pts-btn-ghost" href="Schedule.html">ดูปฏิทินบนเว็บ</a>
      </div>`}
      <p id="notify-msg" class="pts-msg" style="margin:10px 0 0;"></p>
    </div>`;

  const msgEl = () => document.getElementById('notify-msg');

  async function setCourseNotify(on, btn) {
    const msg = msgEl();
    if (btn) btn.disabled = true;
    if (msg) { msg.textContent = 'กำลังอัปเดต...'; msg.className = 'pts-msg'; }
    try {
      const res = await fetch('/api/google/course-notify', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ courseId: Number(courseId), enabled: !!on })
      });
      const data = await res.json();
      if (!res.ok || data.success === false) throw new Error(data.message || 'อัปเดตไม่สำเร็จ');

      const synced = Number(data.synced || 0);
      await mountCourseNotifyControls(hostEl);
      const msg2 = msgEl();
      if (msg2) {
        if (on && data.connected === false) {
          msg2.textContent = 'บันทึกคอร์สนี้แล้ว — กด “ไปตั้งค่าผูก Google” เพื่อเชื่อมบัญชีหลัก แล้วระบบจะส่งตารางเข้าปฏิทิน';
          msg2.className = 'pts-msg pts-msg--ok';
        } else {
          msg2.textContent = data.message || (on
            ? (synced > 0 ? `เพิ่ม ${synced} รายการเข้าปฏิทินแล้ว` : 'เปิดรับแล้ว')
            : 'ปิดการแจ้งเตือนปฏิทินแล้ว');
          msg2.className = (on && (data.pending || synced === 0))
            ? 'pts-msg pts-msg--err'
            : 'pts-msg pts-msg--ok';
        }
      }
    } catch (e) {
      if (msg) {
        msg.textContent = e.message || 'อัปเดตไม่สำเร็จ';
        msg.className = 'pts-msg pts-msg--err';
      }
      if (btn) btn.disabled = false;
    }
  }

  document.getElementById('notify-cal-btn')?.addEventListener('click', (e) => {
    const btn = e.currentTarget;
    if (enabled) {
      const msg = msgEl();
      if (msg) {
        msg.textContent = connected
          ? 'เปิดรับอยู่แล้ว — ตรวจใน Google Calendar หรือกดปิดด้านล่าง'
          : 'รอบันทึกคอร์สนี้แล้ว — ไปตั้งค่าเพื่อผูก Google ก่อน';
        msg.className = 'pts-msg pts-msg--ok';
      }
      return;
    }
    setCourseNotify(true, btn);
  });

  document.getElementById('notify-cal-off-btn')?.addEventListener('click', (e) => {
    setCourseNotify(false, e.currentTarget);
  });
}

(async () => {
  if (!courseId) {
    document.getElementById('content').innerHTML = '<div class="pts-empty">ไม่พบรหัสหลักสูตร</div>';
    return;
  }
  const me = await fetch('/api/users/me', { credentials:'include' }).then(r=>r.json());
  const res = await fetch(`/api/courses/${courseId}`, { credentials:'include' });
  const data = await res.json();
  if (!res.ok || !data.success) {
    document.getElementById('content').innerHTML = `<div class="pts-empty pts-msg--err">${escapeHtml(data.message||'โหลดไม่สำเร็จ')}</div>`;
    return;
  }
  const c = data.data;
  const price = Number(c.price || 0);
  const enrolled = Number(c.is_enrolled) === 1;
  const loggedIn = !!me.loggedIn;
  const favorited = Number(c.is_favorited) === 1;
  let isFavorited = favorited;
  document.getElementById('content').innerHTML = `
    <article class="pts-card overflow-hidden">
      <div class="grid grid-cols-1 lg:grid-cols-2">
        <div class="relative min-h-[240px] lg:min-h-[420px]">
          <img class="absolute inset-0 w-full h-full object-cover" src="${c.cover_image_url || 'https://placehold.co/800x500/f8e8ec/974258?text=PTS+Course'}" alt="">
        </div>
        <div class="p-6 lg:p-8 flex flex-col">
          <div class="pts-course-card-head">
            <a class="pts-course-icon-btn" href="Courses.html" aria-label="ย้อนกลับไปรายการหลักสูตร" title="ย้อนกลับ">
              <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
            </a>
            ${loggedIn ? `
              <button type="button" id="fav" class="pts-course-icon-btn${isFavorited ? ' is-active' : ''}" aria-label="${isFavorited ? 'นำออกจากรายการโปรด' : 'บันทึกรายการโปรด'}" title="${isFavorited ? 'นำออกจากรายการโปรด' : 'บันทึกรายการโปรด'}">
                <span class="material-symbols-outlined" aria-hidden="true">favorite</span>
              </button>` : '<span></span>'}
          </div>
          <span class="pts-chip mb-3 w-fit">${escapeHtml(c.delivery_mode || 'course')}</span>
          <p class="text-xs font-bold tracking-[0.14em] text-primary mb-2">PTS LEARNING</p>
          <h1 class="text-3xl font-bold text-primary mb-2 pts-display">${escapeHtml(c.course_name)}</h1>
          <p class="text-sm text-on-surface-variant mb-4">โดย ${escapeHtml(c.instructor_name || '-')} · ${Number(c.total_hours||0)} ชม. · ${escapeHtml(c.delivery_mode || '-')}${c.is_open_soon ? ' · เปิดเร็วๆ นี้' : ''}${c.start_date ? ' · เริ่ม ' + escapeHtml(String(c.start_date).slice(0,10)) : ''}</p>
          <p class="text-on-surface-variant mb-5 leading-relaxed">${escapeHtml(c.description || 'ยังไม่มีคำอธิบายหลักสูตร')}</p>
          <p class="text-2xl font-bold pts-display mb-5">${price ? price.toLocaleString('th-TH') + ' บาท' : 'ติดต่อสอบถามราคา'}</p>
          <div class="pts-course-cta-row">
            ${!loggedIn
              ? `<a class="pts-btn pts-btn-primary" href="Login.html">เข้าสู่ระบบเพื่อสมัครเรียน</a>`
              : enrolled
                ? `<a class="pts-btn pts-btn-primary" href="Learn.html?courseId=${c.course_id}">เข้าเรียน</a>`
                : `<button type="button" id="pay-course" class="pts-btn pts-btn-primary">สมัครเรียน</button>`}
            ${loggedIn ? `<button type="button" id="calendar-course" class="pts-btn pts-btn-outline"><span class="material-symbols-outlined" aria-hidden="true" style="font-size:18px;line-height:1">calendar_month</span>เพิ่มปฏิทิน</button>` : ''}
          </div>
          <p id="course-toolbar-msg" class="pts-msg" style="margin:0 0 14px;" hidden></p>
          <div id="course-notify-host" hidden></div>
          <h2 class="font-bold mb-3">บทเรียนในหลักสูตร</h2>
          <ul class="space-y-2">${(data.lessons||[]).length
            ? (data.lessons||[]).map((l,i)=>`<li class="text-sm border border-[var(--pts-border)] rounded-xl px-3 py-2.5 flex justify-between gap-3"><span>${i+1}. ${escapeHtml(l.title)}</span><span class="text-on-surface-variant shrink-0">${l.duration_minutes||0} นาที</span></li>`).join('')
            : '<li class="text-sm text-on-surface-variant">ยังไม่มีบทเรียน — รอแอดมินเพิ่มเนื้อหา</li>'}</ul>
        </div>
      </div>
    </article>`;

  document.getElementById('pay-course')?.addEventListener('click', () => {
    if (!window.PTSPayModal) return;
    window.PTSPayModal.open({
      courseId: c.course_id,
      courseName: c.course_name,
      price: price
    });
  });

  document.getElementById('calendar-course')?.addEventListener('click', () => {
    const msg = document.getElementById('course-toolbar-msg');
    if (!msg) return;
    msg.hidden = false;

    if (!enrolled) {
      msg.textContent = 'สมัครเรียนก่อน แล้วจึงเพิ่มคอร์สนี้เข้าปฏิทินได้';
      msg.className = 'pts-msg pts-msg--err';
      return;
    }

    const host = document.getElementById('course-notify-host');
    if (host) {
      host.hidden = false;
      host.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    msg.textContent = 'เลื่อนลงไปที่ส่วนรับการแจ้งเตือน แล้วกดเพิ่มเข้าปฏิทินได้เลย';
    msg.className = 'pts-msg pts-msg--ok';
  });

  document.getElementById('fav')?.addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
      const r = await fetch(`/api/courses/${courseId}/favorite`, { method:'POST', credentials:'include' });
      const j = await r.json();
      if (!r.ok || j.success === false) throw new Error(j.message || 'บันทึกโปรดไม่สำเร็จ');
      isFavorited = typeof j.favorited !== 'undefined' ? !!j.favorited : !isFavorited;
      btn.classList.toggle('is-active', isFavorited);
      const label = isFavorited ? 'นำออกจากรายการโปรด' : 'บันทึกรายการโปรด';
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    } catch (err) {
      console.error(err.message || 'บันทึกโปรดไม่สำเร็จ');
    } finally {
      btn.disabled = false;
    }
  });

  if (loggedIn && enrolled) {
    await mountCourseNotifyControls(document.getElementById('course-notify-host'));
  }
})();
</script>
<!-- PTS-NAV-INLINE-BOOT -->
<script>
(function(){
  var box = document.getElementById('app-navbar');
  if (!box) {
    box = document.createElement('div');
    box.id = 'app-navbar';
    if (document.body) document.body.insertBefore(box, document.body.firstChild);
  }
  if (box && !box.querySelector('nav')) {
    box.innerHTML = '<nav style="position:fixed;top:0;left:0;right:0;z-index:99999;height:68px;background:var(--pts-nav-bg,#fff);border-bottom:1px solid var(--pts-border,#eadfe2)">'
      + '<div style="max-width:1120px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;justify-content:space-between">'
      + '<a href="Home.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--pts-text,#1c1520);font-weight:700">'
      + '<img src="/logo.png" alt="PTS Learning" style="height:42px;width:auto;max-width:160px;object-fit:contain;display:block">PTS Learning</a>'
      + '<div style="display:flex;gap:8px">'
      + '<a href="Login.html" style="padding:8px 14px;border:1px solid #974258;border-radius:999px;color:#974258;text-decoration:none;font-weight:700;font-size:14px">เข้าสู่ระบบ</a>'
      + '<a href="Register.html" style="padding:8px 14px;background:#974258;border-radius:999px;color:#fff;text-decoration:none;font-weight:700;font-size:14px">สมัครสมาชิก</a>'
      + '</div></div></nav>';
  }
})();
</script>
