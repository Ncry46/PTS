<style>
  .pts-notify {
    margin: 0 0 22px;
    padding: 16px;
    border: 1px solid var(--pts-border, rgba(151,66,88,.14));
    border-radius: 16px;
    background: color-mix(in srgb, var(--pts-primary, #ca1156) 5%, transparent);

  .pts-notify__hint { font-size: 12px; color: var(--pts-muted, #5c4f55); margin: 0 0 12px; line-height: 1.45; }
  .pts-notify__actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pts-notify__actions .pts-btn { flex: 1 1 160px; justify-content: center; text-align: center; }

  .pts-reviews { margin-top: 28px; }

    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 10px; margin-bottom: 16px;
  }
  .pts-reviews__avg { font-size: 15px; color: var(--pts-muted, #5c4f55); }
  .pts-reviews__avg strong { color: var(--pts-primary, #ca1156); font-size: 22px; }
  .pts-stars { display: inline-flex; gap: 2px; vertical-align: middle; }
  .pts-stars .material-symbols-outlined {
    font-size: 20px; color: #d4a017;
    font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
  }
  .pts-stars .is-empty { color: #d6c8cc; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .pts-review-form {
    border: 1px solid var(--pts-border, rgba(151,66,88,.14));
    border-radius: 18px; padding: 18px; margin-bottom: 18px;
    background: color-mix(in srgb, var(--pts-primary, #ca1156) 4%, #fff);
  }
  .pts-review-form label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .pts-star-pick { display: flex; gap: 4px; margin-bottom: 12px; }
  .pts-star-pick button {
    border: none; background: transparent; padding: 2px; cursor: pointer; color: #d6c8cc;
  }
  .pts-star-pick button.is-on { color: #d4a017; }
  .pts-star-pick .material-symbols-outlined {
    font-size: 28px;
    font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
  }
  .pts-star-pick button:not(.is-on) .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .pts-review-form textarea {
    width: 100%; min-height: 90px; border-radius: 12px; padding: 12px 14px;
    border: 1px solid var(--pts-border, rgba(151,66,88,.18));
    font: inherit; resize: vertical; margin-bottom: 12px;
  }
  .pts-review-list { display: grid; gap: 12px; }
  .pts-review-item {
    border: 1px solid var(--pts-border, rgba(151,66,88,.12));
    border-radius: 16px; padding: 14px 16px; background: #fff;
  }
  .pts-review-item__top {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 6px;
  }
  .pts-review-item__name { font-weight: 700; font-size: 14px; }
  .pts-review-item__date { font-size: 12px; color: var(--pts-muted, #5c4f55); }
  .pts-review-item__comment { font-size: 14px; line-height: 1.5; color: var(--pts-text, #1c1520); margin: 8px 0 0; }
  .pts-review-gate {
    font-size: 13px; color: var(--pts-muted, #5c4f55); padding: 12px 14px;
    border-radius: 12px; background: rgba(0,0,0,.03); margin-bottom: 16px;
  }

  .pts-course-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .pts-course-icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1.5px solid var(--pts-border, rgba(151,66,88,.18));
    background: #fff;
    color: var(--pts-muted, #5c4f55);
    display: inline-grid;
    place-items: center;
    cursor: pointer;
    text-decoration: none;
    flex-shrink: 0;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .pts-course-icon-btn .material-symbols-outlined { font-size: 20px; line-height: 1; }
  .pts-course-icon-btn:hover {
    border-color: color-mix(in srgb, var(--pts-primary, #ca1156) 45%, transparent);
    color: var(--pts-primary, #ca1156);
  }
  .pts-course-icon-btn.is-active {
    color: var(--pts-primary, #ca1156);
    background: var(--pts-primary-soft, #f6e6ea);
    border-color: color-mix(in srgb, var(--pts-primary, #ca1156) 35%, transparent);
  }
  .pts-course-icon-btn.is-active .material-symbols-outlined {
    font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
  }
  .pts-course-cta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 0 0 18px;
  }
  html[data-theme="dark"] .pts-course-icon-btn {
    background: color-mix(in srgb, var(--pts-card-bg, #1c1520) 88%, #fff);
    border-color: rgba(234, 223, 226, 0.22);
    color: #d8c5cb;
  }
  html[data-theme="dark"] .pts-course-icon-btn:hover,
  html[data-theme="dark"] .pts-course-icon-btn.is-active {
    color: #f3b8c6;
    border-color: color-mix(in srgb, var(--pts-primary, #ca1156) 45%, transparent);
    background: color-mix(in srgb, var(--pts-primary, #ca1156) 18%, transparent);
  }
</style>

<script>
const courseId = new URLSearchParams(location.search).get('courseId');
const escapeHtml = (t) => String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const tt = (key, fallback) => (window.PTSLang && typeof PTSLang.t === 'function' ? PTSLang.t(key, fallback) : (fallback || key));

async function mountCourseNotifyControls(hostEl) {
  if (!hostEl || !courseId) return;

  let pref;
  try {
    const prefRes = await fetch(`/api/google/course-notify?courseId=${encodeURIComponent(courseId)}`, {
      credentials: 'include',
      cache: 'no-store'
    });
    pref = await prefRes.json();
    if (!prefRes.ok || pref.success === false) throw new Error(pref.message || 'โหลดสถานะไม่สำเร็จ');
  } catch (err) {
    console.warn(err);
    return;
  }

  // Not enrolled → no notify UI
  if (!pref.enrolled) {
    hostEl.innerHTML = '';
    hostEl.hidden = true;
    return;
  }

  hostEl.hidden = false;
  const enabled = !!pref.enabled;
  const connected = !!pref.connected;
  const upcoming = Number(pref.upcoming_count || 0);
  const calLabel = enabled ? 'เปิดรับปฏิทินแล้ว' : 'รับแจ้งเตือนเข้าปฏิทิน';
  const calHint = enabled
    ? (connected
      ? (upcoming > 0
        ? `ส่งตาราง ${upcoming} รายการเข้า Google Calendar แล้ว`
        : 'เปิดรับแล้ว — ตารางรอบใหม่จะถูกส่งเข้าปฏิทินอัตโนมัติ')
      : 'เปิดรับคอร์สนี้แล้ว — ยังต้องผูกบัญชี Google ที่หน้าตั้งค่า')
    : 'สมัครคอร์สอย่างเดียวขึ้นในปฏิทินบนเว็บแล้ว — กดปุ่มนี้ถ้าต้องการส่งเข้า Google Calendar ด้วย';

  const settingsLabel = connected ? 'จัดการบัญชีปฏิทิน' : 'ไปตั้งค่าผูก Google';

  hostEl.innerHTML = `
    <div class="pts-notify">
      <p class="pts-notify__section_title">รับการแจ้งเตือน</p>
      <p class="pts-notify__hint">${escapeHtml(calHint)}</p>
      <div class="pts-notify__actions">
        <button type="button" class="pts-btn ${enabled ? 'pts-btn-primary' : 'pts-btn-outline'}" id="notify-cal-btn">${escapeHtml(calLabel)}</button>
      </div>
      <div class="pts-settings-shortcut" style="margin-top:12px;margin-bottom:0;">
        <p class="pts-settings-shortcut__text">
          <strong>ผูกบัญชี Google / LINE</strong> — ไปหน้าตั้งค่าเพื่อเชื่อมบัญชีหลัก
        </p>
        <a class="pts-btn pts-btn-outline" href="Settings.html#google-calendar">${escapeHtml(settingsLabel)}</a>
      </div>
      ${enabled ? `<div class="pts-notify__actions" style="margin-top:8px;">
        <button type="button" class="pts-btn pts-btn-ghost" id="notify-cal-off-btn">ปิดการแจ้งเตือนปฏิทิน</button>
        <a class="pts-btn pts-btn-ghost" href="Schedule.html">ดูปฏิทินบนเว็บ</a>
      </div>` : `<div class="pts-notify__actions" style="margin-top:8px;">
        <a class="pts-btn pts-btn-ghost" href="Schedule.html">ดูปฏิทินบนเว็บ</a>
      </div>`}
      <p id="notify-msg" class="pts-msg" style="margin:10px 0 0;"></p>
    </div>`;

  const msgEl = () => document.getElementById('notify-msg');

  async function setCourseNotify(on, btn) {
    const msg = msgEl();
    if (btn) btn.disabled = true;
    if (msg) { msg.textContent = 'กำลังอัปเดต...'; msg.className = 'pts-msg'; }
    try {
      const res = await fetch('/api/google/course-notify', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ courseId: Number(courseId), enabled: !!on })
      });
      const data = await res.json();
      if (!res.ok || data.success === false) throw new Error(data.message || 'อัปเดตไม่สำเร็จ');

      const synced = Number(data.synced || 0);
      await mountCourseNotifyControls(hostEl);
      const msg2 = msgEl();
      if (msg2) {
        if (on && data.connected === false) {
          msg2.textContent = 'บันทึกคอร์สนี้แล้ว — กด “ไปตั้งค่าผูก Google” เพื่อเชื่อมบัญชีหลัก แล้วระบบจะส่งตารางเข้าปฏิทิน';
          msg2.className = 'pts-msg pts-msg--ok';
        } else {
          msg2.textContent = data.message || (on
            ? (synced > 0 ? `เพิ่ม ${synced} รายการเข้าปฏิทินแล้ว` : 'เปิดรับแล้ว')
            : 'ปิดการแจ้งเตือนปฏิทินแล้ว');
          msg2.className = (on && (data.pending || synced === 0))
            ? 'pts-msg pts-msg--err'
            : 'pts-msg pts-msg--ok';
        }
      }
    } catch (e) {
      if (msg) {
        msg.textContent = e.message || 'อัปเดตไม่สำเร็จ';
        msg.className = 'pts-msg pts-msg--err';
      }
      if (btn) btn.disabled = false;
    }
  }

  document.getElementById('notify-cal-btn')?.addEventListener('click', (e) => {
    const btn = e.currentTarget;
    if (enabled) {
      const msg = msgEl();
      if (msg) {
        msg.textContent = connected
          ? 'เปิดรับอยู่แล้ว — ตรวจใน Google Calendar หรือกดปิดด้านล่าง'
          : 'รอบันทึกคอร์สนี้แล้ว — ไปตั้งค่าเพื่อผูก Google ก่อน';
        msg.className = 'pts-msg pts-msg--ok';
      }
      return;
    }
    setCourseNotify(true, btn);
  });

  document.getElementById('notify-cal-off-btn')?.addEventListener('click', (e) => {
    setCourseNotify(false, e.currentTarget);
  });
}

(async () => {
  const content = document.getElementById('content');
  if (!courseId) {
    content.innerHTML = '<div class="pts-empty">ไม่พบรหัสหลักสูตร</div>';
    return;
  }
  const showLoadError = (message) => {
    content.innerHTML = `<div class="pts-empty pts-msg--err">
      <p>${escapeHtml(message || 'โหลดไม่สำเร็จ')}</p>
      <button type="button" class="pts-btn pts-btn-primary" style="margin-top:14px" id="retry-course-load">ลองโหลดอีกครั้ง</button>
    </div>`;
    document.getElementById('retry-course-load')?.addEventListener('click', () => location.reload());
  };
  try {
    const meOut = await ptsFetch('/api/users/me');
    const me = meOut.data || {};
    const courseOut = await ptsFetch(`/api/courses/${courseId}`);
    const data = courseOut.data || {};
    if (!courseOut.ok || !data.success) {
      showLoadError(data.message || 'โหลดไม่สำเร็จ');
      return;
    }
  const cRaw = data.data;
  const c = window.PTSCourseI18n ? PTSCourseI18n.localize(cRaw) : cRaw;
  if (!c.course_name) c.course_name = c.course_name_th || c.course_name_en || cRaw.course_name || '';
  if (!c.instructor_name) c.instructor_name = c.instructor_name_th || c.instructor_name_en || cRaw.instructor_name || '-';
  if (!c.description) c.description = c.description_th || c.description_en || cRaw.description || '';
  window.__ptsCourseRaw = cRaw;
  const price = Number(c.price || 0);
  const enrolled = Number(c.is_enrolled) === 1;
  const loggedIn = !!me.loggedIn;
  const favorited = Number(c.is_favorited) === 1;
  let isFavorited = favorited;
  content.innerHTML = `
    <article class="pts-card overflow-hidden">
      <div class="grid grid-cols-1 lg:grid-cols-2">
        <div class="relative min-h-[240px] lg:min-h-[420px]">
          <img class="absolute inset-0 w-full h-full object-cover" src="${c.cover_image_url || 'https://placehold.co/800x500/f8e8ec/974258?text=PTS+Course'}" alt="">
        </div>
        <div class="p-6 lg:p-8 flex flex-col">
          <div class="pts-course-card-head">
            <a class="pts-course-icon-btn" href="Courses.html" aria-label="${escapeHtml(tt('courses.backAria', 'ย้อนกลับไปรายการหลักสูตร'))}" title="${escapeHtml(tt('common.back', 'กลับ'))}">
              <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
            </a>
            ${loggedIn ? `
              <button type="button" id="fav" class="pts-course-icon-btn${isFavorited ? ' is-active' : ''}" aria-label="${escapeHtml(isFavorited ? tt('courses.favRemove', 'นำออกจากรายการโปรด') : tt('courses.favAdd', 'บันทึกรายการโปรด'))}" title="${escapeHtml(isFavorited ? tt('courses.favRemove', 'นำออกจากรายการโปรด') : tt('courses.favAdd', 'บันทึกรายการโปรด'))}">
                <span class="material-symbols-outlined" aria-hidden="true">favorite</span>
              </button>` : '<span></span>'}
          </div>
          <span class="pts-chip mb-3 w-fit">${escapeHtml(c.delivery_mode || 'course')}</span>
          <p class="text-xs font-bold tracking-[0.14em] text-primary mb-2">PTS LEARNING</p>
          <h1 class="text-3xl font-bold text-primary mb-2 pts-display" data-course-field="name">${escapeHtml(courseTitle)}</h1>
          <p class="text-sm text-on-surface-variant mb-4" data-course-field="meta">${tt('common.by', 'โดย')} ${escapeHtml(c.instructor_name || '-')} · ${Number(c.total_hours||0)} ${tt('common.hours', 'ชม.')} · ${escapeHtml(c.delivery_mode || '-')}${c.is_open_soon ? ' · ' + tt('common.comingSoon', 'เปิดเร็วๆ นี้') : ''}${c.start_date ? ' · ' + tt('common.starts', 'เริ่ม') + ' ' + escapeHtml(String(c.start_date).slice(0,10)) : ''}</p>
          <p class="text-sm text-on-surface-variant mb-4" id="course-rating-line">
          ${Number(c.average_rating || 0).toFixed(1)} ★ · ${Number(c.total_reviews || 0)} ${PTSLang.t('common.reviews')}
        </p>
          <p class="text-on-surface-variant mb-5 leading-relaxed" data-course-field="description">${escapeHtml(c.description || tt('courses.noDesc', 'ยังไม่มีคำอธิบายหลักสูตร'))}</p>
          <p class="text-2xl font-bold pts-display mb-5">${price ? price.toLocaleString((window.PTSLang && PTSLang.get() === 'en') ? 'en-US' : 'th-TH') + ' ' + escapeHtml(tt('common.baht', 'บาท')) : escapeHtml(tt('common.contactPrice', 'ติดต่อสอบถามราคา'))}</p>
          <div class="pts-course-cta-row" id="course-cta-row">
            ${!loggedIn
              ? `<a class="pts-btn pts-btn-primary" href="Login.html" data-cta="enroll-login">${escapeHtml(tt('courses.enrollLogin', 'เข้าสู่ระบบเพื่อสมัครเรียน'))}</a>`
              : enrolled
                ? `<a class="pts-btn pts-btn-primary" id="go-learn" href="Learn.html?courseId=${c.course_id}" data-cta="continue">${escapeHtml(tt('courses.continue', 'เข้าเรียน'))}</a>`
                : `<button type="button" id="pay-course" class="pts-btn pts-btn-primary" data-cta="enroll">${escapeHtml(tt('courses.enroll', 'สมัครเรียน'))}</button>`}
            ${loggedIn ? `<button type="button" id="calendar-course" class="pts-btn pts-btn-outline" data-cta="calendar"><span class="material-symbols-outlined" aria-hidden="true" style="font-size:18px;line-height:1">calendar_month</span>${escapeHtml(tt('courses.addCalendar', 'เพิ่มปฏิทิน'))}</button>` : ''}
          </div>
          <p id="course-toolbar-msg" class="pts-msg" style="margin:0 0 14px;" hidden></p>
          <div id="course-notify-host" hidden></div>
          <h2 class="font-bold mb-3">บทเรียนในหลักสูตร</h2>
          <ul class="space-y-2">${(data.lessons||[]).length
            ? (data.lessons||[]).map((l,i)=>`<li class="text-sm border border-[var(--pts-border)] rounded-xl px-3 py-2.5 flex justify-between gap-3"><span>${i+1}. ${escapeHtml(l.title || l.lesson_title || l.section_title || '')}</span><span class="text-on-surface-variant shrink-0">${l.duration_minutes||0} นาที</span></li>`).join('')
            : '<li class="text-sm text-on-surface-variant">ยังไม่มีบทเรียน — รอแอดมินเพิ่มเนื้อหา</li>'}</ul>
        </div>
      </div>
    </article>
    <section class="pts-reviews" id="reviews-section" aria-label="รีวิวหลักสูตร">
      <div class="pts-reviews__head">
        <h2 class="text-xl font-bold text-primary pts-display mb-0">รีวิวจากผู้เรียน</h2>
        <p class="pts-reviews__avg" id="reviews-summary">กำลังโหลด...</p>
      </div>
      <div id="reviews-form-host"></div>
      <div class="pts-review-list" id="reviews-list"></div>
    </section>`;

  const starsHtml = (n) => {
    const score = Math.round(Number(n) || 0);
    return `<span class="pts-stars" aria-label="${score} จาก 5 ดาว">${[1,2,3,4,5].map((i) =>
      `<span class="material-symbols-outlined${i <= score ? '' : ' is-empty'}" aria-hidden="true">star</span>`
    ).join('')}</span>`;
  };

  const fmtReviewDate = (v) => {
    if (!v) return '';
    try { return new Date(v).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }); }
    catch (_) { return ''; }
  };

  async function loadReviews() {
    const listEl = document.getElementById('reviews-list');
    const formHost = document.getElementById('reviews-form-host');
    const summaryEl = document.getElementById('reviews-summary');
    try {
      const r = await fetch(`/api/courses/${courseId}/reviews`, { credentials: 'include' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.success === false) throw new Error(j.message || 'โหลดรีวิวไม่สำเร็จ');

      const avg = Number(j.summary?.average_rating || 0).toFixed(1);
      const total = Number(j.summary?.total_reviews || 0);
      // ✅ ใช้ tt() ให้เหมือนกับจุดอื่นในโปรเจกต์
      const reviewText = tt('common.reviews', 'รีวิว');
      summaryEl.innerHTML = `${starsHtml(avg)} <strong>${avg}</strong> · ${total} ${reviewText}`;
      
      const ratingLine = document.getElementById('course-rating-line');
      if (ratingLine) ratingLine.textContent = `${avg} ★ · ${total} ${reviewText}`;

      if (!loggedIn) {
        formHost.innerHTML = `<p class="pts-review-gate">เข้าสู่ระบบ และสมัครเรียน+ชำระเงินแล้ว จึงจะรีวิวได้ · <a class="text-primary font-bold" href="Login.html">เข้าสู่ระบบ</a></p>`;
      } else if (!j.can_review) {
        formHost.innerHTML = `<p class="pts-review-gate">${escapeHtml(j.can_review_reason || 'ยังไม่สามารถรีวิวได้')}</p>`;
      } else {
        const mine = j.my_review;
        const current = mine ? Number(mine.rating) : 0;
        formHost.innerHTML = `
          <div class="pts-review-form">
            <p class="font-bold text-primary mb-2">${mine ? 'แก้ไขรีวิวของคุณ' : 'เขียนรีวิวหลักสูตรนี้'}</p>
            <label>คะแนน</label>
            <div class="pts-star-pick" id="star-pick" data-rating="${current}">
              ${[1,2,3,4,5].map((i) => `<button type="button" data-star="${i}" class="${i <= current ? 'is-on' : ''}" aria-label="${i} ดาว"><span class="material-symbols-outlined">star</span></button>`).join('')}
            </div>
            <label for="review-comment">ความคิดเห็น (ไม่บังคับ)</label>
            <textarea id="review-comment" maxlength="1000" placeholder="แชร์ประสบการณ์เรียนของคุณ...">${escapeHtml(mine?.comment || '')}</textarea>
            <div class="flex flex-wrap gap-2">
              <button type="button" class="pts-btn pts-btn-primary" id="review-submit">${mine ? 'อัปเดตรีวิว' : 'ส่งรีวิว'}</button>
              ${mine ? `<button type="button" class="pts-btn pts-btn-ghost" id="review-delete" style="color:#ba1a1a">ลบรีวิว</button>` : ''}
            </div>
            <p id="review-msg" class="pts-msg" style="margin-top:10px" hidden></p>
          </div>`;

        const pick = document.getElementById('star-pick');
        pick.querySelectorAll('button').forEach((btn) => {
          btn.onclick = () => {
            const v = Number(btn.dataset.star);
            pick.dataset.rating = String(v);
            pick.querySelectorAll('button').forEach((b) => {
              b.classList.toggle('is-on', Number(b.dataset.star) <= v);
            });
          };
        });

        document.getElementById('review-submit').onclick = async () => {
          const msg = document.getElementById('review-msg');
          const rating = Number(pick.dataset.rating || 0);
          const comment = document.getElementById('review-comment').value.trim();
          msg.hidden = false;
          if (!rating) {
            msg.textContent = 'กรุณาเลือกคะแนนดาว';
            msg.className = 'pts-msg pts-msg--err';
            return;
          }
          try {
            const res = await fetch(`/api/courses/${courseId}/reviews`, {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ rating, comment })
            });
            const out = await res.json().catch(() => ({}));
            if (!res.ok || out.success === false) throw new Error(out.message || 'ส่งรีวิวไม่สำเร็จ');
            msg.textContent = out.message || 'บันทึกแล้ว';
            msg.className = 'pts-msg pts-msg--ok';
            await loadReviews();
          } catch (err) {
            msg.textContent = err.message || 'ส่งรีวิวไม่สำเร็จ';
            msg.className = 'pts-msg pts-msg--err';
          }
        };

        document.getElementById('review-delete')?.addEventListener('click', async () => {
          if (!confirm('ลบรีวิวของคุณ?')) return;
          try {
            const res = await fetch(`/api/courses/${courseId}/reviews/me`, {
              method: 'DELETE',
              credentials: 'include'
            });
            const out = await res.json().catch(() => ({}));
            if (!res.ok || out.success === false) throw new Error(out.message || 'ลบไม่สำเร็จ');
            await loadReviews();
          } catch (err) {
            alert(err.message || 'ลบไม่สำเร็จ');
          }
        });
      }

      const rows = j.data || [];
      if (!rows.length) {
        listEl.innerHTML = '<p class="text-sm text-on-surface-variant">ยังไม่มีรีวิว — เป็นคนแรกที่รีวิวได้หลังสมัครและชำระเงิน</p>';
      } else {
        listEl.innerHTML = rows.map((rv) => `
          <article class="pts-review-item">
            <div class="pts-review-item__top">
              <span class="pts-review-item__name">${escapeHtml(rv.full_name || 'ผู้เรียน')}</span>
              <span class="pts-review-item__date">${escapeHtml(fmtReviewDate(rv.updated_at || rv.created_at))}</span>
            </div>
            ${starsHtml(rv.rating)}
            ${rv.comment ? `<p class="pts-review-item__comment">${escapeHtml(rv.comment)}</p>` : ''}
          </article>`).join('');
      }
    } catch (err) {
      summaryEl.textContent = 'โหลดรีวิวไม่สำเร็จ';
      listEl.innerHTML = `<p class="text-sm text-error">${escapeHtml(err.message || '')}</p>`;
    }
  }

  await loadReviews();

  document.getElementById('go-learn')?.addEventListener('click', async (e) => {
    e.preventDefault();
    const href = e.currentTarget.getAttribute('href') || `Learn.html?courseId=${c.course_id}`;
    try {
      const r = await fetch(`/api/forms/course/${c.course_id}/required`, { credentials: 'include' });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.success !== false && j.required && j.form?.form_id) {
        const next = encodeURIComponent(href);
        location.href = `FormFill.html?id=${j.form.form_id}&next=${next}`;
        return;
      }
    } catch (_) { /* fall through to Learn */ }
    location.href = href;
  });

  function showToolbarMsg(text, ok) {
    const msg = document.getElementById('course-toolbar-msg');
    if (!msg) return;
    msg.hidden = !text;
    msg.textContent = text || '';
    msg.className = 'pts-msg' + (text ? (ok ? ' pts-msg--ok' : ' pts-msg--err') : '');
  }

  async function enrollFreeCourse() {
    const res = await fetch(`/api/courses/${courseId}/enroll`, {
      method: 'POST',
      credentials: 'include',
      cache: 'no-store'
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || out.success === false) throw new Error(out.message || 'สมัครเรียนไม่สำเร็จ');
    showToolbarMsg(out.message || 'สมัครเรียนสำเร็จ', true);
    setTimeout(() => { location.href = `Learn.html?courseId=${c.course_id}`; }, 500);
  }

  function openPaymentModal() {
    if (!window.PTSPayModal || typeof window.PTSPayModal.open !== 'function') {
      showToolbarMsg('ระบบชำระเงินยังโหลดไม่เสร็จ กรุณารีเฟรชแล้วลองอีกครั้ง', false);
      return;
    }
    const opened = window.PTSPayModal.open({
      courseId: c.course_id,
      courseName: (window.PTSCourseI18n ? PTSCourseI18n.name(c) : (c.course_name || c.course_name_th || '')),
      price: price,
      onSuccess: () => showToolbarMsg('ชำระเงินสำเร็จ — กำลังเปิดหลักสูตร', true)
    });
    if (!opened) showToolbarMsg('ไม่สามารถเปิดหน้าชำระเงินได้ กรุณาลองอีกครั้ง', false);
  }

  const ctaRow = document.querySelector('.pts-course-cta-row');
  if (ctaRow) {
    ctaRow.addEventListener('click', async (e) => {
      const btn = e.target.closest('#pay-course');
      if (!btn || btn.disabled) return;
      e.preventDefault();
      showToolbarMsg('');
      btn.disabled = true;
      try {
        if (price > 0) {
          openPaymentModal();
        } else {
          await enrollFreeCourse();
        }
      } catch (err) {
        showToolbarMsg(err.message || 'สมัครเรียนไม่สำเร็จ', false);
      } finally {
        btn.disabled = false;
      }
    });
  }

  document.getElementById('calendar-course')?.addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    if (!enrolled) {
      showToolbarMsg('สมัครเรียนก่อน แล้วจึงเพิ่มคอร์สนี้เข้าปฏิทินได้', false);
      return;
    }

    if (btn) btn.disabled = true;
    showToolbarMsg('กำลังเพิ่มเข้าปฏิทิน...', true);
    try {
      const res = await fetch('/api/google/course-notify', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ courseId: Number(courseId), enabled: true })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) {
        throw new Error(data.message || 'เพิ่มเข้าปฏิทินไม่สำเร็จ');
      }

      const host = document.getElementById('course-notify-host');
      if (host) await mountCourseNotifyControls(host);

      if (data.connected === false) {
        showToolbarMsg(
          data.message || 'บันทึกคอร์สนี้แล้ว — ไปตั้งค่าเพื่อเชื่อม Google Calendar แล้วระบบจะส่งตารางเข้าปฏิทิน',
          true
        );
      } else {
        const synced = Number(data.synced || 0);
        const ok = synced > 0 || !data.pending;
        showToolbarMsg(
          data.message || (synced > 0 ? `เพิ่ม ${synced} รายการเข้าปฏิทินแล้ว` : 'เปิดรับแล้ว'),
          ok
        );
      }
    } catch (err) {
      showToolbarMsg(err.message || 'เพิ่มเข้าปฏิทินไม่สำเร็จ', false);
    } finally {
      if (btn) btn.disabled = false;
    }
  });

  document.getElementById('fav')?.addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
      const r = await fetch(`/api/courses/${courseId}/favorite`, { method:'POST', credentials:'include' });
      const j = await r.json();
      if (!r.ok || j.success === false) throw new Error(j.message || 'บันทึกโปรดไม่สำเร็จ');
      isFavorited = typeof j.favorited !== 'undefined' ? !!j.favorited : !isFavorited;
      btn.classList.toggle('is-active', isFavorited);
      const label = isFavorited ? tt('courses.favRemove', 'นำออกจากรายการโปรด') : tt('courses.favAdd', 'บันทึกรายการโปรด');
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    } catch (err) {
      console.error(err.message || 'บันทึกโปรดไม่สำเร็จ');
    } finally {
      btn.disabled = false;
    }
  });

  document.addEventListener('pts-lang-change', () => {
    const raw = window.__ptsCourseRaw;
    if (!raw || !window.PTSCourseI18n) return;
    const loc = PTSCourseI18n.localize(raw);

    const nameEl = document.querySelector('[data-course-field="name"]');
    const metaEl = document.querySelector('[data-course-field="meta"]');
    const descEl = document.querySelector('[data-course-field="description"]');

    if (nameEl) nameEl.textContent = loc.course_name || '';

    // 1. Meta (โดย / ชม. / เริ่ม)
    if (metaEl) {
      const startDateText = loc.start_date 
        ? ` · ${tt('common.starts', 'เริ่ม')} ${String(loc.start_date).slice(0, 10)}` 
        : '';

      metaEl.textContent = `${tt('common.by', 'โดย')} ${loc.instructor_name || '-'} · ${Number(loc.total_hours||0)} ${tt('common.hours', 'ชม.')} · ${loc.delivery_mode || '-'}${loc.is_open_soon ? ' · ' + tt('common.comingSoon', 'เปิดเร็วๆ นี้') : ''}${startDateText}`;
    }

    if (descEl) descEl.textContent = loc.description || tt('courses.noDesc', 'ยังไม่มีคำอธิบายหลักสูตร');

    // 2. ⚡ อัปเดตบรรทัด Rating + "รีวิว / Reviews" (เพิ่มจุดนี้)
    const ratingLine = document.getElementById('course-rating-line');
    if (ratingLine) {
      ratingLine.textContent = `${Number(loc.average_rating || 0).toFixed(1)} ★ · ${Number(loc.total_reviews || 0)} ${tt('common.reviews', 'รีวิว')}`;
    }

    // 3. ⚡ อัปเดตบรรทัด ราคา + "บาท / THB" (เพิ่มจุดนี้)
    const priceEl = document.querySelector('.text-2xl.font-bold.pts-display.mb-5');
    if (priceEl) {
      const priceVal = Number(loc.price || 0);
      const isEn = window.PTSLang && typeof PTSLang.get === 'function' && PTSLang.get() === 'en';
      priceEl.textContent = priceVal 
        ? `${priceVal.toLocaleString(isEn ? 'en-US' : 'th-TH')} ${tt('common.baht', 'บาท')}` 
        : tt('common.contactPrice', 'ติดต่อสอบถามราคา');
    }

    // 4. ปุ่ม CTA ต่างๆ
    const enrollLogin = document.querySelector('[data-cta="enroll-login"]');
    if (enrollLogin) enrollLogin.textContent = tt('courses.enrollLogin', 'เข้าสู่ระบบเพื่อสมัครเรียน');

    const cont = document.querySelector('[data-cta="continue"]');
    if (cont) cont.textContent = tt('courses.continue', 'เข้าเรียน');

    const enroll = document.querySelector('[data-cta="enroll"]');
    if (enroll) enroll.textContent = tt('courses.enroll', 'สมัครเรียน');

    const cal = document.querySelector('[data-cta="calendar"]');
    if (cal) {
      cal.innerHTML = `<span class="material-symbols-outlined" aria-hidden="true" style="font-size:18px;line-height:1">calendar_month</span>${escapeHtml(tt('courses.addCalendar', 'เพิ่มปฏิทิน'))}`;
    }

    const favBtn = document.getElementById('fav');
    if (favBtn) {
      const on = favBtn.classList.contains('is-active');
      const label = on ? tt('courses.favRemove', 'นำออกจากรายการโปรด') : tt('courses.favAdd', 'บันทึกรายการโปรด');
      favBtn.setAttribute('aria-label', label);
      favBtn.setAttribute('title', label);
    }

    // 5. ⚡ สั่งโหลดการ์ดสรุปรีวิวข้างล่างใหม่ให้แปลตามทันที
    if (typeof loadReviews === 'function') loadReviews();
  });

  if (loggedIn && enrolled) {
    await mountCourseNotifyControls(document.getElementById('course-notify-host'));
  }
  } catch (err) {
    showLoadError(err.message || 'โหลดไม่สำเร็จ — ลองรีเฟรชอีกครั้ง');
  }
})();
</script>

      + '<a href="Home.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--pts-text,#1c1520);font-weight:700">'
      + '<img src="/logo.png" alt="PTS Learning" style="height:42px;width:auto;max-width:160px;object-fit:contain;display:block">PTS Learning</a>'
      + '<div style="display:flex;gap:8px">'
      + '<a href="Login.html" style="padding:8px 14px;border:1px solid #ca1156;border-radius:999px;color:#ca1156;text-decoration:none;font-weight:700;font-size:14px">เข้าสู่ระบบ</a>'
      + '<a href="Register.html" style="padding:8px 14px;background:#ca1156;border-radius:999px;color:#fff;text-decoration:none;font-weight:700;font-size:14px">สมัครสมาชิก</a>'
      + '</div></div></nav>';
  }
})();
</script>
